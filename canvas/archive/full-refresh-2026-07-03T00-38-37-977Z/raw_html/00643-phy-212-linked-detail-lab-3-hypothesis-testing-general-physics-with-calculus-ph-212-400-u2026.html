re-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e = \u003cimg class=\"equation_image\" title=\"I = \\frac{1}{2}(r^2_{inner}+r^2_{outer})/r^2_{outer}\" src=\"https://canvas.oregonstate.edu/equation_images/I%2520%253D%2520%255Cfrac%257B1%257D%257B2%257D(r%255E2_%257Binner%257D%252Br%255E2_%257Bouter%257D)%252Fr%255E2_%257Bouter%257D?scale=1\" alt=\"LaTeX: I = \\frac{1}{2}(r^2_{inner}+r^2_{outer})/r^2_{outer}\" data-equation-content=\"I = \\frac{1}{2}(r^2_{inner}+r^2_{outer})/r^2_{outer}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eI\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmsubsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ei\u003c/mi\u003e\n      \u003cmi\u003en\u003c/mi\u003e\n      \u003cmi\u003en\u003c/mi\u003e\n      \u003cmi\u003ee\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msubsup\u003e\n  \u003cmo\u003e+\u003c/mo\u003e\n  \u003cmsubsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ee\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msubsup\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmo\u003e/\u003c/mo\u003e\n  \u003c/mrow\u003e\n  \u003cmsubsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ee\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msubsup\u003e\n\u003c/math\u003e\"\u003e\u003c/li\u003e\n\u003cli\u003eSolid cylinder: \u003cimg class=\"equation_image\" title=\"\\kappa\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ckappa?scale=1\" alt=\"LaTeX: \\kappa\" data-equation-content=\"\\kappa\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e = 1/2\u003c/li\u003e\n\u003cli\u003eSolid sphere: \u003cimg class=\"equation_image\" title=\"\\kappa\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ckappa?scale=1\" alt=\"LaTeX: \\kappa\" data-equation-content=\"\\kappa\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e = 2/5\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e(Note that mass cancels out of this expression; only the geometry via \u003cimg class=\"equation_image\" title=\"\\kappa\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ckappa?scale=1\" alt=\"LaTeX: \\kappa\" data-equation-content=\"\\kappa\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp;matters.)\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eAfter leaving the table, the object is no longer rolling and undergoes projectile motion. Assuming negligible air resistance and an initial horizontal velocity \u003cimg class=\"equation_image\" title=\"v_0\" src=\"https://canvas.oregonstate.edu/equation_images/v_0?scale=1\" alt=\"LaTeX: v_0\" data-equation-content=\"v_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e, the horizontal displacement is given by\u003c/p\u003e\n\u003cp\u003e\u003cimg class=\"equation_image\" style=\"display: block; margin-left: auto; margin-right: auto;\" title=\"\\Delta x = v_0 \\Delta t\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520x%2520%253D%2520v_0%2520%255CDelta%2520t?scale=1\" alt=\"LaTeX: \\Delta x = v_0 \\Delta t\" data-equation-content=\"\\Delta x = v_0 \\Delta t\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ex\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003et\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/p\u003e\n\u003cp\u003eWhere \u003cimg class=\"equation_image\" title=\"\\Delta t\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520t?scale=1\" alt=\"LaTeX: \\Delta t\" data-equation-content=\"\\Delta t\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003et\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp;only depends on the table height, \u003cimg class=\"equation_image\" title=\"y\" src=\"https://canvas.oregonstate.edu/equation_images/y?scale=1\" alt=\"LaTeX: y\" data-equation-content=\"y\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ey\u003c/mi\u003e\n\u003c/math\u003e\"\u003e, and \u003cimg class=\"equation_image\" title=\"g\" src=\"https://canvas.oregonstate.edu/equation_images/g?scale=1\" alt=\"LaTeX: g\" data-equation-content=\"g\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eg\u003c/mi\u003e\n\u003c/math\u003e\"\u003e: \u003cimg class=\"equation_image\" title=\"\\Delta t = \\sqrt{\\frac{2y}{g}}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520t%2520%253D%2520%255Csqrt%257B%255Cfrac%257B2y%257D%257Bg%257D%257D?scale=1\" alt=\"LaTeX: \\Delta t = \\sqrt{\\frac{2y}{g}}\" data-equation-content=\"\\Delta t = \\sqrt{\\frac{2y}{g}}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003et\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsqrt\u003e\n    \u003cmfrac\u003e\n      \u003cmrow\u003e\n        \u003cmn\u003e2\u003c/mn\u003e\n        \u003cmi\u003ey\u003c/mi\u003e\n      \u003c/mrow\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mfrac\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ1\u003c/span\u003e: Form a hypothesis to predict the horizontal range and how the range scales with objects with different inertia.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eSubstitute the expression for \u003c/strong\u003e\u003cimg class=\"equation_image\" title=\"v_0\" src=\"https://canvas.oregonstate.edu/equation_images/v_0?scale=1\" alt=\"LaTeX: v_0\" data-equation-content=\"v_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e\u003cstrong\u003e\u003c/strong\u003e\u003cstrong\u003einto the projectile-motion equation to obtain a theoretical prediction for \u003cimg class=\"equation_image\" title=\"\\Delta x\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520x?scale=1\" alt=\"LaTeX: \\Delta x\" data-equation-content=\"\\Delta x\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ex\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e in terms of \u003cimg class=\"equation_image\" title=\"\\Delta h\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520h?scale=1\" alt=\"LaTeX: \\Delta h\" data-equation-content=\"\\Delta h\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003eh\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e, \u003cimg class=\"equation_image\" title=\"y\" src=\"https://canvas.oregonstate.edu/equation_images/y?scale=1\" alt=\"LaTeX: y\" data-equation-content=\"y\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ey\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e, and \u003cimg class=\"equation_image\" title=\"\\kappa\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ckappa?scale=1\" alt=\"LaTeX: \\kappa\" data-equation-content=\"\\kappa\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e. \u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eBased on your equation, describe how the horizontal range \u003cimg class=\"equation_image\" title=\"\\Delta x\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520x?scale=1\" alt=\"LaTeX: \\Delta x\" data-equation-content=\"\\Delta x\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ex\u003c/mi\u003e\n\u003c/math\u003e\"\u003e \u003c/strong\u003e\u003cstrong\u003eis expected to depend on the inertia of the object.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 2: Plan the Experiment\u003c/h2\u003e\n\u003cp\u003eIn this experiment, you will test how the launch distance depends on rotational inertia by rolling three different objects from the same starting height \u003cimg class=\"equation_image\" title=\"h\" src=\"https://canvas.oregonstate.edu/equation_images/h?scale=1\" alt=\"LaTeX: h\" data-equation-content=\"h\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eh\u003c/mi\u003e\n\u003c/math\u003e\"\u003e. Each object accelerates down the ramp, leaves the table with a horizontal launch velocity, and then lands on the floor in free fall. For each object, you will measure the horizontal distance \u003cimg class=\"equation_image\" title=\"d\" src=\"https://canvas.oregonstate.edu/equation_images/d?scale=1\" alt=\"LaTeX: d\" data-equation-content=\"d\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n\u003c/math\u003e\"\u003e, and compare the measured ranges both to one another and to the theoretical model that predicts how \u003cimg class=\"equation_image\" title=\"d\" src=\"https://canvas.oregonstate.edu/equation_images/d?scale=1\" alt=\"LaTeX: d\" data-equation-content=\"d\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n\u003c/math\u003e\"\u003e scales with \u003cimg class=\"equation_image\" title=\"\\kappa\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ckappa?scale=1\" alt=\"LaTeX: \\kappa\" data-equation-content=\"\\kappa\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e. Refer to Figure 2 for a diagram of the setup. Refer to Table 1 for a list of moments of inertia for common objects.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ2\u003c/span\u003e: What data do you need to collect in order to confirm the hypotheses – or in other words, what quantities will you need to measure and how many trials will you test? List the steps you will follow to collect your data.\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eAs you learned in the previous lab, all measurements have inherent uncertainty – there is a limit to what we can know about the measurand. For your reference, here is the list of common sources of uncertainty to consider:\u003c/p\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003ethe effects of environmental conditions on the measurement\u003c/li\u003e\n\u003cli\u003eyour judgement in reading analogue instruments\u003c/li\u003e\n\u003cli\u003ethe sensitivity of your instruments (e.g. the digital scale)\u003c/li\u003e\n\u003cli\u003ethe rating or stated calibration of the instrument\u003c/li\u003e\n\u003cli\u003eapproximations and assumptions that you make while doing the experiment\u003c/li\u003e\n\u003cli\u003evariations in repeated readings made under apparently identical conditions\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ3\u003c/span\u003e: Consider sources of uncertainty in your planned experiment.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eYou will be measuring the distance \u003cimg class=\"equation_image\" title=\"d\" src=\"https://canvas.oregonstate.edu/equation_images/d?scale=1\" alt=\"LaTeX: d\" data-equation-content=\"d\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003ethat the object travels. Which items from the list above are likely to be a significant source of uncertainty in your individual measurements?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eFor each source you said was significant, estimate a value for the uncertainty associated with it and provide a justification for that value. Then, combine the values by adding them in quadrature.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤ \u0026nbsp;\u003c/span\u003e\u003c/strong\u003eRemember, independent uncertainties add in quadrature using the formula \u003cimg class=\"equation_image\" title=\"\\Delta t_{total} = \\sqrt{(\\Delta t_1)^2 + (\\Delta t_2)^2 + ...}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520t_%257Btotal%257D%2520%253D%2520%255Csqrt%257B(%255CDelta%2520t_1)%255E2%2520%252B%2520(%255CDelta%2520t_2)%255E2%2520%252B%2520...%257D?scale=1\" alt=\"LaTeX: \\Delta t_{total} = \\sqrt{(\\Delta t_1)^2 + (\\Delta t_2)^2 + ...}\" data-equation-content=\"\\Delta t_{total} = \\sqrt{(\\Delta t_1)^2 + (\\Delta t_2)^2 + ...}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003et\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003el\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsqrt\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmn\u003e1\u003c/mn\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n    \u003cmo\u003e+\u003c/mo\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n    \u003cmo\u003e+\u003c/mo\u003e\n    \u003cmo\u003e.\u003c/mo\u003e\n    \u003cmo\u003e.\u003c/mo\u003e\n    \u003cmo\u003e.\u003c/mo\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 3: Collect Data\u003c/h3\u003e\n\u003cp\u003eYou are now ready to perform your experiment.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eProcedure\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706000/preview\" alt=\"Inclined plane setup\u0026nbsp;for rolling objects\u0026nbsp;so they enter free-fall, featuring\u0026nbsp;a\u0026nbsp;wooden table with a stack of books forming a raised\u0026nbsp;platform supporting\u0026nbsp;a cardboard ramp.\u0026nbsp;A hand holds a roll of black tape against a\u0026nbsp;silver guide rail at the top\u0026nbsp;of the ramp (a clipboard in this example), with\u0026nbsp;a\u0026nbsp;pink eraser as a guide rail. A post card stands\u0026nbsp;upright at\u0026nbsp;the ramp's base. On the\u0026nbsp;concrete floor below, a piece of aluminum paper acting as collision\u0026nbsp;paper is taped down to the left, and a flat white\u0026nbsp;reference paper is\u0026nbsp;taped to its right. A circular inset provides a magnified\u0026nbsp;view of the object, guide rail,\u0026nbsp;and hand at the ramp's top.\" width=\"458\" height=\"513\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706000\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003eFigure 2: Inclined plane setup for rolling objects so they enter free-fall.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSelect and prepare a horizontal launch surface.\u003c/strong\u003e\u003cbr\u003eUse a level or phone app to check if the table or elevated surface is horizontal. If it's not, adjust it or find another surface.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eBuild your inclined plane.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eCreate a ramp that makes an angle between 20° and 45° with the horizontal. Secure it so that its bottom end stops a few centimeters before the edge of the table.\u003c/p\u003e\n\u003col start=\"3\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eSmooth the transition to the table.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eTape a card or thin surface to the bottom of the ramp to help the object roll smoothly onto the horizontal surface. This ensures the object exits the table with mostly horizontal velocity.\u003c/p\u003e\n\u003col start=\"4\"\u003e\n\u003cli\u003e\u003cstrong\u003eMeasure the ramp angle.\u003c/strong\u003e\u003cbr\u003eCarefully measure the angle of inclination using a protractor or app. Adjust and rebuild as needed to stay within the 20–45° range.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706002/preview\" alt=\"How to find the edge of\u0026nbsp;the table: Two-part\u0026nbsp;photograph showing a method to\u0026nbsp;establish a vertical reference line. Left side shows a top-down view of\u0026nbsp;a wooden table with a dark\u0026nbsp;braided string\u0026nbsp;taped to the\u0026nbsp;surface and hanging vertically\u0026nbsp;over the edge, with its\u0026nbsp;end suspended above a\u0026nbsp;white paper taped to the floor below. Right side\u0026nbsp;shows a close-up\u0026nbsp;of a hand holding\u0026nbsp;a yellow pencil tied to the\u0026nbsp;same string, drawing a\u0026nbsp;straight\u0026nbsp;black line\u0026nbsp;on white paper taped to the floor,\u0026nbsp;demonstrating how\u0026nbsp;to mark the table's edge\u0026nbsp;position\u0026nbsp;vertically below.\" width=\"523\" height=\"276\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706002\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003eFigure 3: How to find the edge of the table\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003col start=\"5\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eMark the edge of the table.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eHang a string with a small object (like a paperclip) over the edge to find a vertical reference point. Let it settle, then mark the spot directly below it on the floor or on a landing sheet. This helps with accurate horizontal distance measurements.\u003c/p\u003e\n\u003cp\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706001/preview\" alt=\"When a coin lands\u0026nbsp;on aluminum foil, it leaves\u0026nbsp;an impression which\u0026nbsp;indicates\u0026nbsp;how far it travelled in free\u0026nbsp;fall. A hand holds a\u0026nbsp;silver quarter over a\u0026nbsp;highly crumpled and\u0026nbsp;reflective aluminum foil\u0026nbsp;sheet, demonstrating the setup\u0026nbsp;for measuring impact\u0026nbsp;depth as a function of fall\u0026nbsp;distance.\" width=\"390\" height=\"295\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706001\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003eFigure 4: When a coin lands on aluminum foil, it leaves an impression which indicates how far it travelled in free fall.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003col start=\"6\"\u003e\n\u003cli\u003e\u003cstrong\u003ePrepare the landing area.\u003c/strong\u003e\u003cbr\u003ePredict where the object will land, then place a large sheet of foil, carbon copy paper, or other marking material on the floor in that area. Foil should be placed on a soft surface like a towel; carbon paper should be on a hard surface.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eConduct your first trial.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003ePlace the object at the top of the ramp and release it without pushing. It should roll down, travel across the horizontal surface, and launch off the edge.\u003c/p\u003e\n\u003col start=\"8\"\u003e\n\u003cli\u003e\u003cstrong\u003eMark and measure the landing point.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eRecord where the object hits the landing surface. Measure the horizontal distance \u003cem\u003ed\u003c/em\u003e from the table edge to the landing point.\u003c/p\u003e\n\u003col start=\"9\"\u003e\n\u003cli\u003e\u003cstrong\u003eRepeat the trial for the same height.\u003c/strong\u003e\u003cbr\u003eConduct multiple trials (e.g., 3 or more) for the same starting height to account for variation and improve reliability.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eRepeat for additional objects.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eUsing the same starting height, repeat steps 7–9 for each of the remaining objects. Ensure that all objects are released from the same position on the ramp so that they begin with the same drop height. Record the horizontal range for each object to compare how the launch distance depends on rotational inertia.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ4\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eFor each run that you do, record your measurements in the form of a data table with labeled columns, including units. This should include only what you measured (no analysis/calculations). It should also include the uncertainty in each measurement, which you estimated for one of the questions in Part 2. You can report each value in \u003cem\u003eA ± ∆A\u003c/em\u003e format, or you can use separate columns with your measurement in one column and the uncertainty in another. Include each group member’s table in your report.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 4: Analyze the Data and Compare Results\u003c/h3\u003e\n\u003cp\u003eIn this section, you will analyze your measured data by comparing experimental results to theoretical predictions. You will quantify how closely your measurements match the model, examine the size and direction of any discrepancies, and evaluate whether the observed trends are consistent with the predicted dependence on rotational inertia.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ5\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eQuantify the difference between your results and your theoretical predictions.\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eUsing your measured ramp height \u003cimg class=\"equation_image\" title=\"h\" src=\"https://canvas.oregonstate.edu/equation_images/h?scale=1\" alt=\"LaTeX: h\" data-equation-content=\"h\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eh\u003c/mi\u003e\n\u003c/math\u003e\"\u003e \u003c/strong\u003e\u003cstrong\u003eand table drop height \u003cimg class=\"equation_image\" title=\"\\Delta y\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520y?scale=1\" alt=\"LaTeX: \\Delta y\" data-equation-content=\"\\Delta y\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ey\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e, compute the theoretical horizontal range for each object.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eCompare your theoretical and measured values by computing the percent difference: \u003cimg class=\"equation_image\" title=\"\\% difference=\\frac{d_{measured}-d_{theory}}{d_{theory}}\\times100\" src=\"https://canvas.oregonstate.edu/equation_images/%255C%2525%2520difference%253D%255Cfrac%257Bd_%257Bmeasured%257D-d_%257Btheory%257D%257D%257Bd_%257Btheory%257D%257D%255Ctimes100?scale=1\" alt=\"LaTeX: \\% difference=\\frac{d_{measured}-d_{theory}}{d_{theory}}\\times100\" data-equation-content=\"\\% difference=\\frac{d_{measured}-d_{theory}}{d_{theory}}\\times100\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0025;\u003c!-- % --\u003e\u003c/mi\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n  \u003cmi\u003ei\u003c/mi\u003e\n  \u003cmi\u003ef\u003c/mi\u003e\n  \u003cmi\u003ef\u003c/mi\u003e\n  \u003cmi\u003ee\u003c/mi\u003e\n  \u003cmi\u003er\u003c/mi\u003e\n  \u003cmi\u003ee\u003c/mi\u003e\n  \u003cmi\u003en\u003c/mi\u003e\n  \u003cmi\u003ec\u003c/mi\u003e\n  \u003cmi\u003ee\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmrow\u003e\n      \u003cmsub\u003e\n        \u003cmi\u003ed\u003c/mi\u003e\n        \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n          \u003cmi\u003em\u003c/mi\u003e\n          \u003cmi\u003ee\u003c/mi\u003e\n          \u003cmi\u003ea\u003c/mi\u003e\n          \u003cmi\u003es\u003c/mi\u003e\n          \u003cmi\u003eu\u003c/mi\u003e\n          \u003cmi\u003er\u003c/mi\u003e\n          \u003cmi\u003ee\u003c/mi\u003e\n          \u003cmi\u003ed\u003c/mi\u003e\n        \u003c/mrow\u003e\n      \u003c/msub\u003e\n      \u003cmo\u003e\u0026amp;#x2212;\u003c!-- − --\u003e\u003c/mo\u003e\n      \u003cmsub\u003e\n        \u003cmi\u003ed\u003c/mi\u003e\n        \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n          \u003cmi\u003et\u003c/mi\u003e\n          \u003cmi\u003eh\u003c/mi\u003e\n          \u003cmi\u003ee\u003c/mi\u003e\n          \u003cmi\u003eo\u003c/mi\u003e\n          \u003cmi\u003er\u003c/mi\u003e\n          \u003cmi\u003ey\u003c/mi\u003e\n        \u003c/mrow\u003e\n      \u003c/msub\u003e\n    \u003c/mrow\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003ed\u003c/mi\u003e\n      \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n        \u003cmi\u003et\u003c/mi\u003e\n        \u003cmi\u003eh\u003c/mi\u003e\n        \u003cmi\u003ee\u003c/mi\u003e\n        \u003cmi\u003eo\u003c/mi\u003e\n        \u003cmi\u003er\u003c/mi\u003e\n        \u003cmi\u003ey\u003c/mi\u003e\n      \u003c/mrow\u003e\n    \u003c/msub\u003e\n  \u003c/mfrac\u003e\n  \u003cmo\u003e\u0026amp;#x00D7;\u003c!-- × --\u003e\u003c/mo\u003e\n  \u003cmn\u003e100\u003c/mn\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eUse your range experimental uncertainty to determine whether your measurements are consistent with the theoretical prediction. State yes/no and briefly explain. \u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eRank your three objects from largest to smallest value of inertia and rank your three objects from largest to smallest measured range. Do these rankings match what you expect? \u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ6\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eInterpret the difference between theory and experiment. For each object, identify the direction of the discrepancy:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003e\u003cstrong\u003eConsistent with uncertainty (no clear difference from theory)\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSmall but systematic (always larger or always smaller than theory)\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLarge compared to uncertainty\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eAfter completing your individual analysis, compare results with your group to look for patterns that may not be visible in a single data set. By examining similarities and differences across group members, you will identify shared trends, systematic effects, and variations that help clarify how well the theoretical model describes the physical system.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ7\u003c/span\u003e: Look for group level trends within your data. \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eAcross your group, do most groupmates see the same direction of discrepancy?\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eIs the experimental range mostly larger than predicted? Mostly smaller? Or mixed depending on object?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eIs the discrepancy similar across all three objects, or does it depend on inertia?\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eLarger/smaller deviations for objects with higher/lower inertia? No clear pattern?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eDoes every groupmate have the same ranking of ranges?\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eIf not, what do you notice?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 5: Draw Conclusions\u003c/h3\u003e\n\u003cp\u003eIn this section, you will interpret your results by considering physical effects that were not included in the ideal theoretical model. By examining trends across objects and the size and direction of discrepancies between measured and predicted values, you will evaluate how real-world mechanisms influence the motion and help explain why experimental results may differ from ideal predictions.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ8\u003c/span\u003e: Interpret the physical meaning of the trends in your group. If your measured distances are larger than theory predicts, what assumption in the model might be under-estimating the launch speed? If distances are smaller than predicted, where might energy have been lost before launch, or motion deviated from ideal projectile motion? If the direction of discrepancy differs between objects, do the discrepancies depend on rotational inertia? If so, what does that suggest about how realistic the rolling-without-slipping assumption is for each object? Consider these mechanisms:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003e\u003cu\u003eRolling friction:\u003c/u\u003e\u003c/strong\u003e\u003cstrong\u003e Would increased rolling friction affect all objects the same way, or would it depend on their shape or inertia?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003e\u003cu\u003eWobble or vibration (especially hollow objects):\u003c/u\u003e\u003c/strong\u003e\u003cstrong\u003e Do any of your objects wobble or rattle while rolling? If so, how might that motion change how the object’s energy is distributed?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003e\u003cu\u003eLaunch not perfectly horizontal:\u003c/u\u003e\u003c/strong\u003e\u003cstrong\u003e If the object leaves the table at a slight upward or downward angle instead of perfectly horizontal, how would that change the range?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003e\u003cu\u003eAir drag / flight effects:\u003c/u\u003e\u003c/strong\u003e\u003cstrong\u003e If drag plays a role, would it affect faster-moving objects more or less than slower ones?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003e\u003cu\u003eEnergy lost before leaving the table:\u003c/u\u003e\u003c/strong\u003e\u003cstrong\u003e Is there any part of the motion where the object might still be losing energy even after leaving the ramp? How could you tell?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ9\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eExplain which of the mechanisms listed above is most consistent with your data.\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWhich mechanism best explains the direction of your discrepancy? \u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eDoes your explanation predict the same trend for all three objects? \u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eIf the mechanism(s) were the dominant cause, what else would you expect to see in the data? \u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWhat additional measurement could help you test whether your explanation is correct?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ10\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eDo your results support the hypotheses? Write an evidence-based conclusion.\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eDo your measured values agree with the theoretical values within experimental uncertainty? If they do not agree exactly, do the differences show a consistent pattern (for example, measured values mostly larger, mostly smaller, or varying with rotational inertia)?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eDid your measured ordering of ranges match the predicted ordering based on the inertia of the objects? Was this trend consistent across your group members?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤ \u003c/span\u003e\u003c/strong\u003eBased on your discussion of Q8 and Q9 and, make sure to mention here any direction and size of the discrepancies you observed and any physical mechanisms that could reasonably explain why your results differ\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 6: Reflect on the activity\u0026nbsp;\u003c/h3\u003e\n\u003cp\u003eIn this lab, you used experimental data to test theoretical predictions rather than to obtain a single “correct” value. This reflection is intended to help you think about how hypotheses are evaluated using evidence, trends, and comparisons, and how discrepancies between theory and experiment can inform your understanding of the physical system.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ11\u003c/span\u003e: \u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eEach lab member should write an individual concise paragraph reflecting on the lab. Identify each contribution by name. Each should specifically address the following:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003e\u003cstrong\u003eBefore starting this lab, what did you think would determine how far each object would travel? After analyzing your data, including any differences between theory and experiment, how did your understanding change about which physical factors actually matter?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWhich comparison helped you most in deciding whether the hypotheses were supported (comparing individual values, comparing trends across objects, or comparing results across your group)? Why do you think that comparison was most informative?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 7: Capstone Component – Conclusion\u003c/h3\u003e\n\u003cp\u003eIn scientific writing, the Conclusion section is where you interpret your results and explain what they reveal about the physical system being studied. Rather than repeating calculations, a strong conclusion connects your experimental evidence back to the original hypotheses, evaluates how well the theoretical model describes the data, and considers the role of uncertainty and non-ideal physical effects. This section demonstrates how experimental results are used to assess the validity of a model.\u003c/p\u003e\n\u003cp\u003eIn this activity, you will write a complete Conclusion section based on your group’s investigation of how the horizontal launch distance of a rolling object depends on its rotational inertia. You will use trends in your data, comparisons to theoretical predictions, and discussion of discrepancies to determine whether the hypotheses are supported.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ12\u003c/span\u003e: Write a Conclusion section for this lab experiment. Refer below for guidance on what to include in the Conclusion.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cspan style=\"font-family: 'times new roman', times;\"\u003eII. \u003c/span\u003e\u003c/span\u003e\u003cu\u003eConclusion Structure:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\n\u003col style=\"background: whitesmoke; border-left: 6px solid #d73f09; padding: 15px; margin: 20px 0 25px 0;\"\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003eRestate the Purpose (1–2 sentences) \u003cem\u003eWhat was the physical situation you were testing?\u003c/em\u003e\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat was the goal of the experiment involving rolling objects and projectile motion?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat two hypotheses were you testing about how the horizontal launch distance depends on rotational inertia?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSummary of Key Results (2–4 sentences)\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eHow did the measured horizontal ranges compare for objects with different values of inertia?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eDid the ordering of measured ranges match the predicted ordering based on inertia?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eHow closely did the measured values agree with the theoretical predictions overall?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eInterpretation of Results (2–3 sentences)\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u0026nbsp; Indicate which tables best communicate your group’s results and their associated uncertainty intervals or include them again here.\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLimitations and Uncertainty (1–2 sentences) \u003cem\u003eWere there sources of error or assumptions in your setup that could have affected the result?\u003c/em\u003e\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhich physical mechanisms not included in the ideal model (e.g., rolling friction, wobble, launch angle, energy losses) are most likely to have affected your results? Did these effects appear to depend on the object’s inertia?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eClosing Reflection (1–2 sentences)\u0026nbsp;\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003eWhat did this experiment help you understand about using trends and uncertainty to evaluate a theoretical model?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003eHow confident are you in your conclusions, and what change would most improve the test of the hypotheses in a future experiment?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 8: Lab Group Check-In Survey\u003c/h3\u003e\n\u003cp\u003eThis short survey helps your TA monitor group dynamics and support you during the labs. Please answer honestly about how your group is working together. Your responses will remain anonymous unless you choose to include your name. The survey is worth 5 points toward your lab grade and is graded only on completion, not on the content of your answers. Use this as a chance to raise any concerns to your TA (for example, if group members are not contributing to the lab report) or if you would like your TA to address anything during your lab meetings. Please complete this survey by the same deadline as your lab report submission.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca title=\"Lab Group Check-In Survey (Lab 2)\" href=\"https://canvas.oregonstate.edu/courses/2053526/quizzes/3160510\" data-course-type=\"quizzes\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/quizzes/3160510\" data-api-returntype=\"Quiz\"\u003eLab Group Check-In Survey (Lab 3)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 9: Submit Your Group’s Lab Report\u003c/h3\u003e\n\u003cp\u003eMake sure everyone’s name is on your group’s lab report. If you submit through Gradescope, remember to add everyone in your group to the assignment. This is done at the end of the submission process.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca class=\"inline_disabled external\" href=\"https://help.gradescope.com/article/m5qz2xsnjy-student-add-group-members\" target=\"_blank\"\u003e\u003cspan\u003eHow to add group members to your submission in Gradescope is outlined here\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003eAppendix – Reference Information\u003c/h3\u003e\n\u003cp\u003eThis section contains key information from previous labs:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eWhat is Uncertainty?\u003c/li\u003e\n\u003cli\u003eSources of Uncertainty\u003c/li\u003e\n\u003cli\u003eVariables and Parameters\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eWhat is Uncertainty?\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eUncertainty\u003c/em\u003e is the acknowledgement that we cannot measure things exactly, and so any conclusion based on measurements will always include a range of possible answers. When making a measurement, there is no single “true value” of the measurand (measured quantity) that we can determine. Instead, we can define an interval that defines the range of values that we think are probable for the measurand. The narrower the interval, the more precisely we can approximate the measurand.\u003c/p\u003e\n\u003cp\u003eWhen including uncertainty in a value, we report it as \u003cstrong\u003eA ± Δ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. We believe the value is \u003cstrong\u003eA\u003c/strong\u003e, but we’re unable to rule out the possibility that it’s higher or lower by an amount \u003cstrong\u003eΔ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. (Sometimes it’s written +Δ\u003csub\u003e1\u003c/sub\u003e / -Δ\u003csub\u003e2\u003c/sub\u003e if the higher and lower ranges are different.) For example, a time might be reported as 2.45 s ± 0.03 s.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eSources of Uncertainty:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe uncertainty in a measurement can be due to a combination of several factors. A crucial aspect of experimentation is to identify all such sources of uncertainty and to numerically estimate their effect on your measurement result.\u003c/p\u003e\n\u003cp\u003eCommon sources of uncertainty include:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ethe effects of environmental conditions on the measurement\u003c/li\u003e\n\u003cli\u003eyour judgement in reading analogue instruments\u003c/li\u003e\n\u003cli\u003ethe sensitivity of your instruments (e.g. the digital scale)\u003c/li\u003e\n\u003cli\u003ethe rating or stated calibration of the instrument\u003c/li\u003e\n\u003cli\u003eapproximations and assumptions that you make while doing the experiment\u003c/li\u003e\n\u003cli\u003evariations in repeated readings made under apparently identical conditions\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eVariables and Parameters\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIt will help you when designing your experiment to think about the different types of numerical quantities that are involved. It will make your explanation clearer if you label the different quantities appropriately.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eIndependent variable\u003c/em\u003e: In an experiment you will usually vary one quantity at a time in a controlled manner. This is the independent variable. Typically, you’re trying to discover how the independent variable affects the system.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eDependent variables\u003c/em\u003e: Your hypothesis should predict the behavior of other quantities in your system as the independent variable is changed. These other quantities are referred to as the dependent variables because their values depend on the value of the independent variable.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eParameters\u003c/em\u003e: There are other quantities you should specify because they may influence your results, but that will remain fixed throughout the experiment. These are referred to as parameters. Examples could be the length of a track or the mass of an object. The key is that a parameter doesn’t change at any time in the experiment.\u003c/p\u003e\n\u003cp\u003eIn short, parameters are fixed, and variables change. The change is either under your control (independent) or a response to the experiment (dependent).\u003c/p\u003e\n\u003c/div\u003e"},"WIKI_PAGE_REVISION":"3","WIKI_PAGE_SHOW_PATH":"/courses/2053526/pages/lab-3-hypothesis-testing","WIKI_PAGE_EDIT_PATH":"/courses/2053526/pages/lab-3-hypothesis-testing/edit","WIKI_PAGE_HISTORY_PATH":"/courses/2053526/pages/lab-3-hypothesis-testing/revisions","COURSE_ID":"2053526","MODULES_PATH":"/courses/2053526/modules","wiki_page_menu_tools":[],"wiki_index_menu_tools":[],"DISPLAY_SHOW_ALL_LINK":false,"CAN_SET_TODO_DATE":false,"ALLOW_ASSIGN_TO_DIFFERENTIATION_TAGS":true,"CAN_MANAGE_DIFFERENTIATION_TAGS":false,"EDITOR_FEATURE":null,"VALID_DATE_RANGE":{"start_at":{"date":"2026-06-21T07:00:00Z","date_context":"course"},"end_at":{"date":"2026-09-21T07:00:00Z","date_context":"course"}},"SECTION_LIST":[{"id":"2337362","name":"GENERAL PHYSICS WITH CALCULUS (PH_212_400_U2026)","start_at":null,"end_at":null,"override_course_and_term_dates":false}],"TITLE_AVAILABILITY_PATH":"/api/v1/courses/2053526/page_title_availability","ai_alt_text_generation_url":null,"badge_counts":{"submissions":10},"notices":[],"active_context_tab":"pages"};
