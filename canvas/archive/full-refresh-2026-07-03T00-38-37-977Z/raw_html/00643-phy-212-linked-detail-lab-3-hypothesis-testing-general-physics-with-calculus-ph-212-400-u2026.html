03e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003ePH212 – General Physics with Calculus\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eExperimental goal: Determine whether the measured horizontal launch distances of rolling objects support the predicted dependence on rotational inertia and identify which physical mechanisms best explain any differences between experimental results and theoretical predictions.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eA fundamental part of the scientific process is testing hypotheses by comparing experimental results to theoretical predictions. In this lab, you will use a physical model to predict the motion of a rolling object and then design an experiment to test whether those predictions accurately describe the real system. By analyzing trends, uncertainties, and discrepancies between theory and experiment, you will evaluate how well the model represents the observed behavior.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 191px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 191px;\"\u003e\n\u003ctd style=\"width: 99.92%; height: 191px;\"\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cstrong\u003e\u003cu\u003eAs you work through the lab:\u003c/u\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003eQ#\u003c/span\u003e: Bold, numbered items reference things that need to be included in your lab report questions to answer, data, plots, or drawings\u003cbr\u003e\u003c/strong\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■ \u003c/span\u003eItems with a square bullet are action items you’ll need to do to progress through the lab.\u003cbr\u003e\u003cspan class=\"symbol\"\u003e➤ \u003c/span\u003eItems with an arrow are hints, tips, or things to keep in mind when completing tasks.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px; text-align: center;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00;\"\u003eBoxed information is about either the expectations for your lab reports or key concepts for the course.\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003e\u003cbr\u003eLearning Objectives\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eLearning goal: Use quantitative comparisons, uncertainty analysis, and trend-based reasoning to evaluate a theoretical model and interpret if there are any unaccounted physical effects. \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis lab activity is designed to help students practice the following skills:\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003eDevelop and test a physical model by making quantitative predictions.\u003c/li\u003e\n\u003cli\u003eCollect and analyze experimental data to compare with theoretical values.\u003c/li\u003e\n\u003cli\u003eEvaluate how well experimental results support a hypothesis using trends and uncertainty.\u003c/li\u003e\n\u003cli\u003eInterpret discrepancies between theory and experiment by identifying relevant physical mechanisms.\u003c/li\u003e\n\u003cli\u003eDraw evidence-based conclusions using clear, scientific reasoning.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eEquipment\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eThree small objects that roll easily and can be dropped on your floor\u003c/li\u003e\n\u003cli\u003eRaised level platform (like a table or countertop)\u003c/li\u003e\n\u003cli\u003ePlane (e.g. clipboard, hardback textbook)\u003c/li\u003e\n\u003cli\u003eTape measure or string and ruler\u003c/li\u003e\n\u003cli\u003ePaper\u003c/li\u003e\n\u003cli\u003ePencil\u003c/li\u003e\n\u003cli\u003eMarking sheet (plain paper is okay, but prefer aluminum foil, or carbon copy paper)\u003c/li\u003e\n\u003cli\u003e2 hard horizontal surfaces of different heights without beveled edges (e.g. table, dresser, etc.)\u003c/li\u003e\n\u003cli\u003e4” x 6” card (index card, post card, very thin piece of cardboard, etc.)\u003c/li\u003e\n\u003cli\u003eSticky tape\u003c/li\u003e\n\u003cli\u003eRefer to Lab materials page on canvas for future \u003ca title=\"Lab Supplies\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/lab-supplies\" data-course-type=\"wikiPages\" data-published=\"false\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/lab-supplies\" data-api-returntype=\"Page\"\u003elab supplies needed\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 1: Introduction\u003c/h2\u003e\n\u003cp\u003eIn this lab, you will use the same physical setup as in the \u003cem\u003eProjectile Motion\u003c/em\u003e lab in PH 211, but with a new goal: to develop and test a theoretical model that predicts the horizontal launch distance of a rolling object. As shown in Figure 1, a round object is released from rest from a ramp of height , gaining speed as gravitational potential energy is converted into translational and rotational kinetic energy. When the object leaves the edge of the table with horizontal velocity , it enters free fall and drops a vertical distance . The objective is to predict how the horizontal distance \u0026nbsp;is affected by the inertia of the object.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 52.0961%; height: 575.182px; margin-left: auto; margin-right: auto;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 28.7273px;\"\u003e\n\u003ctd style=\"width: 99.9368%; height: 28.7273px; text-align: left;\" colspan=\"2\"\u003eRing/Hollow cylinder (e.g., roll of tape)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 125.977px;\"\u003e\n\u003ctd style=\"width: 50.0843%; text-align: center; height: 125.977px;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706003/preview\" alt=\"A short, wide roll of black electrical tape standing on its edge, with a yellow label visible in the center.\" width=\"132\" height=\"104\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706003\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 49.8524%; text-align: center; height: 125.977px;\"\u003e\u003cimg class=\"equation_image\" title=\"I = \\frac{1}{2}m(r^2_{inner}+r^2_{outer})\" src=\"https://canvas.oregonstate.edu/equation_images/I%2520%253D%2520%255Cfrac%257B1%257D%257B2%257Dm(r%255E2_%257Binner%257D%252Br%255E2_%257Bouter%257D)?scale=1\" alt=\"LaTeX: I = \\frac{1}{2}m(r^2_{inner}+r^2_{outer})\" data-equation-content=\"I = \\frac{1}{2}m(r^2_{inner}+r^2_{outer})\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eI\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmsubsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ei\u003c/mi\u003e\n      \u003cmi\u003en\u003c/mi\u003e\n      \u003cmi\u003en\u003c/mi\u003e\n      \u003cmi\u003ee\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msubsup\u003e\n  \u003cmo\u003e+\u003c/mo\u003e\n  \u003cmsubsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ee\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msubsup\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n\u003c/math\u003e\"\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 28.7273px;\"\u003e\n\u003ctd style=\"width: 99.9368%; height: 28.7273px; text-align: left;\" colspan=\"2\"\u003eSolid sphere (e.g., medicine ball)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 126.045px;\"\u003e\n\u003ctd style=\"width: 50.0843%; text-align: center; height: 126.045px;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706004/preview\" alt=\"A smooth orange rubber ball resting on a flat surface, shown from the side.\" width=\"125\" height=\"118\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706004\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 49.8524%; text-align: center; height: 126.045px;\"\u003e\u003cimg class=\"equation_image\" title=\"I = \\frac{2}{5}mr^2\" src=\"https://canvas.oregonstate.edu/equation_images/I%2520%253D%2520%255Cfrac%257B2%257D%257B5%257Dmr%255E2?scale=1\" alt=\"LaTeX: I = \\frac{2}{5}mr^2\" data-equation-content=\"I = \\frac{2}{5}mr^2\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eI\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n    \u003cmn\u003e5\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msup\u003e\n\u003c/math\u003e\"\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 28.7273px;\"\u003e\n\u003ctd style=\"width: 99.9368%; height: 28.7273px; text-align: left;\" colspan=\"2\"\u003eThin spherical shell (e.g., tennis ball)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 96.7273px;\"\u003e\n\u003ctd style=\"width: 50.0843%; text-align: center; height: 96.7273px;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706005/preview\" alt=\"A yellow-green tennis ball with curved white seams, slightly worn and fuzzy.\" width=\"92\" height=\"58\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706005\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 49.8524%; text-align: center; height: 96.7273px;\"\u003e\u003cimg class=\"equation_image\" title=\"I = \\frac{2}{3}mr^2\" src=\"https://canvas.oregonstate.edu/equation_images/I%2520%253D%2520%255Cfrac%257B2%257D%257B3%257Dmr%255E2?scale=1\" alt=\"LaTeX: I = \\frac{2}{3}mr^2\" data-equation-content=\"I = \\frac{2}{3}mr^2\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eI\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n    \u003cmn\u003e3\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msup\u003e\n\u003c/math\u003e\"\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 28.7273px;\"\u003e\n\u003ctd style=\"width: 99.9368%; height: 28.7273px; text-align: left;\" colspan=\"2\"\u003eDisk/cylinder (e.g., coin)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 111.523px;\"\u003e\n\u003ctd style=\"width: 50.0843%; text-align: center; height: 111.523px;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706006/preview\" alt=\"A silver-colored coin standing upright on its edge on a flat surface, with worn markings visible.\" width=\"105\" height=\"107\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706006\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 49.8524%; text-align: center; height: 111.523px;\"\u003e\u003cimg class=\"equation_image\" title=\"I = \\frac{1}{2}mr^2\" src=\"https://canvas.oregonstate.edu/equation_images/I%2520%253D%2520%255Cfrac%257B1%257D%257B2%257Dmr%255E2?scale=1\" alt=\"LaTeX: I = \\frac{1}{2}mr^2\" data-equation-content=\"I = \\frac{1}{2}mr^2\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eI\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msup\u003e\n\u003c/math\u003e\"\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp style=\"text-align: center;\"\u003eTable 1: Moment of inertia for common household objects\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706007/preview\" alt=\"Diagram of a rolling object launched from a ramp onto a table and then into projectile motion. A spherical object rolls down an inclined ramp of height h with angular speed ω, reaches the table edge with horizontal speed​ v_0, and leaves the table to follow a curved projectile path. The object falls a vertical distance y to the floor and lands a horizontal distance d from the table edge. The ramp angle θ, table height, and motion variables are labeled.\" width=\"537\" height=\"339\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706007\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003eFigure 1: Schematic drawing of the experiment.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThe analysis is divided into two parts. First, energy conservation is used to determine the object’s speed \u003cimg class=\"equation_image\" title=\"v_0\" src=\"https://canvas.oregonstate.edu/equation_images/v_0?scale=1\" alt=\"LaTeX: v_0\" data-equation-content=\"v_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e at the bottom of the ramp. Second, projectile motion is used to predict the horizontal range \u003cimg class=\"equation_image\" title=\"\\Delta x\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520x?scale=1\" alt=\"LaTeX: \\Delta x\" data-equation-content=\"\\Delta x\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ex\u003c/mi\u003e\n\u003c/math\u003e\"\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cu\u003eUsing energy conservation to predict the velocity\u003c/u\u003e\u003c/p\u003e\n\u003cp\u003eAt the top of the ramp, the object has gravitational potential energy . At the bottom, this energy is converted into translational and rotational kinetic energy:\u003c/p\u003e\n\u003cp\u003e\u003cimg class=\"equation_image\" style=\"display: block; margin-left: auto; margin-right: auto;\" title=\"mg \\Delta h = \\frac{1}{2}mv_0^2+\\frac{1}{2}I\\omega_0^2\" src=\"https://canvas.oregonstate.edu/equation_images/mg%2520%255CDelta%2520h%2520%253D%2520%255Cfrac%257B1%257D%257B2%257Dmv_0%255E2%252B%255Cfrac%257B1%257D%257B2%257DI%255Comega_0%255E2?scale=1\" alt=\"LaTeX: mg \\Delta h = \\frac{1}{2}mv_0^2+\\frac{1}{2}I\\omega_0^2\" data-equation-content=\"mg \\Delta h = \\frac{1}{2}mv_0^2+\\frac{1}{2}I\\omega_0^2\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmi\u003eg\u003c/mi\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003eh\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmsubsup\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msubsup\u003e\n  \u003cmo\u003e+\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmi\u003eI\u003c/mi\u003e\n  \u003cmsubsup\u003e\n    \u003cmi\u003e\u0026amp;#x03C9;\u003c!-- ω --\u003e\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msubsup\u003e\n\u003c/math\u003e\"\u003e\u003c/p\u003e\n\u003cp\u003eHere, \u003cimg class=\"equation_image\" title=\"m\" src=\"https://canvas.oregonstate.edu/equation_images/m?scale=1\" alt=\"LaTeX: m\" data-equation-content=\"m\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n\u003c/math\u003e\"\u003e is the mass of the object, \u003cimg class=\"equation_image\" title=\"v_0\" src=\"https://canvas.oregonstate.edu/equation_images/v_0?scale=1\" alt=\"LaTeX: v_0\" data-equation-content=\"v_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e is its linear velocity, \u003cimg class=\"equation_image\" title=\"\\omega_0\" src=\"https://canvas.oregonstate.edu/equation_images/%255Comega_0?scale=1\" alt=\"LaTeX: \\omega_0\" data-equation-content=\"\\omega_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003e\u0026amp;#x03C9;\u003c!-- ω --\u003e\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e is its angular velocity (the rotational speed in radians per second), and I is the object’s moment of inertia. For rolling without slipping, the linear and angular velocities are related by \u003cimg class=\"equation_image\" title=\"v_0=r\\omega_0\" src=\"https://canvas.oregonstate.edu/equation_images/v_0%253Dr%255Comega_0?scale=1\" alt=\"LaTeX: v_0=r\\omega_0\" data-equation-content=\"v_0=r\\omega_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmi\u003er\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003e\u0026amp;#x03C9;\u003c!-- ω --\u003e\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e, allowing this expression to be written as\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg class=\"equation_image\" title=\"mg \\Delta h = \\frac{v_0^2}{2}(m+\\frac{I}{r^2})\" src=\"https://canvas.oregonstate.edu/equation_images/mg%2520%255CDelta%2520h%2520%253D%2520%255Cfrac%257Bv_0%255E2%257D%257B2%257D(m%252B%255Cfrac%257BI%257D%257Br%255E2%257D)?scale=1\" alt=\"LaTeX: mg \\Delta h = \\frac{v_0^2}{2}(m+\\frac{I}{r^2})\" data-equation-content=\"mg \\Delta h = \\frac{v_0^2}{2}(m+\\frac{I}{r^2})\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmi\u003eg\u003c/mi\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003eh\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmsubsup\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmn\u003e0\u003c/mn\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msubsup\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmo\u003e+\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmi\u003eI\u003c/mi\u003e\n    \u003cmsup\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n  \u003c/mfrac\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n\u003c/math\u003e\"\u003e\u003c/p\u003e\n\u003cp\u003ewhere \u003cimg class=\"equation_image\" title=\"r\" src=\"https://canvas.oregonstate.edu/equation_images/r?scale=1\" alt=\"LaTeX: r\" data-equation-content=\"r\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003er\u003c/mi\u003e\n\u003c/math\u003e\"\u003e is the outer radius of the rolling object. Defining a “shape factor” \u003cimg class=\"equation_image\" title=\"\\kappa\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ckappa?scale=1\" alt=\"LaTeX: \\kappa\" data-equation-content=\"\\kappa\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e for the object, \u003cimg class=\"equation_image\" title=\"\\kappa=I/mr^2\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ckappa%253DI%252Fmr%255E2?scale=1\" alt=\"LaTeX: \\kappa=I/mr^2\" data-equation-content=\"\\kappa=I/mr^2\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03BA;\u003c!-- κ --\u003e\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmi\u003eI\u003c/mi\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmo\u003e/\u003c/mo\u003e\n  \u003c/mrow\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmsup\u003e\n    \u003cmi\u003er\u003c/mi\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msup\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp;, then \u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cimg class=\"equation_image\" style=\"display: block; margin-left: auto; margin-right: auto;\" title=\"g \\Delta h = \\frac{v_0^2}{2}(1+\\kappa)\" sr
