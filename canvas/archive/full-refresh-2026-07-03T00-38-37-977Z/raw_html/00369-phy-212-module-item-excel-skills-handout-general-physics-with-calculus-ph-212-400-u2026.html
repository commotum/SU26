c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003cp style=\"text-align: center;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eInstructions:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTo acquire and run a local version of Excel go to \u003ca class=\"inline_disabled\" href=\"https://technology.oregonstate.edu/services/microsoft-365\" target=\"_blank\"\u003ehttps://technology.oregonstate.edu/services/microsoft-365\u003c/a\u003e. \u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eClick \u003ccode\u003eLog into Microsoft 365\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706037/preview\" alt=\"A picture showing Oregon State’s Microsoft 365 login profile.\" width=\"426\" height=\"214\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706037\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eIf prompted, use \u003ccode\u003e\u0026lt;\u003cstrong\u003eYour ONID\u003c/strong\u003e\u0026gt;@oregonstate.edu\u003c/code\u003e email.\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003e\u003cem\u003e(If you have trouble logging in, visit \u003ca class=\"inline_disabled\" href=\"https://onid.oregonstate.edu/\" target=\"_blank\"\u003ehttps://onid.oregonstate.edu/\u003c/a\u003e, OSU's student service representatives can assist you).\u003c/em\u003e\u003cem\u003e\u003c/em\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706029/preview\" alt=\"A picture showing Oregon State's ONID service portal. \" width=\"434\" height=\"221\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706029\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eA CoPilot session will open, from the left sidebar click \u003ccode\u003e(1) Apps\u003c/code\u003e, and \u003ccode\u003e(2) Install apps\u003c/code\u003e.\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706042/preview\" alt=\"A CoPilot session showing the app sidebar and the install apps icon in the top right corner of the page. \" width=\"435\" height=\"210\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706042\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt; text-align: left;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003eII. Working with data\u003c/span\u003e\u003c/h2\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eWorkbook Layout, Calculations and Functions 🎬[2 of 5]\u003cbr\u003e\u003c/span\u003e\u003c/strong\u003eBasic workbook layout, cell references, expressions (the \u003ccode\u003e=\u003c/code\u003e operator), and \u003ccode\u003efunctions\u003c/code\u003e.\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003ciframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/YKpPD4XKN0s?si=bSlFccUuycit_dOF\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" loading=\"lazy\"\u003e\u003c/iframe\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eDownloadable Resources ⬇️:\u003c/span\u003e\u003c/strong\u003e \u003cbr\u003e- Example Excel, (click on yellow tabs 🟨) \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_Excel-Skills-Ref.xlsx\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706030?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706030\" data-api-returntype=\"File\"\u003ePH211_Excel-Skills-Ref.xlsx\u003c/a\u003e\u003cbr\u003e- Video PowerPoint slides: \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_Basic-Excel-Workflows.pptx\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706028?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706028\" data-api-returntype=\"File\"\u003ePH211_Basic-Excel-Workflows.pptx\u003c/a\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003c/strong\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eVideo Contents (Timestamps):\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 50.9615%; height: 174px;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 63.0252%; height: 29px;\"\u003e\u003cstrong\u003eConcept\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 36.9748%; height: 29px;\"\u003e\u003cstrong\u003eTimes\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 63.0252%; height: 29px;\"\u003eIntroduction (where to find resources).\u003c/td\u003e\n\u003ctd style=\"width: 36.9748%; height: 29px;\"\u003e00:00 - 00:27\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 63.0252%; height: 29px;\"\u003eHow Excel works.\u003c/td\u003e\n\u003ctd style=\"width: 36.9748%; height: 29px;\"\u003e00:28 - 00:54\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 63.0252%; height: 29px;\"\u003eWorkbook formatting.\u003c/td\u003e\n\u003ctd style=\"width: 36.9748%; height: 29px;\"\u003e00:55 - 02:48\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 63.0252%; height: 29px;\"\u003eExpressions, cell refs, and auto math.\u003c/td\u003e\n\u003ctd style=\"width: 36.9748%; height: 29px;\"\u003e02:49 - 08:37\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 63.0252%; height: 29px;\"\u003eFunctions.\u003c/td\u003e\n\u003ctd style=\"width: 36.9748%; height: 29px;\"\u003e08:38 - 10:54\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 63.0252%;\"\u003eAdvanced func: powers, radians, \u003cspan class=\"symbol\"\u003eπ, trig.\u003c/span\u003e\u003c/td\u003e\n\u003ctd style=\"width: 36.9748%;\"\u003e10:55 - 14:17\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eI. Importing data\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eImporting data is necessary for most of the things you will be doing with Excel. Here are some instructions for doing so. The menu options may slightly vary depending on the version of Excel that you are using. \u0026nbsp;\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eOpen a blank workbook in Excel.\u003c/li\u003e\n\u003cli\u003eCopy your data from your source and paste it into Excel.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eOR\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eClick on the \u003cstrong\u003eData\u003c/strong\u003e tab.\u003c/li\u003e\n\u003cli\u003eClick on the \u003cstrong\u003eGet Data\u003c/strong\u003e icon.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eClick on the \u003cstrong\u003eFrom File\u003c/strong\u003e icon.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706031/preview\" alt=\"Screenshot of the Excel “Data” tab showing the steps to import data. The “Get Data” dropdown is expanded, with “From File” selected and “From Text/CSV” highlighted. A tooltip explains that this option imports data from a text, comma-separated value, or space-delimited file.\" width=\"380\" height=\"280\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706031\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"4\"\u003e\n\u003cli\u003eSelect the option most appropriate for the data you are trying to import. Generally, data from analytical instruments such as the force probe on your cart can be saved as a .CSV file that imports with few problems to Excel.\u003c/li\u003e\n\u003cli\u003eAfter selecting the file click \u003cstrong\u003eOpen\u003c/strong\u003e\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eII. Formatting cells\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eSometimes copying data into Excel will result in the data being in a format that cannot be used in Excel formulas. \u0026nbsp;\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eAfter copy/pasting data into Excel, highlight the columns containing the data. Right click and select \u003cstrong\u003eFormat Cells\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eA menu will pop up. Here, you can select the \u003cstrong\u003eCategory\u003c/strong\u003e of data for the column. In order to use the data for Excel Formulas, you should select \u003cstrong\u003eNumber\u003c/strong\u003e and then click \"OK\".\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706045/preview\" alt=\"Screenshot of the Excel “Format Cells” dialog box with the “Number” tab selected. The “Number” category is highlighted, with two decimal places set. The background shows a selected column of numerical data labeled “Position Data (y in m)” in a spreadsheet. \" width=\"292\" height=\"238\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706045\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eIII. Cell references \u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eCells are labeled by giving the column (labeled by capital letters) and the row (labeled by a number). \u0026nbsp;For example, the cell in the second column three rows down is labeled \u003ccode\u003eB3\u003c/code\u003e. Excel cells can hold a variety of types of data such as numerical values, dates, texts, and formulas. \u0026nbsp;\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCells in Excel hold numerical values, as well as other types of values such as text and dates, as needed.\u003c/li\u003e\n\u003cli\u003eAny cell reference preceded by a dollar sign (\u003ccode\u003e$\u003c/code\u003e) is an '\u003cstrong\u003eabsolute reference\u003c/strong\u003e' that will not change if references to the cell are, for example, copy and pasted. For instance:\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e\u003cem\u003e$B4\u003c/em\u003e\u003c/code\u003e will always refer to the second column (\u003ccode\u003ecolumn B\u003c/code\u003e) of the spreadsheet, though the row (\u003ccode\u003erow 4\u003c/code\u003e) may be updated if used in an Excel formula.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e\u003cem\u003eB$4\u003c/em\u003e\u003c/code\u003e will similarly always refer to the fourth row, though the column may be updated if used in an Excel formula.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e\u003cem\u003e$B$4\u003c/em\u003e\u003c/code\u003e will always refer to the second column and fourth row of the spreadsheet, no matter what. This can be a handy way to store \"constants\" that have to be reused repeatedly elsewhere in the spreadsheet.\u0026nbsp;\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; height: 63px;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 34px;\"\u003e\n\u003ctd style=\"width: 33.3114%; height: 34px; text-align: center;\"\u003e\u003cstrong\u003eLock auto-fill reference to column B only.\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3114%; height: 34px; text-align: center;\"\u003e\u003cstrong\u003eLock auto-fill reference to row 4 only.\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3114%; height: 34px; text-align: center;\"\u003e\u003cstrong\u003eLock auto-fill reference to cell B4.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 33.3114%; height: 29px; text-align: center;\"\u003e\u003ccode\u003e$B4\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3114%; height: 29px; text-align: center;\"\u003e\u003ccode\u003eB$4\u003c/code\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3114%; height: 29px; text-align: center;\"\u003e\u003ccode\u003e$B$4\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eIV. Formulas\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eFormulas (aka. expressions \u003ccode\u003e+ - * / ^\u003c/code\u003e) in Excel can be used to calculate a value in the selected cell by substituting values from other cells and performing mathematical operations. For example, if the distance traveled is in cell \u003ccode\u003e\u003cem\u003eD4\u003c/em\u003e\u003c/code\u003e and the time it took is in cell \u003ccode\u003e\u003cem\u003eC4\u003c/em\u003e\u003c/code\u003e, you can have Excel calculate the average velocity\u0026nbsp;over that time interval in cell \u003ccode\u003e\u003cem\u003eD4\u003c/em\u003e\u003c/code\u003e by entering \"\u003ccode\u003e\u003cem\u003e=D4/C4\u003c/em\u003e\u003c/code\u003e\" in cell \u003ccode\u003e\u003cem\u003eE4\u003c/em\u003e\u003c/code\u003e. \u003cstrong\u003eFormulas always begin with an \"\u003ccode\u003e=\u003c/code\u003e\" sign.\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eYou can insert formulas by typing directly in the cell or by selecting the cell and entering the formula in the \"\u003cstrong\u003eformula bar\u003c/strong\u003e\", the text field just above the \u003ccode\u003eC\u003c/code\u003e and \u003ccode\u003eD\u003c/code\u003e column headings in the image below.\u003c/li\u003e\n\u003cli\u003eExponents are entered using the carat \u003ccode\u003e^\u003c/code\u003e character. \u0026nbsp;For example, to calculate the cube of the value in cell \u003ccode\u003e\u003cem\u003eA17\u003c/em\u003e\u003c/code\u003e, enter \"\u003ccode\u003e\u003cem\u003e=A17^3\u003c/em\u003e\u003c/code\u003e\" in whichever cell you would like that value to appear.\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u003cimg style=\"font-family: inherit; font-size: 1rem;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706046/preview\" alt=\"Screenshot of an Excel spreadsheet showing how to calculate average speed using a formula. Column C is labeled 'Time', column D is labeled 'Distance', and column E is labeled 'Ave. Speed'. Cell E4 is selected and contains the formula '=D4/C4'. The formula bar above the columns also shows '=D4/C4'. This demonstrates how to enter a formula to divide distance by time. \" width=\"259\" height=\"249\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706046\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/li\u003e\n\u003cli\u003eExcel has many built-in \u003cstrong\u003efunctions. \u003c/strong\u003eThese are called by typing \"\u003ccode\u003e=\u003cstrong\u003eTHE_FUNCTION_NAME\u003c/strong\u003e()\u003c/code\u003e\" and\u0026nbsp;can be used for calculations such as trigonometric functions, exponentials and logarithms, statistical functions, and many more. \u0026nbsp;Their properties are well described in Excel's help, and you can investigate what's available using the \u003cstrong\u003eFormula Builder\u003c/strong\u003e available at \u003ccode\u003e\u003cstrong\u003eInsert \u0026gt; Function...\u003c/strong\u003e\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eIf you have a long set of columns in which the same calculation must be performed but with different values in each row, you can auto-fill \"drag down\" a formula and Excel will copy the formula into every cell in the column you drag over intelligently updating the cell references. (Any absolute references, as defined above using \u003ccode\u003e$\u003c/code\u003e, will hold their reference and not be updated.)\u003c/li\u003e\n\u003cli\u003e\u0026nbsp;To drag a formula down, click on the cell containing the formula to select it. \u0026nbsp;Hover the cursor over the bottom right corner of the selected cell until a small square appears just on that corner. \u0026nbsp;Click on the square and drag the formula down over all the cells in which you wish a (suitably updated) copy of that formula to appear:\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706025/preview\" alt=\"Screenshot of an Excel spreadsheet showing how to copy a formula down a column. Column C is labeled 'Time', column D 'Distance', and column E 'Ave. Speed'. The first cell in 'Ave. Speed' uses the formula '=D4/C4', and the cells below show calculated values. A red arrow labeled 'drag this box down' points from the selected cell’s bottom right corner to the cells below, illustrating how to drag the fill handle to copy the formula to other rows \" width=\"255\" height=\"294\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706025\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eImporting Data🎬[3 of 5]\u003cbr\u003e\u003c/span\u003e\u003c/strong\u003eThis video demonstrates how to import data from an external source into Excel (the alternative to manually typing data in Excel). \u003cspan style=\"color: #027634;\"\u003eManual method is also valid approach✅\u003c/span\u003e.\u0026nbsp;\u003cbr\u003eAdditionally, how to calculate and plot: \u003ccode\u003eaverage speed = total distance / total time\u003c/code\u003e using any point of interest. This is actually calculated in \u003cstrong\u003e\u003cem\u003evideo 4 of 5\u003c/em\u003e\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003ciframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/OBCiSYMwjGE?si=TrO9ryKH_ThfQ1Iw\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" loading=\"lazy\"\u003e\u003c/iframe\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eDownloadable Resources ⬇️:\u003cbr\u003e\u003c/span\u003e\u003c/strong\u003e- Data used in demo video: \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_DATA_time-distance.txt\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706032?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706032\" data-api-returntype=\"File\"\u003ePH211_DATA_time-distance.txt\u003c/a\u003e\u003cbr\u003e- Example Excel, (click on blue tabs 🟦): \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_Excel-Skills-Ref.xlsx\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706030?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706030\" data-api-returntype=\"File\"\u003ePH211_Excel-Skills-Ref.xlsx\u003c/a\u003e\u003cbr\u003e- Video PowerPoint slides: \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_Excel-Data-Analysis.pptx\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706035?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706035\" data-api-returntype=\"File\"\u003ePH211_Excel-Data-Analysis.pptx\u003c/a\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eVideo Contents (Timestamps):\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 64.9039%; height: 262px;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29px;\"\u003e\u003cstrong\u003eConcept\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29px;\"\u003e\u003cstrong\u003eTimes\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29px;\"\u003eIntroduction, understanding the workbook.\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29px;\"\u003e00:00 - 00:50\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29px;\"\u003eConcept for importing CSV data.\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29px;\"\u003e00:51 - 01:32\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29.5px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29.5px;\"\u003eTheory for representing \u003ccode\u003espeed = dist / time\u003c/code\u003e (\u003ca class=\"inline_disabled\" href=\"https://www.youtube.com/watch?v=oRKxmXwLvUU\" target=\"_blank\"\u003eclick for more help\u003c/a\u003e).\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29.5px;\"\u003e01:33 - 02:11\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29.5px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29.5px;\"\u003eLinear relationships \u003ccode\u003ey = mx + c\u003c/code\u003e (\u003ca class=\"inline_disabled\" href=\"https://www.youtube.com/watch?v=IL3UCuXrUzE\" target=\"_blank\"\u003eclick for more help\u003c/a\u003e).\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29.5px;\"\u003e02:12 - 02:51\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29px;\"\u003eThinking about average speed vs. derivatives speed. \u003cem\u003e(*see video 5 of 5). \u003c/em\u003e\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29px;\"\u003e02:52 - 03:28\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29px;\"\u003eImporting data on Windows (Part 1)\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29px;\"\u003e03:29 - 03:48\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29px;\"\u003eImporting data on Mac\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29px;\"\u003e03:49 - 04:37\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 79.0699%; height: 29px;\"\u003eImporting data on Windows (Part 2)\u003c/td\u003e\n\u003ctd style=\"width: 21.006%; height: 29px;\"\u003e04:38 - 07:10\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003eIII. Plotting and fitting data\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003eEach lab will require you to visualize the data you've collected. Graphical Analysis will often plot things for you, and fitting data in that program is relatively easy. You will also be asked to generate plots in Excel as well. This will guide you on how to create scatter plots, the most commonly used plot for the labs you will be doing.\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706043/preview\" alt=\"Screenshot of an Excel spreadsheet showing two columns of data selected: column A labeled 'Time (s)' with values from 0 to 6, and column B labeled 'Position (m)' with values from 0 to 36. The entire data range A1:B8 is highlighted, illustrating how to select data to plot with the independent variable (time) on the left and the dependent variable (position) on the right.\" width=\"180\" height=\"180\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706043\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eIn Excel, drag and select all of the data that you want to plot. For ease of plotting, your independent variable (in most cases, time) should be to the left of your dependent variable (position, for example). \u0026nbsp;\u003c/li\u003e\n\u003cli\u003eSelect the Insert tab. In the section titled \u003cstrong\u003eCharts\u003c/strong\u003e select the scatter plot icon shown below.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eYou should usually choose the default scatter plot, with unconnected points. Only choose the one with lines if you need to better visualize where the points are. \u0026nbsp;Don’t choose it if, as is usually the case, you’re going to fit the data with a curve. Whatever you choose, your data points should be visible.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706047/preview\" alt=\"A screenshot of Microsoft Excel showing a table of data with time in seconds and position in meters, along with a scatter plot of the data. The “Insert” tab is open and the user is hovering over the Scatter chart icon, showing the tooltip for inserting a scatter plot with unconnected points.\" width=\"405\" height=\"243\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706047\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"4\"\u003e\n\u003cli\u003eAlways add a title to your plot and appropriate axes labels. To do this, click on the plot. In the \u003cstrong\u003eDesign\u003c/strong\u003e tab, on the left you will see an option to \u003cstrong\u003eAdd Chart Element\u003c/strong\u003e. Clicking on this will allow you to add a plot title, axes labels, and more. Alternatively, when you click on the plot a green plus sign will appear on the top right corner of the plot. Clicking on this will reveal a menu where you may select what elements you want on the plot. For example, if you have two lines plotted you will want to add a Legend to the plot.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706033/preview\" alt=\"A scatter plot in Excel titled “Position (m) vs Time (s) Graph” with visible data points. A green plus sign is selected on the top right corner of the chart, opening the “Chart Elements” menu. The options for Axes, Axis Titles, Chart Title, and Gridlines are checked, while Data Labels, Error Bars, Legend, and Trendline are not.\" width=\"387\" height=\"188\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706033\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eI. Adding error bars\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"1\"\u003e\n\u003cli\u003eClick the data set you want to add error bars to, and then under \u003ccode\u003e“Chart Design”\u003c/code\u003e, select \u003ccode\u003e“Add Chart Element” → “Error Bars” → “More Error Bar Options”\u003c/code\u003e (This may look different on a Mac).\u003c/li\u003e\n\u003cli\u003eBoth horizontal and vertical error bars will be added. We usually just want vertical error bars, so select the horizontal error bars and delete them\u003c/li\u003e\n\u003cli\u003eUnder \u003ccode\u003e“Format Error Bars” → “Error Amount” select “Custom”\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eClick \u003ccode\u003e“Specify Value” \u003c/code\u003eand highlight the uncertainty values for both the positive and negative error bar values\u003c/li\u003e\n\u003cli\u003eRepeat for each dataset that needs error bars\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eII. Curve fitting (trendline) options\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eOften you will want to include a trendline on your plots to get a value of the slope of the line or other parameters. After clicking on a plot, click on the plus icon in the upper right corner to add \u003cstrong\u003eChart Elements\u003c/strong\u003e. If you click the \u003cstrong\u003eTrendline\u003c/strong\u003e option, a linear trendline will appear on the graph and an arrow will show up next to the check box in the chart elements section. Click on \u003cstrong\u003eMore Options\u003c/strong\u003e.\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706036/preview\" alt=\"image.png\" width=\"443\" height=\"151\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706036\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/li\u003e\n\u003cli\u003eNow you can select the type of fit you want (linear, logarithmic, polynomial, etc.). You should also select the option \u003cstrong\u003eDisplay Equation on Chart\u003c/strong\u003e to get the fit parameters, such as slope and the intercept of the data. \u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cp\u003eIf you are doing a linear fit, you can get the uncertainty in the slope and y-intercept of the line that Excel is fitting to the data. \u003cstrong\u003eNote:\u003c/strong\u003e this uncertainty represents the range of possible slopes and y-intercepts that Excel thinks will still give a line that fits your data. It does \u003cem\u003enot\u003c/em\u003e take into account the uncertainty in your data points.\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eType the function \u003ccode\u003e=LINEST([y-values], [x-values], TRUE, TRUE)\u003c/code\u003e into a cell in your Excel spreadsheet. In the spots for \u003cstrong\u003ey-values\u003c/strong\u003e and \u003cstrong\u003ex-values\u003c/strong\u003e, type in the range of cells where the appropriate data is located or click and drag over the cells that have the appropriate data. The first “\u003ccode\u003eTRUE\u003c/code\u003e” tells Excel to include a y-intercept, and the second “\u003ccode\u003eTRUE\u003c/code\u003e” tells Excel to include the uncertainty when displaying the output. Make sure there is open space around the cell where you type this formula, as the output takes up multiple cells.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706026/preview\" alt=\"Excel spreadsheet showing x-values in column A and y-values in column B, with the formula =LINEST(B2:B10, A2:A10, TRUE, TRUE) entered. The output array displays the slope (0.031922), y-intercept (0.179632), R^2 value (0.998148), standard error of the slope (0.247263), and additional regression statistics in the cells to the right of the data.\" width=\"310\" height=\"164\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706026\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"2\"\u003e\n\u003cli\u003eThe function outputs two columns of values. The first row contains the slope and the y-intercept of the best fit line. The uncertainty in the slope is the second box down in the left column, and the uncertainty in the y-intercept is the second box down in the right column.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706048/preview\" alt=\"Highlighted output of the Excel LINEST function showing a two-by-two array: the top row contains the slope and y-intercept (left to right), and the second row contains their respective uncertainties. The uncertainty in the slope is boxed in the lower-left cell; the uncertainty in the y-intercept is in the lower-right cell.\" width=\"287\" height=\"124\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706048\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eIII.\u0026nbsp;Plotting multiple data sets\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eYou can easily plot more than one set of data on the same graph if they share the same x-values. \u0026nbsp;To do so, arrange the data so the x-values are in the first column. \u0026nbsp;Each column after that should include one set of data to plot. \u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eSelect all the columns containing data.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706041/preview\" alt=\"Screenshot of an Excel spreadsheet showing three columns of data selected: column A labeled 'Time (s)' with values from 0 to 6, column B labeled 'R1 (m)' with values from 0 to 36, and column C labeled 'R2 (m)' with values from 3 to 39. The entire data range A1:C8 is highlighted, demonstrating how to select multiple data sets with the same x-values for plotting on the same graph.\" width=\"279\" height=\"209\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706041\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"2\"\u003e\n\u003cli\u003eInsert a graph, as before. Your new graph should have multiple data sets in different colors and shapes. Notice that the graph now includes a legend (upper right), identifying each set of points. \u0026nbsp;You can reshape the legend as well as change the colors and styles of the points.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706034/preview\" alt=\"Scatter plot titled 'Distances' showing distance in meters on the y-axis and time in seconds on the x-axis. Two data series are plotted: R1 (blue dots) and R2 (orange dots). Both show an upward, nonlinear trend over time, indicating increasing distance. R2 distances are consistently slightly higher than R1 at each time point from 1 to 6 seconds.\" width=\"301\" height=\"195\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706034\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"3\"\u003e\n\u003cli\u003eYou can also use different y-axis scales for the data sets. \u0026nbsp;Right click on the data set, select “Format Data Series”, and choose “Secondary Axis.” \u0026nbsp;The data will be plotted using the scale on the right, rather than the scale on the left.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706050/preview\" alt=\"Screenshot of an Excel window showing a scatter plot with two data sets: 'Distance (m)' and 'Speed (m/s)' plotted against 'Time (s)'. The Excel worksheet shows three columns: Time, Distance, and Speed, with data selected. The chart includes a legend identifying the two data series in different colors. The 'Format Data Series' pane is open on the right, and a right-click context menu shows the option to format the Speed series and plot it on a secondary axis, with its scale visible on the right side of the chart. \" width=\"570\" height=\"328\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706050\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eData Plotting and Analysis 🎬[4 of 5]\u003cbr\u003e\u003c/span\u003e\u003c/strong\u003eThis video builds on the data import guide.\u003cbr\u003eIt cover foundational scatter-plot graphing techniques and the \u003ccode\u003e=LINEST\u003c/code\u003e function.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003ciframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/boRigDR4qM8?si=2Zxqn4YYGhwaAXq8\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" loading=\"lazy\"\u003e\u003c/iframe\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eDownloadable Resources ⬇️:\u003cbr\u003e\u003c/span\u003e\u003c/strong\u003e- Excel workbook, (click on blue and green tabs 🟦🟩): \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_Excel-Skills-Ref.xlsx\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706030?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706030\" data-api-returntype=\"File\"\u003ePH211_Excel-Skills-Ref.xlsx\u003c/a\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eVideo Contents (Timestamps):\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 58.75%; height: 116px;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 78.097%; height: 29px;\"\u003e\u003cstrong\u003eConcept\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%; height: 29px;\"\u003e\u003cstrong\u003eTimes\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 78.097%; height: 29px;\"\u003eIntroduction.\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%; height: 29px;\"\u003e00:00 - 00:09\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 78.097%; height: 29px;\"\u003eCalculating average speed (blue tab in workbook demo 🟦)\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%; height: 29px;\"\u003e00:10 - 01:24\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 78.097%; height: 29px;\"\u003e(Switched over to green tabs in workbook demo 🟩)\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%; height: 29px;\"\u003e*01:25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 78.097%;\"\u003eMake graph scatter-plot and add data.\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%;\"\u003e01:25 - 03:51\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 78.097%;\"\u003eCustomizing a graph: axis titles and units.\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%;\"\u003e03:52 - 05:00\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 78.097%;\"\u003eAdding error-bars to your plots.\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%;\"\u003e05:01 - 07:43\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 78.097%;\"\u003eAdding a trend-line.\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%;\"\u003e07:44 - 09:25\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 78.097%;\"\u003eUsing the \u003ccode\u003e=LINEST\u003c/code\u003e function in Excel.\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%;\"\u003e09:26 - 12:17\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 78.097%;\"\u003eAdding multiple data-series to a scatter-plot.\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%;\"\u003e12:18 - 14:13\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 78.097%;\"\u003eDisplay a graph legend.\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 21.9031%;\"\u003e14:14 - 15:36\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003eIV. Appendix - Numerical analysis skills\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003eNumerical analysis is the use of algorithms to computationally compute a result. Excel, which offers a variety of tools to analyze the data collected in labs.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eI. Finding slopes (aka Derivatives)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eA derivative is the slope of a tangent line at a given point on a graph. It tells you about how one value changes with respect to the other. For example, the slope of position with respect to time tells you how the position of an object changes for a given amount of time, or in other words the velocity of an object.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eSlope is calculated by dividing the change in the values plotted on the vertical axis over the\u003cbr\u003echange in the values plotted on the horizontal axis. The equation below gives an example for\u003cbr\u003ecalculating the slope between two points: \u003cem\u003e(x1, y1)\u003c/em\u003e and \u003cem\u003e(x2, y2)\u003c/em\u003e. \u003cstrong\u003eSlope between \u003cem\u003e(x1, y1)\u003c/em\u003e and \u003cem\u003e(x2, y2)\u003c/em\u003e \u003cem\u003e= (y2 – y1) / (x2 – x1)\u003c/em\u003e\u003c/strong\u003e.\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706053/preview\" alt=\"Screenshot of an Excel worksheet showing three columns labeled 'Time (s)', 'Position (m)', and 'Velocity (m/s)'. Time values are in column A, position values are in column B, and the velocity column is being calculated. Cell C2 contains the formula '=((B3-B2)/(A3-A2))', which calculates the change in position divided by the change in time. Colored boxes highlight the cells referenced in the formula: B2 and B3 for position, and A2 and A3 for time.\" width=\"289\" height=\"174\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706053\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"2\"\u003e\n\u003cli\u003eConsider some sample data above. The time (\u003ccode\u003ecolumn A\u003c/code\u003e) and position (\u003ccode\u003ecolumn B\u003c/code\u003e) of an object at that time has been recorded in the spreadsheet. The next step is to calculate the slope (which would be the velocity of the object) for each data point. In this example, you would start by calculating the slope for time \u003cstrong\u003et=0s\u003c/strong\u003e. In cell \u003ccode\u003eC2\u003c/code\u003e, type “\u003ccode\u003e\u003cem\u003e=((B3 - B2)/(A3-A2))\u003c/em\u003e\u003c/code\u003e”. This finds the change in position and divides that by the change in time between data points. This calculates the slope according to the formula above.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706051/preview\" alt=\"Screenshot of an Excel worksheet with three columns labeled 'Time (s)', 'Position (m)', and 'Velocity (m/s)'. Column A lists times from 0 to 6 seconds, column B lists corresponding positions, and column C contains the calculated velocities. The formula bar shows the formula '=((B3-B2)/(A3-A2))' entered in cell C2, which calculates the average velocity as the change in position divided by the change in time. The velocity column is highlighted, showing values from 1 to 12 m/s.\" width=\"356\" height=\"200\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706051\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"3\"\u003e\n\u003cli\u003eThe velocity (slope) has now been calculated for one point. Click on the cell where the derivative was calculated, click on the green box in the bottom right-hand corner and drag it down to the second-to-last cell. Excel defaults to empty cells in formulas being zero, which means if you drag the formula down Excel will give you a value for the velocity but it will not actually be a true value. The slope for that last data point cannot be calculated because the position is not known for time \u003cstrong\u003et=11s\u003c/strong\u003e. This means that we don't have data to use for the slope formula.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eII. Finding areas under a curve (aka Integrals)\u003c/strong\u003e\u003c/span\u003e\u003cbr\u003eThe \"integral\" of a function is the area under its curve between two points. If you have taken calculus, you may be familiar with the notation for an integral: \u003cimg class=\"equation_image\" title=\"\\Delta v = \\int_{t1}^{t2} a ~dt\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520v%2520%253D%2520%255Cint_%257Bt1%257D%255E%257Bt2%257D%2520a%2520~dt?scale=1\" alt=\"LaTeX: \\Delta v = \\int_{t1}^{t2} a ~dt\" data-equation-content=\"\\Delta v = \\int_{t1}^{t2} a ~dt\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ev\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsubsup\u003e\n    \u003cmo\u003e\u0026amp;#x222B;\u003c!-- ∫ --\u003e\u003c/mo\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmn\u003e1\u003c/mn\u003e\n    \u003c/mrow\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/mrow\u003e\n  \u003c/msubsup\u003e\n  \u003cmi\u003ea\u003c/mi\u003e\n  \u003cmtext\u003e\u0026amp;#xA0;\u003c/mtext\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n  \u003cmi\u003et\u003c/mi\u003e\n\u003c/math\u003e\"\u003e. This equation says that the change in the velocity between two times t1 and t2 is the area underneath the acceleration curve (as a function of time) between those two times. Here's an example of how to find the change in the velocity from the acceleration vs. time by finding the area under the acceleration vs. time curve.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThere are several methods of finding areas (integrating data) in Excel:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe midpoint rule estimates the area under the curve as a series of pure rectangles (centered on the data point). As you can imagine, this results in poor accuracy when the data (integrand) is changing rapidly.\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706054/preview\" alt=\"Graph illustrating the midpoint rule for numerical integration. A curved function is plotted with the area under the curve approximated by a series of shaded rectangles. Each rectangle is centered at a data point along the x-axis, showing how the midpoint rule estimates the integral by summing the areas of these rectangles. \" width=\"141\" height=\"355\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706054\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe trapezoidal rule estimates the area under the curve as a series of trapezoids. This greatly increases the accuracy, regardless of the change in the integrand. To calculate the velocity at any given time, we need to calculate the integral of acceleration over time. Since we have a limited number of data points, the trapezoidal method will give us the greatest accuracy for our calculated velocity and position data. This is what we suggest using in lab.\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706049/preview\" alt=\"Graph showing the trapezoidal rule for numerical integration. A curved red line represents a function, with the area under the curve approximated by a series of green trapezoids connecting data points along the x-axis, demonstrating how the trapezoidal method estimates the integral by connecting points with straight lines. \" width=\"186\" height=\"133\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706049\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003eNote that the plots above demonstrate the areas that a midpoint/trapezoidal rule use to calculate the area under the curve. They do not represent what an area under the curve plot looks like. The area under the curve plot will look like any other scatter plot you produce.\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003eConsider a dataset that looks like the following. We have acceleration data and we want to get the velocity at each time by finding the area under the acceleration vs. time curve up to that moment.\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cbr\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706044/preview\" alt=\"A table in Excel with three columns labeled: \u0026quot;Time (s)\u0026quot;, \u0026quot;Acceleration (m/s²)\u0026quot;, and \u0026quot;Calculated Velocity (m/s)\u0026quot;. The table contains time values increasing from 0.02 to 0.54 seconds, acceleration values from 0 to 2.5 m/s², and corresponding calculated velocities increasing from 0 to 2.5 m/s. This data is used to demonstrate how to calculate velocity by finding the area under the acceleration vs. time curve. \" width=\"241\" height=\"232\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706044\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003eWe need to calculate the area of the first trapezoid, which is given by\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e{[𝑎(𝑡 = 0.02) + 𝑎(𝑡 = 0.06)]/2}\u0026nbsp; ∆𝑡,\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003ewhere ∆t is the base of the trapezoid, and \u003cem\u003ea(t=0.02)\u003c/em\u003e and \u003cem\u003ea(t=0.06)\u003c/em\u003e are the top corners of the trapezoid.\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\"\u003e\n\u003cli\u003eWe can calculate the base of the trapezoid ∆t, the change in time between cells, by using the formula “\u003cem\u003e\u003ccode\u003e=(A3-A2\u003c/code\u003e)\u003c/em\u003e” in cell \u003ccode\u003eC3\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eNext, we need to calculate the average of the heights of the trapezoid. We will do this by averaging the acceleration at two adjacent point resulting in the formula \u003ccode\u003e\u003cem\u003e((B2+B3)/2)\u003c/em\u003e\u003c/code\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706052/preview\" alt=\"Excel screenshot of trapezoid calculation\" width=\"331\" height=\"136\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706052\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003col style=\"list-style-type: decimal;\" start=\"3\"\u003e\n\u003cli\u003eThe area of the trapezoid is the base times the average of the heights. This gives the formula\u003ccode\u003e \u003cem\u003e=(A3-A2)*((B2+B3)/2)\u003c/em\u003e\u003c/code\u003e. This is the area of the first trapezoid that is width \u003cem\u003eΔt\u003c/em\u003e.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eAn integral sums the area of all of these trapezoids that we are calculating. In cell \u003ccode\u003e\u003cem\u003eC3\u003c/em\u003e\u003c/code\u003e, we will need to add the area in \u003ccode\u003e\u003cem\u003eC2\u003c/em\u003e\u003c/code\u003e. In cell \u003ccode\u003e\u003cem\u003eC4\u003c/em\u003e\u003c/code\u003e, we will need to add the area in \u003ccode\u003e\u003cem\u003eC3\u003c/em\u003e\u003c/code\u003e, and so on. So in our formula we add the area from the previous calculation. In cell \u003ccode\u003e\u003cem\u003eC3\u003c/em\u003e\u003c/code\u003e type “\u003ccode\u003e\u003cem\u003e=(A3-A2)*((B2+B3)/2)+C2\u003c/em\u003e\u003c/code\u003e”.\u003c/li\u003e\n\u003cli\u003eNow drag the formula in \u003ccode\u003e\u003cem\u003eC3\u003c/em\u003e\u003c/code\u003e down to the last time, \u003cstrong\u003et=0.54s...\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706055/preview\" alt=\"Excel spreadsheet showing cumulative velocity calculation\" width=\"296\" height=\"242\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706055\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eDerivative \u0026amp; Integral Essentials 🎬[5 of 5]\u003cbr\u003e\u003c/span\u003e\u003c/strong\u003eThis video covers approaches to reason about the use of integrals and derivatives.\u0026nbsp;\u003cbr\u003eIt is a must have in your Excel toolkit.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003ciframe title=\"YouTube video player\" src=\"https://www.youtube.com/embed/QXMrgxTSg2U?si=EybeaglUZfmR6QbB\" width=\"560\" height=\"315\" allowfullscreen=\"allowfullscreen\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" loading=\"lazy\"\u003e\u003c/iframe\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eDownloadable Resources ⬇️:\u003cbr\u003e\u003c/span\u003e\u003c/strong\u003e- Example Excel, (click on red tabs 🟥): \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_Excel-Skills-Ref.xlsx\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706030?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706030\" data-api-returntype=\"File\"\u003ePH211_Excel-Skills-Ref.xlsx\u003c/a\u003e\u003cbr\u003e- Video PowerPoint slides: \u003ca class=\"instructure_file_link instructure_scribd_file inline_disabled\" title=\"PH211_Excel-Derivitives-Integrals.pptx\" href=\"https://canvas.oregonstate.edu/courses/2053526/files/118706027?wrap=1\" target=\"_blank\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706027\" data-api-returntype=\"File\"\u003ePH211_Excel-Derivitives-Integrals.pptx\u003c/a\u003e\u003c/p\u003e\n\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eVideo Contents (Timestamps):\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 53.1731%; height: 87px;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 75.4887%; height: 29px;\"\u003e\u003cstrong\u003eConcept\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 24.4889%; height: 29px;\"\u003e\u003cstrong\u003eTimes\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 75.4887%; height: 29px;\"\u003eIntroduction, circling back to derivatives.\u0026nbsp;\u003c/td\u003e\n\u003ctd style=\"width: 24.4889%; height: 29px;\"\u003e00:00 - 00:18\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 29px;\"\u003e\n\u003ctd style=\"width: 75.4887%; height: 29px;\"\u003eDerivative theory (\u003ca class=\"inline_disabled\" href=\"https://www.youtube.com/watch?v=N2PpRnFqnqY\" target=\"_blank\"\u003eclick
