/6e5ec5a6-8084-4753-8b83-a972b89bb341?page_view_token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpIjoiNmU1ZWM1YTYtODA4NC00NzUzLThiODMtYTk3MmI4OWJiMzQxIiwidSI6MTAwMjAwMDAwMDY2NjA0MTQsImMiOiIyMDI2LTA3LTE4VDA2OjQwOjU1LjA1WiJ9.L8CTx9ILpZcPALS-VrkRIj2wMSu5bSYKwOJiDhXADUM","context_asset_string":"course_2053526","ping_url":"https://canvas.oregonstate.edu/api/v1/courses/2053526/ping","TIMEZONE":"America/Los_Angeles","CONTEXT_TIMEZONE":"America/Los_Angeles","LOCALES":["en"],"BIGEASY_LOCALE":"en_US","FULLCALENDAR_LOCALE":"en","MOMENT_LOCALE":"en","rce_auto_save_max_age_ms":86400000,"K5_USER":false,"USE_CLASSIC_FONT":false,"K5_HOMEROOM_COURSE":false,"K5_SUBJECT_COURSE":false,"OAK_SESSION_KEY":"igniteAgent","LOCALE_TRANSLATION_FILE":"https://du11hjcvx0uqb.cloudfront.net/dist/javascripts/translations/en-ff9e1ff943.json","ACCOUNT_ID":"144380","user_cache_key":"1f5f4c6844b6b80f255aabd47882ed72fb754d99a3c79cc4dd3fa051f84da5a9d0c00fa49f8d8be1438b3c7afce453d1affd6498a711a12d31111186ea263751","horizon_course":false,"HORIZON_ACCOUNT":false,"current_context":{"id":"2053526","name":"GENERAL PHYSICS WITH CALCULUS (PH_212_400_U2026)","type":"Course","url":"https://canvas.oregonstate.edu/courses/2053526"},"WIKI_RIGHTS":{"read":true},"PAGE_RIGHTS":{"read":true},"DEFAULT_EDITING_ROLES":"teachers","WIKI_PAGES_PATH":"/courses/2053526/pages","WIKI_PAGE":{"url":"lab-5-extending-a-model","title":"Lab 5 Extending a Model","created_at":"2026-05-23T13:58:51-07:00","editing_roles":"teachers","page_id":"10671765","last_edited_by":{"id":"6388600","anonymous_id":"3sxh4","display_name":"Roshell Lamug","avatar_image_url":"https://canvas.oregonstate.edu/images/messages/avatar-50.png","html_url":"https://canvas.oregonstate.edu/courses/2053526/users/6388600","pronouns":"She/Her/Hers"},"published":true,"hide_from_students":false,"front_page":false,"html_url":"https://canvas.oregonstate.edu/courses/2053526/pages/lab-5-extending-a-model","todo_date":null,"publish_at":null,"updated_at":"2026-06-11T22:37:13-07:00","locked_for_user":false,"body":"\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003ePH212 – General Physics with Calculus\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eExperimental goal: Determine whether the model for the period of a pendulum, which you tested last week, applies to large-amplitude oscillations.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eModels are not usually valid for all possible situations. In order to use a model to make predictions about real life, it’s important to know what its limitations are.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 191px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 191px;\"\u003e\n\u003ctd style=\"width: 99.92%; height: 191px;\"\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cstrong\u003e\u003cu\u003eAs you work through the lab:\u003c/u\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003eQ#\u003c/span\u003e: Bold, numbered items reference things that need to be included in your lab report questions to answer, data, plots, or drawings\u003cbr\u003e\u003c/strong\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■ \u003c/span\u003eItems with a square bullet are action items you’ll need to do to progress through the lab.\u003cbr\u003e\u003cspan class=\"symbol\"\u003e➤ \u003c/span\u003eItems with an arrow are hints, tips, or things to keep in mind when completing tasks.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px; text-align: center;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00;\"\u003eBoxed information is about either the expectations for your lab reports or key concepts for the course.\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003e\u003cbr\u003eLearning Objectives\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eLearning goal: Explore and understand how data collection methods and the range over which measurements are collected impact the conclusions you can make.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis lab activity is designed to help students practice the following skills:\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003eDesign an experiment to test a hypothesis.\u003c/li\u003e\n\u003cli\u003eUse available equipment to collect data in a systematic way.\u003c/li\u003e\n\u003cli\u003eFit simple functions to a data set.\u003c/li\u003e\n\u003cli\u003eWrite a clear and complete Procedure that allows others to replicate the experiment.\u003c/li\u003e\n\u003cli\u003eWrite a scientific Discussion that interprets data in the context of a physical model.\u0026nbsp;\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eRelated Documents\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca title=\"Excel Skills Handout\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/excel-skills-handout-2\" data-course-type=\"wikiPages\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/excel-skills-handout-2\" data-api-returntype=\"Page\"\u003eExcel Skills Document\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eEquipment\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eA computer with Excel installed\u003c/li\u003e\n\u003cli\u003eStopwatch\u003c/li\u003e\n\u003cli\u003eRuler or metric tape measure\u003c/li\u003e\n\u003cli\u003eProtractor or picture of a protractor printed on a page\u003c/li\u003e\n\u003cli\u003eDamage-free picture hanging hook (Command® strip)\u003c/li\u003e\n\u003cli\u003eSmall mass with negligible air resistance (e.g., a key ring, 12 oz soda can, or a lead fishing weight (at least 4 oz))\u003c/li\u003e\n\u003cli\u003eString (dental floss works well)\u003c/li\u003e\n\u003cli\u003eScissors\u003c/li\u003e\n\u003cli\u003eRefer to Lab materials page on canvas for future \u003ca title=\"Lab Supplies\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/lab-supplies\" data-course-type=\"wikiPages\" data-published=\"false\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/lab-supplies\" data-api-returntype=\"Page\"\u003elab supplies needed\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eWe advise against using the web version of Excel in this course. It doesn’t have all the functionality you’ll need.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003eIntroduction: A Risky Jump\u003c/h2\u003e\n\u003cp\u003eYou and your lab team have been hired to consult on a precision acrobatics show. There are many dangerous stunts in the show, requiring careful planning for safe performances. Right now, your team will evaluate an act involving a large swing with a person on it. Specifically, you must decide how the amount of time to complete a full back-and-forth motion (the period) depends on the angular displacement (amplitude) of the swing. Since we don’t have the space to set up a real swing in lab today, we will instead use a pendulum for a smaller-scale test.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 1: The Model\u003c/h2\u003e\n\u003cp\u003eIn the previous lab, we found that a good fit for the period of a simple pendulum is proportional to the square root of the pendulum’s length. This model does not include any amplitude (angle) dependence.\u003c/p\u003e\n\u003cp\u003eThe goal of today’s activity is to evaluate whether the period of a pendulum is truly independent of the angle of amplitude of the swing. The\u003cstrong\u003e model \u003c/strong\u003ethat we’re testing is:\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg class=\"equation_image\" title=\"T = 2 \\pi \\sqrt{L/g}\" src=\"https://canvas.oregonstate.edu/equation_images/T%2520%253D%25202%2520%255Cpi%2520%255Csqrt%257BL%252Fg%257D?scale=1\" alt=\"LaTeX: T = 2 \\pi \\sqrt{L/g}\" data-equation-content=\"T = 2 \\pi \\sqrt{L/g}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eT\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmn\u003e2\u003c/mn\u003e\n  \u003cmi\u003e\u0026amp;#x03C0;\u003c!-- π --\u003e\u003c/mi\u003e\n  \u003cmsqrt\u003e\n    \u003cmi\u003eL\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmo\u003e/\u003c/mo\u003e\n    \u003c/mrow\u003e\n    \u003cmi\u003eg\u003c/mi\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; Eq. (1)\u003c/p\u003e\n\u003cp\u003eWe have tested this for a small amplitude and found it to be a valid model. \u003cstrong\u003eWe would now like to see if there really is no dependence on amplitude by testing over a wide range of angles.\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 99.92%; padding-left: 40px; padding-right: 40px;\"\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eWhat is a Model?\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAn equation and its assumptions are a \u003cstrong\u003emodel\u003c/strong\u003e—a representation of physical behavior that may be expected to apply to a real system under certain conditions as stated. A model should both explain and predict physical behavior. Experiments are designed to check our understanding by testing a prediction made using the model, or \u003cem\u003ehypothesis\u003c/em\u003e, of the situation.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eStart by using a hypothesis, or model, to make a \u003cu\u003eprediction\u003c/u\u003e about the expected behavior of a specific system. (In this activity the hypothesis is provided.)\u003c/li\u003e\n\u003cli\u003eDesign an experiment to check this prediction. The experiment should be designed such that the data (and subsequent analysis) can either agree or disagree with prediction.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIf your results agree with your prediction, then we say that the experiment supports the hypothesis or model. If not, we say that the experiment refutes the hypothesis. All models have limitations in their applicability; experiments are the means by which we explore those limits.\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003eIn this lab the models and predictions have been provided to you.\u003c/span\u003e To test the model of Eq. (1), you will need to determine a method for precisely measuring the period of a pendulum at several different amplitudes.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 2: Plan the Experiment\u003c/h2\u003e\n\u003cp\u003eIn the last lab, you identified possible improvements that your group could make to the procedure for measuring the period. Today you will use an improved version of your procedure to carefully measure the period over a wide range of amplitudes.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ1\u003c/span\u003e: Describe your experimental set-up. Include a clearly labeled diagram that you can use to define the variables involved. Make sure you represent the important aspects of the experiment, including angles. For your group report, include one answer that represents the experimental set-up of all of your group members.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ2\u003c/span\u003e: Read the box below about assumptions. \u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eIdentify at least two important assumptions required to state that your apparatus in this experiment models the real-world problem described in the introduction.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWhat are the justifications for making these assumptions?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 99.92%; padding-left: 40px; padding-right: 40px;\"\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eAssumptions\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eA hypothesis typically includes assumptions about the situation being modeled. This could be ignoring a force or assuming it’s constant, or making some other simplification. For example:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIn free fall, we assume air resistance is negligible (so small that its effects can be ignored).\u003c/li\u003e\n\u003cli\u003eHooke’s law assumes the elasticity of a spring is constant – the spring constant.\u003c/li\u003e\n\u003cli\u003eCalculations of Earth’s gravity may assume a perfectly spherical planet.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThese assumptions may or may not be justified. For example:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA billiard ball on Earth falls for at least short distances with an acceleration of g, the same as in a vacuum, as if there were no air. Assuming air resistance is negligible is valid when considering its motion.\u003c/li\u003e\n\u003cli\u003eA sheet of paper falls much more slowly. The assumption that air resistance is negligible is not valid – predictions made from a model that ignores air resistance will not match what is observed.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIdentifying, justifying, and checking assumptions is an important part of an experiment.\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eAs stated above, the goal of today’s experiment is to test whether the model \u003cimg class=\"equation_image\" title=\"T = 2 \\pi \\sqrt{L/g}\" src=\"https://canvas.oregonstate.edu/equation_images/T%2520%253D%25202%2520%255Cpi%2520%255Csqrt%257BL%252Fg%257D?scale=1\" alt=\"LaTeX: T = 2 \\pi \\sqrt{L/g}\" data-equation-content=\"T = 2 \\pi \\sqrt{L/g}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eT\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmn\u003e2\u003c/mn\u003e\n  \u003cmi\u003e\u0026amp;#x03C0;\u003c!-- π --\u003e\u003c/mi\u003e\n  \u003cmsqrt\u003e\n    \u003cmi\u003eL\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmo\u003e/\u003c/mo\u003e\n    \u003c/mrow\u003e\n    \u003cmi\u003eg\u003c/mi\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e is still valid for motion with a large amplitude.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYou’ll need to measure the period at a range of different amplitudes (\u003cstrong\u003eup to at least 60°. Larger amplitudes are better\u003c/strong\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cu\u003eUncertainty in the period:\u003c/u\u003e\u003c/strong\u003e\u003cu\u003e \u003c/u\u003e\u003c/p\u003e\n\u003cp\u003eAt each amplitude:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eYou should make one measurement of the period over one or more swings. This will give you one measurement of the period with an associated measurement uncertainty.\u003c/li\u003e\n\u003cli\u003eYou should repeat the measurement at that angle multiple times to see how consistent your result is. You can then find your statistical uncertainty from the standard deviation of your individual measurements or by taking half the spread of the data.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eYour total uncertainty for the period at that angle will be a combination of the measurement and statistical uncertainties. This is described further in the section on Analyzing the Data\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ3\u003c/span\u003e: Describe your experimental procedure, incorporating the information above.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eList the steps in sufficient detail that someone familiar with the equipment could reproduce your experiment. Be sure to explain how you will determine the period from your timing measurements, and clearly identify any changes you have made to your procedure since the previous lab.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eState the pendulum length your group will use and list the starting angles at which each member of your group will measure the period. (Refer to your Lab 3 Q2 response from last week)\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWe recommend that each group member measure the period at least three different starting angles (between approximately 15\u003cstrong class=\"Yjhzub\" data-processed=\"true\"\u003e°\u003c/strong\u003e \u003c/strong\u003e\u003cstrong\u003eand 60\u003cstrong class=\"Yjhzub\" data-processed=\"true\"\u003e°\u003c/strong\u003e\u003c/strong\u003e\u003cstrong\u003e), with larger amplitudes preferred.\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cu\u003eThe role of “error” bars \u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eRecall from the previous lab (see the appendix of this handout to review the key information) that we can never know the “true value” of a measurand (measured quantity). Error bars, more properly but virtually never called uncertainty bars, represent the uncertainty in a data point and are crucial to fully represent what we know about a measurand.\u003c/p\u003e\n\u003cp\u003eThe error bars in the graph represent a range of possible values for the measurand. For two points to be confirmed as different, their error bars shouldn’t overlap – in other words, if the error bars for two measurements overlap, you cannot rule out the possibility that they are the same. To confirm that a data point deviates from your expectations, the full range of its error bars should be outside your expectation.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ4\u003c/span\u003e: Plan your analysis. Describe how you will use your data to check if there is a relationship between starting amplitude and period. Remember, \u003cem\u003ewe are predicting that there is no relationship between period and angle.\u003c/em\u003e What can you look for in your data that might suggest there really is a relationship? Don’t forget to think about uncertainty in your measurements in your planned analysis.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 3: Collect Data\u003c/h3\u003e\n\u003cp\u003ePerform your experiment and record your data. This should include the value and uncertainty of each measurement at each angle. It may also include an average and statistical uncertainty over all the runs at each angle.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ5\u003c/span\u003e: Include a copy of your data table(s), including column labels with units. Report the uncertainty in each measurement using the 𝑨 ± ∆\u003csub\u003e𝑨\u003c/sub\u003e format (an explanation of how to find uncertainty is explained in the \u003cu\u003eUncertainty in the period\u003c/u\u003e section).\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 4: Analyze the Data\u003c/h3\u003e\n\u003cp\u003eNow, plot the data that you collected.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ6\u003c/span\u003e: Perform the analysis that you planned previously.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eCalculate the total uncertainty at each angle \u003cimg class=\"equation_image\" title=\"\\Delta T_{total}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520T_%257Btotal%257D?scale=1\" alt=\"LaTeX: \\Delta T_{total}\" data-equation-content=\"\\Delta T_{total}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003el\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e \u003c/strong\u003e\u003cstrong\u003eby adding the measurement and statistical uncertainties in quadrature: \u003cimg class=\"equation_image\" title=\"\\Delta T_{total} = \\sqrt{(\\Delta T_m)^2 + \\Delta T_s)^2}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520T_%257Btotal%257D%2520%253D%2520%255Csqrt%257B(%255CDelta%2520T_m)%255E2%2520%252B%2520%255CDelta%2520T_s)%255E2%257D?scale=1\" alt=\"LaTeX: \\Delta T_{total} = \\sqrt{(\\Delta T_m)^2 + \\Delta T_s)^2}\" data-equation-content=\"\\Delta T_{total} = \\sqrt{(\\Delta T_m)^2 + \\Delta T_s)^2}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003el\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsqrt\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmi\u003em\u003c/mi\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n    \u003cmo\u003e+\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmi\u003es\u003c/mi\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eInclude any graphs you make, with all the required elements. Add the total uncertainty to your plot as error bars. (See the appendix at the end of this handout for a reminder of what you should include in a graph.)\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 5: Reflect and Conclude\u003c/h3\u003e\n\u003cp\u003eThis activity is meant to show how an experiment tests a hypothesis or model by checking a prediction. You should now have a graph you can use to evaluate the model.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eDiscuss the questions below with your group and provide a single answer you all agree on. Making a recommendation is the ultimate goal of your experiment!\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ7\u003c/span\u003e: Based on this experiment, is the period independent of angle?\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eIf it is independent, justify your conclusion using the data from your experiment and discuss the effects of uncertainty on your conclusion.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eIf it \u003cem\u003eis\u003c/em\u003e dependent on angle, what does the relationship seem to be? Try different curve fits to determine which relationship seems to be the best. Be sure to discuss the effects of uncertainty on your conclusion.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ8\u003c/span\u003e: How did the range over which you collected your measurements and the precision of your data collection methods impact the conclusions you were able to draw? Reflect on any limitations you encountered and how different approaches might have altered your results.\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ9\u003c/span\u003e: In the act, the performer plans to swing at a maximum amplitude of 60º. Based on your results, would you recommend they use the model given by Eq. (1) or should they use a different one to ensure their safety? Justify your recommendation.\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 6: Capstone Component – Procedure \u0026amp; Discussion\u003c/h3\u003e\n\u003cp\u003eIn scientific writing, the Procedure and Discussion sections work together to show not only \u003cem\u003ewhat you did\u003c/em\u003e, but also \u003cem\u003ewhat your results mean\u003c/em\u003e. The Procedure describes how you designed and carried out your experiment so that someone else could repeat it. The Discussion interprets your results in the context of the physical model you were testing.\u003c/p\u003e\n\u003cp\u003eIn this activity, you will write both a Procedure and a Discussion section based on your group’s investigation of whether the small-angle pendulum model remains valid for larger-amplitude oscillations. In your Procedure, you will clearly explain how you measured the pendulum’s period at different starting angles and how your setup allowed you to test the model’s assumptions. In your Discussion, you will use your data to evaluate whether the period truly remains independent of angle, considering uncertainty, trends in your graphs, and limitations of your method.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ10\u003c/span\u003e: Write a\u0026nbsp;Procedure and Discussion\u0026nbsp;section for this lab experiment.\u0026nbsp;Refer below\u0026nbsp;for\u0026nbsp;guidance on\u0026nbsp;what to include in\u0026nbsp;the\u0026nbsp;Procedure.\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cspan style=\"font-family: 'times new roman', times;\"\u003eIV. \u003c/span\u003e\u003c/span\u003e\u003cu\u003eProcedure Structure:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\n\u003col style=\"background: whitesmoke; border-left: 6px solid #d73f09; padding: 15px; margin: 20px 0 25px 0;\"\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003eOverview of\u0026nbsp;Experimental\u0026nbsp;Design\u0026nbsp;(1–3\u0026nbsp;sentences)\u0026nbsp;\u003cem\u003eWhat system were you studying? What were the main physical quantities you were trying to measure or compare? What model or prediction were you testing?\u003c/em\u003e\u0026nbsp;\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eYou studied the motion of a simple pendulum and measured the period of oscillation for different starting angles. What model are you testing to see if it remains valid and what does it predict about the period versus the amplitude?\u0026nbsp;\u003c/li\u003e\n\u003cli\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eList of Materials (bulleted list or short paragraph)\u0026nbsp;\u003cem\u003eWhat materials did you use? Be specific.\u003c/em\u003e\u0026nbsp;\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eYou can generalize the masses you used in your pendulums as a “pendulum bob”\u003c/li\u003e\n\u003cli\u003e\u003cem\u003e\u003c/em\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eExperimental Setup (2–3 sentences or a labeled diagram)\u0026nbsp;\u003cem\u003eHow did you arrange your equipment? What\u0026nbsp;was\u0026nbsp;the general setup for each trial?\u003c/em\u003e\u0026nbsp;\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eHow was the pendulum suspended? How did you measure its length? How did you set the starting angle for each trial?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eInclude a labeled diagram of your experimental setup (Q1 response)\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eData Collection Strategy (2–3 sentences)\u0026nbsp;\u003cem\u003eHow many data points did you collect? How did you ensure reliable and reproducible measurements?\u003c/em\u003e\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat range of angles did you test? How many trials did you take at each angle? Did you time one swing or multiple swings per trial, and why?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSafety or Error Considerations (optional, 1–2 sentences)\u0026nbsp;\u003cem\u003eWere there any precautions you took to improve safety or reduce error?\u003c/em\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u0026nbsp; \u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eHow did you reduce reaction-time error? How did you ensure the pendulum moved in a single plane and didn’t twist?\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eStep-by-Step Procedure (bullet points or paragraph form)\u0026nbsp;\u003cem\u003eDescribe the process you followed to collect data.\u003c/em\u003e\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eInclude things like: how you measured and fixed the pendulum length, how you set each starting angle, how you released the pendulum, how you timed the motion, how many oscillations you timed and how you calculated the period, why you chose your specific angle spacing or number of trials.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cspan style=\"font-family: 'times new roman', times;\"\u003eV. \u003c/span\u003e\u003c/span\u003e\u003cu\u003eDiscussion Structure:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\n\u003col style=\"background: whitesmoke; border-left: 6px solid #d73f09; padding: 15px; margin: 20px 0 25px 0;\"\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003eOverview of the Experiment\u0026nbsp;(1–2 sentences)\u0026nbsp;\u003cem\u003eWhat physical system where you studying?\u0026nbsp;What was the goal of the experiment?\u003c/em\u003e\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat model for the pendulum period were you testing?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat variable was intentionally changed, and what was held constant?\u003c/li\u003e\n\u003cli\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eKey Quantitative Results\u0026nbsp;(2–4 sentences)\u0026nbsp;\u003cem\u003eWhat\u0026nbsp;quantities did you measure\u0026nbsp;and what was the range of your tests? What calculated values did you obtain?\u003c/em\u003e\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eWhat pendulum length did you use?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eWhat range of starting angles did you test?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eHow did the measured period vary across this range?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eWere any differences comparable to or larger than the total uncertainty?\u003c/li\u003e\n\u003cli\u003e\u003cem\u003e\u003c/em\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eVisual Representation of Results\u0026nbsp;(1–2\u0026nbsp;sentences)\u0026nbsp;\u003cem\u003eWhat graphs, charts, or tables best show your results?\u003c/em\u003e\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat quantities were plotted on each axis?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eHow did the inclusion of uncertainty (error bars) affect your interpretation?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eDid the data visually support or challenge the prediction of angle independence?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTrends and Patterns Observed\u0026nbsp;(1–2 sentences)\u0026nbsp;\u003cem\u003eWhat general behavior did the data show?\u0026nbsp;Did the trend match the prediction from your model?\u003c/em\u003e\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eDoes the period appear independent of angle within uncertainty?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eAt what amplitudes, if any, do deviations from the model become noticeable?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eAre these deviations large enough to be considered significant?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLimitations and Model Extension (2–3 sentences) \u003cem\u003eWhat limits your ability to draw a strong conclusion, and how might the experiment be improved?\u003c/em\u003e\u0026nbsp;\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eHow did measurement uncertainty affect your ability to detect angle dependence?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eHow did the range of amplitudes tested influence your conclusions?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat changes to the procedure could better test the limits of the small-angle approximation?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 7: Lab Group Check-In Survey\u003c/h3\u003e\n\u003cp\u003eThis short survey helps your TA monitor group dynamics and support you during the labs. Please answer honestly about how your group is working together. Your responses will remain anonymous unless you choose to include your name. The survey is worth 5 points toward your lab grade and is graded only on completion, not on the content of your answers. Use this as a chance to raise any concerns to your TA (for example, if group members are not contributing to the lab report) or if you would like your TA to address anything during your lab meetings. Please complete this survey by the same deadline as your lab report submission.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca title=\"Lab Group Check-In Survey (Lab 4)\" href=\"https://canvas.oregonstate.edu/courses/2053526/quizzes/3160466\" data-course-type=\"quizzes\" data-published=\"false\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/quizzes/3160466\" data-api-returntype=\"Quiz\"\u003eLab Group Check-In Survey (Lab 5)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 8: Submit Your Group’s Lab Report\u003c/h3\u003e\n\u003cp\u003eMake sure everyone’s name is on your group’s lab report. If you submit through Gradescope, remember to add everyone in your group to the assignment. This is done at the end of the submission process.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca class=\"inline_disabled external\" href=\"https://help.gradescope.com/article/m5qz2xsnjy-student-add-group-members\" target=\"_blank\"\u003e\u003cspan\u003eHow to add group members to your submission in Gradescope is outlined here\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003eAppendix – Reference Information\u003c/h3\u003e\n\u003cp\u003eThis section contains key information from previous labs:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eRequired Plot Elements\u003c/li\u003e\n\u003cli\u003eWhat is Uncertainty?\u003c/li\u003e\n\u003cli\u003eSources of Uncertainty\u003c/li\u003e\n\u003cli\u003eLinearization\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eRequired Plot Elements\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDo not connect the data points with lines.\u003c/li\u003e\n\u003cli\u003eMake sure you create \u003cem\u003eScatter Plots\u003c/em\u003e and not \u003cem\u003eLine Plots\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003eEvaluate if the plot makes sense. Are the axes correct? Do you have the right number of data points?\u003c/li\u003e\n\u003cli\u003eInclude a descriptive title and labels on each axis, always including physical units.\u003c/li\u003e\n\u003cli\u003eAdd a legend, unless you only have one set of data and the title describes it.\u003c/li\u003e\n\u003cli\u003eDisplay the equation and R\u003csup\u003e2\u003c/sup\u003e value for any trendline you include.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eWhat is Uncertainty?\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eUncertainty\u003c/em\u003e is the acknowledgement that we cannot measure things exactly, and so any conclusion based on measurements will always include a range of possible answers. When making a measurement, there is no single “true value” of the measurand (measured quantity) that we can determine. Instead, we can define an interval that defines the range of values that we think are probable for the measurand. The narrower the interval, the more precisely we can approximate the measurand.\u003c/p\u003e\n\u003cp\u003eWhen including uncertainty in a value, we report it as \u003cstrong\u003eA ± Δ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. We believe the value is \u003cstrong\u003eA\u003c/strong\u003e, but we’re unable to rule out the possibility that it’s higher or lower by an amount \u003cstrong\u003eΔ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. (Sometimes it’s written +Δ\u003csub\u003e1\u003c/sub\u003e / -Δ\u003csub\u003e2\u003c/sub\u003e if the higher and lower ranges are different.) For example, a time might be reported as 2.45 s ± 0.03 s.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eSources of Uncertainty:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe uncertainty in a measurement can be due to a combination of several factors. A crucial aspect of experimentation is to identify all such sources of uncertainty and to numerically estimate their effect on your measurement result.\u003c/p\u003e\n\u003cp\u003eCommon sources of uncertainty include:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ethe effects of environmental conditions on the measurement\u003c/li\u003e\n\u003cli\u003eyour judgement in reading analogue instruments\u003c/li\u003e\n\u003cli\u003ethe sensitivity of your instruments (e.g. the digital scale)\u003c/li\u003e\n\u003cli\u003ethe rating or stated calibration of the instrument\u003c/li\u003e\n\u003cli\u003eapproximations and assumptions that you make while doing the experiment\u003c/li\u003e\n\u003cli\u003evariations in repeated readings made under apparently identical conditions\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eLinearization\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIn the context of data analysis, “linear” refers to a directly proportional relationship between the dependent and independent variables in an equation.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMathematically, if two variables 𝑥 and 𝑦 have a linear relationship, we can express this as 𝑦 = 𝑚𝑥 + 𝑏 where m and b are constants.\u003c/li\u003e\n\u003cli\u003eMore simply, we can write this as 𝑦 ∝ 𝑥 where ∝ means “is proportional to”.\u003c/li\u003e\n\u003cli\u003eWhen graphed, data with a linear relationship falls on a straight line.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLinearization comes in handy when your data or hypothesis is not linear. \u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eWhen you fit data with a linear trendline, you are essentially checking whether the two variables are proportional to each other. To check a nonlinear hypothesis, can we instead check if one variable is proportional to a function of the other variable.\u003c/p\u003e\n\u003cp\u003eIn practice, \u003cstrong\u003elinearization is done by calculating a new column of data\u003c/strong\u003e, that gives the values of a function of the input variable. Typically, the input variable is the independent variable, and the function is chosen so that the resulting quantity is proportional to the dependent variable.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy Linearize?\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLinear data is typically easier to understand and analyze.\u003c/li\u003e\n\u003cli\u003eThere are analysis methods we can apply to linear data that don’t work as well (or at all) with nonlinear data.\u003c/li\u003e\n\u003cli\u003eIt is relatively easy to fit a line to data - there are just two important values to determine: the slope and intercept of the data.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e"},"WIKI_PAGE_REVISION":"3","WIKI_PAGE_SHOW_PATH":"/courses/2053526/pages/lab-5-extending-a-model","WIKI_PAGE_EDIT_PATH":"/courses/2053526/pages/lab-5-extending-a-model/edit","WIKI_PAGE_HISTORY_PATH":"/courses/2053526/pages/lab-5-extending-a-model/revisions","COURSE_ID":"2053526","MODULES_PATH":"/courses/2053526/modules","wiki_page_menu_tools":[],"wiki_index_menu_tools":[],"DISPLAY_SHOW_ALL_LINK":false,"CAN_SET_TODO_DATE":false,"ALLOW_ASSIGN_TO_DIFFERENTIATION_TAGS":true,"CAN_MANAGE_DIFFERENTIATION_TAGS":false,"EDITOR_FEATURE":null,"VALID_DATE_RANGE":{"start_at":{"date":"2026-06-21T07:00:00Z","date_context":"course"},"end_at":{"date":"2026-09-21T07:00:00Z","date_context":"course"}},"SECTION_LIST":[{"id":"2337362","name":"GENERAL PHYSICS WITH CALCULUS (PH_212_400_U2026)","start_at":null,"end_at":null,"override_course_and_te
