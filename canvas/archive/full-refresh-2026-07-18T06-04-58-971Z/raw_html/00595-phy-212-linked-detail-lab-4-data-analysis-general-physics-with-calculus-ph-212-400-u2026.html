ser":false,"body":"\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003ePH212 – General Physics with Calculus\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eExperimental goal: Determine the period T of a pendulum with a set length. Then investigate how the period of a pendulum depends on its length and compare to a given hypothesis.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIn this lab activity, you will create a simple experiment to investigate periodic motion and practice data analysis techniques to compare your data to a given hypothesis.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 191px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 191px;\"\u003e\n\u003ctd style=\"width: 99.92%; height: 191px;\"\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cstrong\u003e\u003cu\u003eAs you work through the lab:\u003c/u\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003eQ#\u003c/span\u003e: Bold, numbered items reference things that need to be included in your lab report questions to answer, data, plots, or drawings\u003cbr\u003e\u003c/strong\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■ \u003c/span\u003eItems with a square bullet are action items you’ll need to do to progress through the lab.\u003cbr\u003e\u003cspan class=\"symbol\"\u003e➤ \u003c/span\u003eItems with an arrow are hints, tips, or things to keep in mind when completing tasks.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px; text-align: center;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00;\"\u003eBoxed information is about either the expectations for your lab reports or key concepts for the course.\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003e\u003cbr\u003eLearning Objectives\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eLearning goal: Learn and practice fundamental data analysis skills\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis lab activity is designed to help students practice the following skills:\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003eChoose appropriate data collection procedures.\u003c/li\u003e\n\u003cli\u003eCreate scatter plots of data.\u003c/li\u003e\n\u003cli\u003eLinearize and fit simple functions to a data set.\u003c/li\u003e\n\u003cli\u003eDetermine whether data supports a hypothesis.\u003c/li\u003e\n\u003cli\u003eUse quantitative evidence to explain what the experiment shows in an abstract.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eRelated Documents\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca title=\"Excel Skills Handout\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/excel-skills-handout-2\" data-course-type=\"wikiPages\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/excel-skills-handout-2\" data-api-returntype=\"Page\"\u003eExcel Skills Document\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eEquipment\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eA computer with Excel installed\u003c/li\u003e\n\u003cli\u003eStopwatch\u003c/li\u003e\n\u003cli\u003eRuler or metric tape measure\u003c/li\u003e\n\u003cli\u003eProtractor or picture of a protractor printed on a page\u003c/li\u003e\n\u003cli\u003eDamage-free picture hanging hook (Command® strip)\u003c/li\u003e\n\u003cli\u003eSmall mass with negligible air resistance (e.g., a key ring, 12 oz soda can, or a lead fishing weight (at least 4 oz))\u003c/li\u003e\n\u003cli\u003eString (dental floss works well)\u003c/li\u003e\n\u003cli\u003eScissors\u003c/li\u003e\n\u003cli\u003eRefer to Lab materials page on canvas for future \u003ca title=\"Lab Supplies\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/lab-supplies\" data-course-type=\"wikiPages\" data-published=\"false\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/lab-supplies\" data-api-returntype=\"Page\"\u003elab supplies needed\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eWe advise against using the web version of Excel in this course. It doesn’t have all the functionality you’ll need.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 1: Establish the Measurement Procedure\u003c/h2\u003e\n\u003cp\u003eThe most basic type of oscillatory motion is known as simple harmonic motion, which occurs when an object experiences a restoring force proportional to its displacement from equilibrium. A simple pendulum, consisting of a small mass suspended by a light string of length L, exhibits this behavior for small angular displacements. Under the small-angle approximation, the period of a pendulum is given by\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg class=\"equation_image\" title=\"T = 2 \\pi \\sqrt{L/g}\" src=\"https://canvas.oregonstate.edu/equation_images/T%2520%253D%25202%2520%255Cpi%2520%255Csqrt%257BL%252Fg%257D?scale=1\" alt=\"LaTeX: T = 2 \\pi \\sqrt{L/g}\" data-equation-content=\"T = 2 \\pi \\sqrt{L/g}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eT\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmn\u003e2\u003c/mn\u003e\n  \u003cmi\u003e\u0026amp;#x03C0;\u003c!-- π --\u003e\u003c/mi\u003e\n  \u003cmsqrt\u003e\n    \u003cmi\u003eL\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmo\u003e/\u003c/mo\u003e\n    \u003c/mrow\u003e\n    \u003cmi\u003eg\u003c/mi\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp; \u0026nbsp; \u0026nbsp; Eq. (1)\u003c/p\u003e\n\u003cp\u003ewhere \u003cimg class=\"equation_image\" title=\"g\" src=\"https://canvas.oregonstate.edu/equation_images/g?scale=1\" alt=\"LaTeX: g\" data-equation-content=\"g\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eg\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp;is the acceleration due to gravity, and the period depends only on the pendulum length and not on the mass or amplitude of the motion.\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u0026nbsp;\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706072/preview\" alt=\"Diagram of a simple pendulum. A mass labeled M hangs from a light string of length L, suspended from a fixed pivot at the top. The pendulum is shown displaced to one side, making an angle θ with the vertical dashed equilibrium line. The horizontal displacement of the mass from equilibrium is labeled Δx. The diagram illustrates the geometry of a pendulum undergoing small-angle oscillations.\" width=\"363\" height=\"274\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706072\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003eIn this experiment, you will construct a simple pendulum using household materials and measure its oscillation period for different lengths. \u003cstrong\u003eYou\u003c/strong\u003e\u003cstrong\u003e will also compare measurements taken at starting angles of 5\u003cspan\u003e°\u003c/span\u003e\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003eand 10\u003cspan\u003e°\u003c/span\u003e \u003c/strong\u003e\u003cstrong\u003eto examine whether the period remains independent of amplitude within the small-angle regime.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cu\u003eProcedure\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; \u003cspan style=\"text-decoration: underline;\"\u003eA. \u003c/span\u003e\u003cu\u003eSetting Up the Pendulum\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 1. Select a hanging mass (bob).\u003c/strong\u003e\u003cbr\u003eChoose a small, dense object to serve as the pendulum bob. Dense objects experience less air resistance and produce more reliable timing measurements.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIdeal options include a metal washer stack, a heavy key ring, or a lead fishing weight (≥ 4 oz).\u003c/li\u003e\n\u003cli\u003eAcceptable household alternatives include a can of soda, a small jar filled with coins, or a compact metal object.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe bob should be securely attached and should not deform or swing unevenly during motion.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 2. Prepare the string.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCut a piece of string, thread, or thin cord to serve as the pendulum string.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe string should be light compared to the bob and should not stretch noticeably.\u003c/li\u003e\n\u003cli\u003eA good starting length is approximately the distance from your eye to your outstretched hand, though this will be adjusted later.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706073/preview\" alt=\"Photograph of a printed protractor taped to a wall with a pendulum string hanging in front of it. The string is aligned near the center of the protractor, and the angle is read relative to the vertical direction. The vertical reference corresponds to the 90-degree mark on the protractor.\" width=\"495\" height=\"277\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706073\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFigure 1: Measuring the string angle with a printable protractor. Note that the angle should be measured from the vertical (measure the angle from the 90 degree mark of the protractor to the string)\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 3. Choose a stable anchor point.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYou will need a rigid support from which to suspend your pendulum. Since the pendulum will swing freely, ensure there is clear space around it.\u003cbr\u003eAcceptable anchor points include:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAn adhesive picture-hanging hook attached to the ceiling (see Figure 1, this can be further reinforced with tape)\u003c/li\u003e\n\u003cli\u003eA sturdy hook or nail\u003c/li\u003e\n\u003cli\u003eA fork gently wedged over the top of a doorframe (see \u003cstrong\u003eFigure 3\u003c/strong\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMake sure the anchor point does not move during the motion of the pendulum.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 4. Attach the string to the anchor.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTie the string to the anchor point using a \u003cstrong\u003eslip knot\u003c/strong\u003e, as shown in \u003cstrong\u003eFigure 2\u003c/strong\u003e. The slip knot allows small adjustments to the pendulum length without retying the knot and helps ensure the pivot point remains well defined.\u003c/p\u003e\n\u003cp\u003e\u003cimg style=\"display: block; margin-left: auto; margin-right: auto;\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706074/preview\" alt=\"Four-panel image showing steps for setting up a simple pendulum. Panel (a) shows a string tied with a slip knot. Panels (b) and (c) show the string looped over and attached to a picture-hanging hook on a wall or ceiling. Panel (d) shows the completed pendulum, with the string hanging vertically and a small mass attached at the bottom.\" width=\"523\" height=\"276\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706074\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003eFigure 2: Example of the pendulum set up: tying a slip knot (a), attaching the string to the picture hanging hook (b) and (c), the complete pendulum (d).\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706075/preview\" alt=\"Two photographs showing a working pendulum setup. In the left image, a heavy metal key ring hangs from a thin thread. In the right image, the thread is suspended over a fork that is gently placed across the top of a doorjamb, forming a stable pivot point.\" width=\"529\" height=\"392\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706075\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003eFigure 3: An example of a pendulum that worked well: a heavy key ring was hung by a thin length of thread suspended by a fork gently placed in a doorjamb.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; \u003cspan style=\"text-decoration: underline;\"\u003eB. \u003c/span\u003e\u003cu\u003eCreating the Pendulum\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 1. Assemble the pendulum.\u003c/strong\u003e\u003cbr\u003eAttach the bob securely to the free end of the string so it hangs vertically when at rest. Example household pendulum constructions are shown in \u003cstrong\u003eFigures 2 and 3\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 2. \u003c/strong\u003e\u003cstrong\u003eCheck the physical requirements.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eYour pendulum should satisfy the following conditions:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe bob is small and dense to minimize air resistance\u003c/li\u003e\n\u003cli\u003eThe string has negligible mass compared to the bob\u003c/li\u003e\n\u003cli\u003eThe pivot point is stable and does not slip\u003c/li\u003e\n\u003cli\u003eThe pendulum swings freely without contacting walls, furniture, or the floor\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem;\"\u003e\u0026nbsp; 3. Measure the pendulum length L\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eMeasure the distance from the pivot point to the \u003cstrong\u003ecenter of mass of the bob\u003c/strong\u003e, as defined in \u003cstrong\u003eFigure 3\u003c/strong\u003e.\u003cbr\u003eRecord this length in meters. This measured length \u0026nbsp;will be used in your data analysis. Make sure the anchor point does not move during the motion of the pendulum.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; \u003cspan style=\"text-decoration: underline;\"\u003eC. \u003c/span\u003e\u003cu\u003eSetting the Starting Angle (5° and 10°)\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 1. Use a protractor to set the angle.\u003c/strong\u003e\u003cbr\u003eUse a real or a printable protractor (shown in \u003cstrong\u003eFigure 1\u003c/strong\u003e) to measure the angle from the \u003cstrong\u003evertical\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 2. Two required starting angles.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eFor each chosen length , you will collect timing data for:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cimg class=\"equation_image\" title=\"\\theta\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ctheta?scale=1\" alt=\"LaTeX: \\theta\" data-equation-content=\"\\theta\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03B8;\u003c!-- θ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e = 5°\u003c/li\u003e\n\u003cli\u003e\u003cimg class=\"equation_image\" title=\"\\theta\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ctheta?scale=1\" alt=\"LaTeX: \\theta\" data-equation-content=\"\\theta\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03B8;\u003c!-- θ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e = 10°\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; \u003cu\u003eD. Measuring the Period\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 1. Release the pendulum.\u003c/strong\u003e\u003cbr\u003eRelease the bob from rest without pushing it. The pendulum should begin oscillating smoothly in a single plane.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 2. Choose a timing strategy and reference point.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTo reduce timing uncertainty, measure the total time required for many oscillations and divide by the number of oscillations measured to determine the period. To reduce timing uncertainty, you should time multiple oscillations rather than just one. Decide how many oscillations you will time and explain in Q1 why that number is a good choice for balancing precision and practicality. You should also choose a clear, repeatable reference point in the motion at which to start and stop the stopwatch. For example, the lowest point of the swing is often a good reference point because it is easier to identify consistently, but any well-defined point may be used if it is used consistently throughout the experiment.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 3. \u003c/strong\u003e\u003cstrong\u003eCount oscillations carefully.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCount each time the pendulum passes through the bottom of its swing.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEach pass corresponds to \u003cstrong\u003ehalf of a cycle\u003c/strong\u003e (e.g., if you decide to count until the pendulum completes \u003cstrong\u003e20 full cycles\u003c/strong\u003e, it will correspond to \u003cstrong\u003e40 bottom passes)\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 4. Stop the stopwatch when the pendulum reaches its desired number of passes.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; 5. Calculate the period.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eUse your total measured time and the number of oscillations to calculate the period of one oscillation.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp; \u003cu\u003eE. Conducting the Experiment\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eFor each length L (\u003cstrong\u003eat least three lengths\u003c/strong\u003e):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCoordinate with your group to decide which pendulum lengths each member will measure. Plan your measurements so that, taken together, your group produces a cohesive data set that spans a meaningful range of lengths, rather than multiple members measuring the same values.\u003c/li\u003e\n\u003c/ul\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eCollect period data at 5° \u003c/strong\u003e\u003cstrong\u003e(using your chosen timing strategy and reference point). \u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eCollect period data at 10° \u003c/strong\u003e\u003cstrong\u003e(same timing strategy and reference point).\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eKeep everything else the same (same bob, string, pivot, and length definition).\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eRepeat trials as needed.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eFor each (L,\u003cimg class=\"equation_image\" title=\"\\theta\" src=\"https://canvas.oregonstate.edu/equation_images/%255Ctheta?scale=1\" alt=\"LaTeX: \\theta\" data-equation-content=\"\\theta\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03B8;\u003c!-- θ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e) condition, perform enough trials to get consistent results (you decide how many). If results vary widely, increase the number of oscillations timed and/or improve consistency of the release and timing reference point.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 2: Plan the Experiment\u003c/h2\u003e\n\u003cp\u003eAlthough a general procedure is provided, each student must decide on specific measurement choices for their own experiment.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ1\u003c/span\u003e: Individually describe your experimental plan, including:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003e\u003cstrong\u003eThe materials used to construct your pendulum (bob, string, and pivot/anchor)\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe range of pendulum lengths you will use and how many distinct lengths you will measure for \u003c/strong\u003e\u003cstrong\u003e5˚ and 10˚\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe number of trials you will perform for each length\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe number of oscillations you will time for each trial\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe reference point you will use to start and stop timing\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eExplain briefly why you chose these values and how they help reduce measurement uncertainty.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤ \u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003cstrong\u003eTo create a group response for your report, you can summarize the ranges of aspect of the experimental plan.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ2\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eIndividually determine the range of pendulum lengths that can be safely and accurately used in your experimental setup when the pendulum is displaced to an angle of 60˚\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u0026nbsp;\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤ \u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003cstrong\u003eNext week, your group will use one fixed pendulum length and explore a wider range of angles. Establishing feasible length limits now will help ensure consistent and safe data collection.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ3\u003c/span\u003e:\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003cstrong\u003eDiscuss whether and how your individual data can be combined with data from other members of your group. In your discussion, address the following:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWhich aspects of your procedures must match for data to be meaningfully combined (e.g., length definition, timing method, reference point)\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWhich differences between group members’ procedures may introduce systematic differences in the data\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWhether you expect combining data to improve the final determination of \u003c/strong\u003e\u003cstrong\u003e, and why or why not.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ4\u003c/span\u003e: Read the box below on sources of uncertainty.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eList which sources you expect will contribute significantly to the uncertainty in each measurement of the period (for simplicity, we will not consider uncertainty in the angle or length measurements). \u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eFor each source, state specifically where the uncertainty comes from and estimate a value. \u003c/strong\u003e(The statistical uncertainty cannot be found until after you’ve taken your measurements. You’ll find it in question 6.)\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 99.92%; padding-left: 40px; padding-right: 40px;\"\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eWhat is Uncertainty?\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eUncertainty\u003c/em\u003e is the acknowledgement that we cannot measure things exactly, and so any conclusion based on measurements will always include a range of possible answers. When making a measurement, there is no single “true value” of the measurand (measured quantity) that we can determine. Instead, we can define an interval that defines the range of values that we think are \u003cem\u003eprobable\u003c/em\u003e for the measurand. The narrower the interval, the more precisely we can approximate the measurand.\u003c/p\u003e\n\u003cp\u003eWhen including uncertainty in a value, we report it as \u003cstrong\u003eA ± Δ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. We believe the value is \u003cstrong\u003eA\u003c/strong\u003e, but we’re unable to rule out the possibility that it’s higher or lower by an amount \u003cstrong\u003eΔ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. (Sometimes it’s written +Δ\u003csub\u003e1\u003c/sub\u003e / -Δ\u003csub\u003e2\u003c/sub\u003e if the higher and lower ranges are different.) For example, if we’re confident a time is between 2.42 and 2.48 s, it would be reported as 2.45 s ± 0.03 s.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eCommon sources of uncertainty include:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eyour judgement in reading analogue instruments\u003c/li\u003e\n\u003cli\u003ethe effects of environmental conditions on the measurement\u003c/li\u003e\n\u003cli\u003ethe sensitivity of your instruments (e.g. a digital scale, a meter stick)\u003c/li\u003e\n\u003cli\u003ethe rating or stated calibration of the instrument\u003c/li\u003e\n\u003cli\u003eapproximations and assumptions that you make while doing the experiment\u003c/li\u003e\n\u003cli\u003evariations in repeated readings made under apparently identical conditions (statistical uncertainty)\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003eA measurement uncertainty is not meant to be an indication of “mistakes” that you might make in an experiment. If you are aware that you have made a mistake, then you should repeat your experiment. \u003cstrong\u003e“Human error” is not a valid source of uncertainty.\u003c/strong\u003e If you know that you did something “wrong”, then the right course of action is to redo it correctly.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 3: Collect Data\u003c/h3\u003e\n\u003cp\u003eYou are now ready to perform your experiment and collect data.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ5\u003c/span\u003e: Collect your data and report it in a table with labeled columns, including units.\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ6\u003c/span\u003e: Determine the period at 5˚ and at 10˚.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eFind the statistical uncertainty for your individual data sets (the uncertainty associated with the spread of all of the measurements you made) using one of the two methods below.\u003c/strong\u003e\n\u003col style=\"list-style-type: upper-roman;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eOne method for calculating this uncertainty is to take half of the difference between the largest and smallest measurement you made.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eAnother method is to calculate the standard deviation of your measurements.\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eFind the total uncertainty by combining the uncertainties from all sources (those you estimated in question 4 as well as the statistical uncertainty) using the following equation: \u003cimg class=\"equation_image\" title=\"\\Delta T_{total} = \\sqrt{(\\Delta T_1)^2 + (\\Delta T_2)^2 + (\\Delta T_3)^2}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520T_%257Btotal%257D%2520%253D%2520%255Csqrt%257B(%255CDelta%2520T_1)%255E2%2520%252B%2520(%255CDelta%2520T_2)%255E2%2520%252B%2520(%255CDelta%2520T_3)%255E2%257D?scale=1\" alt=\"LaTeX: \\Delta T_{total} = \\sqrt{(\\Delta T_1)^2 + (\\Delta T_2)^2 + (\\Delta T_3)^2}\" data-equation-content=\"\\Delta T_{total} = \\sqrt{(\\Delta T_1)^2 + (\\Delta T_2)^2 + (\\Delta T_3)^2}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003el\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsqrt\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmn\u003e1\u003c/mn\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n    \u003cmo\u003e+\u003c/mo\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n    \u003cmo\u003e+\u003c/mo\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmn\u003e3\u003c/mn\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e, where \u003cimg class=\"equation_image\" title=\"\\Delta T_1\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520T_1?scale=1\" alt=\"LaTeX: \\Delta T_1\" data-equation-content=\"\\Delta T_1\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e, \u003cimg class=\"equation_image\" title=\"\\Delta T_2\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520T_2?scale=1\" alt=\"LaTeX: \\Delta T_2\" data-equation-content=\"\\Delta T_2\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e, and \u003cimg class=\"equation_image\" title=\"\\Delta T_3\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520T_3?scale=1\" alt=\"LaTeX: \\Delta T_3\" data-equation-content=\"\\Delta T_3\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmn\u003e3\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp;are the uncertainty values you estimated for each source.\u003c/strong\u003e\u0026nbsp;\u003cstrong\u003eThis is called \u003cem\u003eadding in quadrature\u003c/em\u003e and it’s the method you’ll use to combine sources of uncertainty throughout the course.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReport the period you found for each length and amplitude and report in the A ± Δ\u003csub\u003eA \u003c/sub\u003eformat\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ7\u003c/span\u003e: Create a data table of your group’s data with the length, period for each amplitude, and associated uncertainty. Include the data table here.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 4.1: Analyze the Data – Plotting\u003c/h3\u003e\n\u003cp\u003eNext, you’ll plot the data that your group has collected. Plotting data is a crucial part of analysis and it’s a skill that you’ll use in every lab. The box below gives guidelines to use whenever you are plotting data throughout this course.\u003c/p\u003e\n\u003cp\u003eNow plot the period as a function of pendulum length. Display the 5˚ measurements and the 10˚ measurements as two series on the same plot. Don’t add this plot to your report yet.\u003c/p\u003e\n\u003cp\u003eIn order to represent the uncertainty in the measurements graphically, we can include error bars on the plot.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u0026nbsp;\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤ \u0026nbsp;\u003c/span\u003e\u003c/strong\u003eThis is only possible in Excel or Graphical Analysis; Google Sheets does not have this capability. If you have been working in Sheets, you will need to copy the group’s data into Excel.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u0026nbsp;\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤ \u003c/span\u003e\u003c/strong\u003e\u003cspan class=\"symbol\"\u003e\u0026nbsp;For guidance on downloading and using Excel, refer to the\u003c/span\u003e\u0026nbsp;\u003ca title=\"Excel Skills Handout\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/excel-skills-handout-2\" data-course-type=\"wikiPages\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/excel-skills-handout-2\" data-api-returntype=\"Page\"\u003eExcel Skills Document\u003c/a\u003e throughout the term. If you have questions, you can also reach out to your TA for help.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 203.455px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 203.455px;\"\u003e\n\u003ctd style=\"width: 99.92%; padding-left: 40px; padding-right: 40px; height: 203.455px;\"\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eWhenever you create a plot,\u003c/u\u003e\u003c/strong\u003e\u003cu\u003e \u003cstrong\u003eyou should:\u003c/strong\u003e\u003c/u\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNot connect the data points with lines.\u003c/li\u003e\n\u003cli\u003eMake sure you create \u003cem\u003eScatter Plots\u003c/em\u003e and not \u003cem\u003eLine Plots\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003eEvaluate if the plot makes sense. Are the axes correct? Do you have the right number of data points?\u003c/li\u003e\n\u003cli\u003eInclude a descriptive title and labels on each axis, always including physical units.\u003c/li\u003e\n\u003cli\u003eAdd a legend, unless you only have one set of data and the title describes it.\u003c/li\u003e\n\u003cli\u003eDisplay the equation and R\u003csup\u003e2\u003c/sup\u003e value for any trendline you include\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"background-color: #ffffff;\"\u003e\u003cstrong\u003e\u003cu\u003e.\u003c/u\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cu\u003eError bars\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eError bars are a way to visually represent the range of values that the measurand (measured quantity) is likely to have. Recall from the “What is Uncertainty?” box above that there is not a “true” value of a measurand, all we can do is collect more information to improve our knowledge of the quantity. Error bars allow us to convey the information we have about the measurand more fully.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cu\u003eTo add error bars to a plot in Excel:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eClick the data set you want to add error bars to, and then under “Chart Design”, select “Add Chart Element” → “Error Bars” → “More Error Bar Options”\u003c/li\u003e\n\u003cli\u003eBoth horizontal and vertical error bars will be added. We usually just want vertical error bars, so select the horizontal error bars and delete them.\u003c/li\u003e\n\u003cli\u003eUnder “Format Error Bars” → “Error Amount” select “Custom”.\u003c/li\u003e\n\u003cli\u003eClick “Specify Value” and highlight the uncertainty values for both the positive and negative error bar values.\u003c/li\u003e\n\u003cli\u003eRepeat for each dataset that needs error bars\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ8\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eAttach the plot of the \u003c/strong\u003e\u003cstrong\u003e𝟓° and the \u003c/strong\u003e\u003cstrong\u003e𝟏𝟎° data with the error bars to your report.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ9\u003c/span\u003e: What do you notice about the two sets of data? Do they seem distinct? How can you tell? Your answer should reference the error bars.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eNote that if the error bars for two measurements overlap, you cannot rule out the possibility that the measurements are the same.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 4.2: Analyze the Data – Fitting\u003c/h3\u003e\n\u003cp\u003eFitting a function to a dataset is a key part of experimental work because it allows us to understand how the \u003cem\u003edependent\u003c/em\u003e variable relates to the \u003cem\u003eindependent\u003c/em\u003e variable. Most of the plots you’ll create will include a fit to your data. Fits are typically used to determine how well the data agrees with a particular (mathematical) model of the system’s behavior.\u003c/p\u003e\n\u003cp\u003eThe correlation coefficient, R\u003csup\u003e2\u003c/sup\u003e, is one measure of how well the model fits the data. Values close to 1 signify that the fit does a good job of predicting the data, whereas values closer to zero signify that the fit poorly predicts the data. While there are no hard cutoffs, below 0.7 is indicative of a poor fit, and above 0.9 or 0.95 is generally indicative of a good or very good fit.\u003c/p\u003e\n\u003cp\u003eWhile you can use visual inspection to make rough evaluations of each trendline, R\u003csup\u003e2\u003c/sup\u003e is often useful for distinguishing among equally good-looking fits. Note that the R\u003csup\u003e2\u003c/sup\u003e value is just one of many ways to evaluate the quality of a fit.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ10\u003c/span\u003e: Create a new plot with just the 5˚ data. Use Excel's Trendline feature to add a linear trendline to the plot. Be sure to include all of the elements of a complete plot listed in the box on the previous page.\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ11\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eDoes the linear trendline match the data well or not? Explain.\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 4.3: Analyze the Data – Comparing to a Model\u003c/h3\u003e\n\u003cp\u003eIn many experiments, the goal is to check a hypothesis, or model, that describes certain physical situations. In physics, models are often expressed as an equation that relates different physical quantities to each other. One model for the period of a simple pendulum states that\u003c/p\u003e\n\u003cp\u003ewhere 𝑔 is the acceleration due to gravity. In other words, we are predicting that 𝑇 ∝ (is proportional to) √𝐿. If we plotted T vs. L, we would expect a nonlinear curve.\u003c/p\u003e\n\u003cp\u003eIt is typically easier to tell if something is or is not a line (that is, see if two quantities are proportional to each other) than to evaluate if they have some other, more complicated relationship. If we have a prediction about the relationship between two quantities that is nonlinear, we can “force” a proportional relationship using a process called\u003cem\u003e linearization\u003c/em\u003e.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 203.455px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 203.455px;\"\u003e\n\u003ctd style=\"width: 99.92%; padding-left: 40px; padding-right: 40px; height: 203.455px;\"\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eLinearization\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIn the context of data analysis, “linear” refers to a directly proportional relationship between the dependent and independent variables in an equation.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMathematically, if two variables 𝑥 and 𝑦 have a linear relationship, we can express this as 𝑦 = 𝑚𝑥 + 𝑏 where m and b are constants\u003c/li\u003e\n\u003cli\u003eMore simply, we can write this as 𝑦 ∝ 𝑥 where ∝ means “is proportional to”.\u003c/li\u003e\n\u003cli\u003eWhen graphed, data with a linear relationship falls on a straight line.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLinearization comes in handy when your data or hypothesis is not linear.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWhen you fit data with a linear trendline, you are essentially checking whether the two variables are proportional to each other. To check a nonlinear hypothesis, can we instead check if one variable is proportional to a function of the other variable.\u003c/p\u003e\n\u003cp\u003eIn practice, linearization is done by calculating a new column of data, that gives the values of a function of the input variable. Typically, the input variable is the independent variable, and the function is chosen so that the resulting quantity is proportional to the dependent variable.\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003eWhy Linearize?\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLinear data is typically easier to understand and analyze.\u003c/li\u003e\n\u003cli\u003eThere are analysis methods we can apply to linear data that don’t work as well (or at all) with nonlinear data.\u003c/li\u003e\n\u003cli\u003eIt is relatively easy to fit a line to data - there are just two important values to determine: the slope and intercept of the data.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; font-size: 18pt;\"\u003e.\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ12\u003c/span\u003e: The given model predicts that T is proportional to √𝑳 . Create a linearized plot to test this relationship using the 5˚ data and an appropriate fit. Insert the plot into your report, with all the required elements.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eIf you need help with this process, ask your TA! Linearizing is an important technique we’ll use throughout the course.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 5: Draw Conclusions\u003c/h3\u003e\n\u003cp\u003eWe can now compare the linearized fit to the best fit line that you first determined.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ13\u003c/span\u003e: Analyze the y-intercepts.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003eBased on your understanding of pendulums (not an equation), predict what the period approaches as the pendulum length gets very small (L → 0). What does that imply what the y-intercept should be? Explain your physical reasoning.\u003c/strong\u003e\n\u003cul style=\"list-style-type: circle;\"\u003e\n\u003cli\u003e\u003cstrong\u003eBe careful: “doesn’t oscillate” and “period = 0” are different ideas. Period is the time per cycle, so focus on what happens to that time as the pendulum gets shorter and shorter.\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWhat are the y-intercepts from the fits to your two plots of 5˚ data (general best fit and linearized)? Which more closely matches your physical expectations? Is the difference between the two significant?\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ14\u003c/span\u003e: Compare the linearized fit to the best fit you chose for the non-linearized data in question 11. Which one has a higher R\u003csup\u003e2\u003c/sup\u003e value? Is the difference between the two significant?\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ15\u003c/span\u003e: Considering both the R\u003csup\u003e2\u003c/sup\u003e value and the y-intercepts, which fit seems to best represent the data, and why? What mathematical relationship does this indicate between T and L?\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ15\u003c/span\u003e: Each lab member should write an individual concise paragraph reflecting on the lab. Identify each contribution by name. Each should specifically address the following:\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: square;\"\u003e\n\u003cli\u003e\u003cstrong\u003eOne new thing you've learned about analyzing data.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAny unanswered questions you still have.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYour comfort working with Excel as we continue in the course.\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 6: Capstone Component – Abstract\u003c/h3\u003e\n\u003cp\u003eIn scientific communication, an abstract is a brief but comprehensive summary of a research project or experiment. It communicates the purpose, methods, key findings, and conclusions of a study so readers can understand the work without reading the full report.\u003c/p\u003e\n\u003cp\u003eIn this activity, you will write an abstract based on your group’s investigation of the small-angle approximation for a simple pendulum. Writing an abstract will help you practice communicating scientific results clearly and concisely — a skill that will be important for your final capstone lab report and for future scientific writing.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ17\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eWrite an abstract for this lab experiment using your data from 5° and 10°. Refer to the abstract structure below as guidance.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cspan style=\"font-family: 'times new roman', times;\"\u003eIII. \u003c/span\u003e\u003c/span\u003e\u003cu\u003eAbstract Structure:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\n\u003col style=\"background: whitesmoke; border-left: 6px solid #d73f09; padding: 15px; margin: 20px 0 25px 0;\"\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003eBackground/Context (1–2 sentences) \u003cem\u003eWhat is the general topic of the lab? Why does it matter?\u003c/em\u003e\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eWhat is the small-angle approximation for a pendulum? Why is it useful to know when a model is valid (or not)?\u003c/li\u003e\n\u003cli\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ePurpose of the Lab (1 sentence) \u003cem\u003eWhat was the goal of this specific experiment?\u003c/em\u003e\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u0026nbsp;\u003c/em\u003e\u003c/span\u003eWhat aspect of the small-angle approximation were you investigating? What does the model predict about how period depends on angle?\u003c/li\u003e\n\u003cli\u003e\u003cem\u003e\u003c/em\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eBrief Methods Overview (1–2 sentences) \u003cem\u003eWhat did you do, in general terms? (No procedural detail—just the main activities.)\u003c/em\u003e\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;What angles did you test? How did you measure the period and estimate uncertainty?\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eKey Results (1–2 sentences) \u003cem\u003eWhat did you find? Focus on overall trends or conclusions.\u003c/em\u003e\u003cbr\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;How did the measured periods at 5° and 10° compare? Were any differences larger than the total uncertainty? Did the data suggest the period changed with amplitude?\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eConclusion/Implications (1 sentence) \u003cem\u003eWhat are the takeaways of the results of the experiment?\u003c/em\u003e\u0026nbsp;\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e \u0026nbsp;\u003c/span\u003eDo your results support the small-angle approximation? Why is uncertainty important in making that judgment?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 7: Submit Your Group’s Lab Report\u003c/h3\u003e\n\u003cp\u003eMake sure everyone’s name is on your group’s lab report. If you submit through Gradescope, remember to add everyone in your group to the assignment. This is done at the end of the submission process.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca class=\"inline_disabled external\" href=\"https://help.gradescope.com/article/m5qz2xsnjy-student-add-group-members\" target=\"_blank\"\u003e\u003cspan\u003eHow to add group members to your submission in Gradescope is outlined here\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003eAppendix – Reference Information\u003c/h3\u003e\n\u003cp\u003eThis section contains key information from previous labs:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eWhat is Uncertainty?\u003c/li\u003e\n\u003cli\u003eSources of Uncertainty\u003c/li\u003e\n\u003cli\u003eVariables and Parameters\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eWhat is Uncertainty?\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eUncertainty\u003c/em\u003e is the acknowledgement that we cannot measure things exactly, and so any conclusion based on measurements will always include a range of possible answers. When making a measurement, there is no single “true value” of the measurand (measured quantity) that we can determine. Instead, we can define an interval that defines the range of values that we think are probable for the measurand. The narrower the interval, the more precisely we can approximate the measurand.\u003c/p\u003e\n\u003cp\u003eWhen including uncertainty in a value, we report it as \u003cstrong\u003eA ± Δ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. We believe the value is \u003cstrong\u003eA\u003c/strong\u003e, but we’re unable to rule out the possibility that it’s higher or lower by an amount \u003cstrong\u003eΔ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. (Sometimes it’s written +Δ\u003csub\u003e1\u003c/sub\u003e / -Δ\u003csub\u003e2\u003c/sub\u003e if the higher and lower ranges are different.) For example, a time might be reported as 2.45 s ± 0.03 s.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eSources of Uncertainty:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThe uncertainty in a measurement can be due to a combination of several factors. A crucial aspect of experimentation is to identify all such sources of uncertainty and to numerically estimate their effect on your measurement result.\u003c/p\u003e\n\u003cp\u003eCommon sources of uncertainty include:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ethe effects of environmental conditions on the measurement\u003c/li\u003e\n\u003cli\u003eyour judgement in reading analogue instruments\u003c/li\u003e\n\u003cli\u003ethe sensitivity of your instruments (e.g. the digital scale)\u003c/li\u003e\n\u003cli\u003ethe rating or stated calibration of the instrument\u003c/li\u003e\n\u003cli\u003eapproximations and assumptions that you make while doing the experiment\u003c/li\u003e\n\u003cli\u003evariations in repeated readings made under apparently identical conditions\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eVariables and Parameters\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIt will help you when designing your experiment to think about the different types of numerical quantities that are involved. It will make your explanation clearer if you label the different quantities appropriately.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eIndependent variable\u003c/em\u003e: In an experiment you will usually vary one quantity at a time in a controlled manner. This is the independent variable. Typically, you’re trying to discover how the independent variable affects the system.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eDependent variables\u003c/em\u003e: Your hypothesis should predict the behavior of other quantities in your system as the independent variable is changed. These other quantities are referred to as the dependent variables because their values depend on the value of the independent variable.\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eParameters\u003c/em\u003e: There are other quantities you should specify because they may influence your results, but that will remain fixed throughout the experiment. These are referred to as parameters. Examples could be the length of a track or the mass of an object. The key is that a parameter doesn’t change at any time in the experiment.\u003c/p\u003e\n\u003cp\u003eIn short, parameters are fixed, and variables change. The change is either under your control (independent) or a response to the experiment (dependent).\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e"},"WIKI_PAGE_REVISION":"2","WIKI_PAGE_SHOW_PATH":"/courses/2053526/pages/lab-4-data-analysis","WIKI_PAGE_EDIT_PATH":"/courses/2053526/pages/lab-4-data-analysis/edit","WIKI_PAGE_HISTORY_PATH":"/courses/2053526/pages/lab-4-data-analysis/revisions","COURSE_ID":"2053526","MODULES_PATH":"/courses/2053526/modules","wiki_page_menu_tools":[],"wiki_index_menu_tools":[],"DISPLAY_SHOW_ALL_LINK":false,"CAN_SET
