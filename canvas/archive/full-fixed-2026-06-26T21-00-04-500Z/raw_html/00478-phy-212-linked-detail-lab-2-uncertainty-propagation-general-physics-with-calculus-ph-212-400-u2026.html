nt-size: 14pt;\"\u003ePH212 – General Physics with Calculus\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eExperimental goal: To estimate a conservative safety-line distance a typical beachgoer can realistically reach before a surge wave arrives.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIn this lab, students will measure their own walking speeds, estimate wave periods from coastal video footage, and model human reaction time as a fraction of the wave period. These values will be combined to determine how much time a person has to move before a surge crest arrives, and how far they could realistically travel in that time. Students will propagate uncertainty at each step and use uncertainty intervals — rather than single values — to inform the placement of a conservative “beach safety line.” Through this process, students will explore how uncertainty influences confidence in conclusions and why safety decisions must account for variation in both physical systems and human behavior.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 191px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 191px;\"\u003e\n\u003ctd style=\"width: 99.92%; height: 191px;\"\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cstrong\u003e\u003cu\u003eAs you work through the lab:\u003c/u\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003eQ#\u003c/span\u003e: Bold, numbered items reference things that need to be included in your lab report questions to answer, data, plots, or drawings\u003cbr\u003e\u003c/strong\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■ \u003c/span\u003eItems with a square bullet are action items you’ll need to do to progress through the lab.\u003cbr\u003e\u003cspan class=\"symbol\"\u003e➤ \u003c/span\u003eItems with an arrow are hints, tips, or things to keep in mind when completing tasks.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px; text-align: center;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00;\"\u003eBoxed information is about either the expectations for your lab reports or key concepts for the course.\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003e\u003cbr\u003eLearning Objectives\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eLearning goal: Explore how uncertainty propagates through multi-step calculations and how uncertainty ranges influence safety decisions in real-world contexts such as evacuation planning.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis lab activity is designed to help students practice the following skills:\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003ePropagate uncertainty through derived quantities.\u003c/li\u003e\n\u003cli\u003eDistinguish between measurement uncertainty and real variation.\u003c/li\u003e\n\u003cli\u003eUse uncertainty to justify a conservative safety-line recommendation.\u003c/li\u003e\n\u003cli\u003eCommunicate results in a scientific Results section.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eRelated Documents\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e- Lab collaboration contract\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eEquipment\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eStopwatch\u003c/li\u003e\n\u003cli\u003eTape measure, pedometer, or Google Maps\u003c/li\u003e\n\u003cli\u003eRefer to Lab materials page on canvas for future \u003ca title=\"Lab Supplies\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/lab-supplies\" data-course-type=\"wikiPages\" data-published=\"false\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/lab-supplies\" data-api-returntype=\"Page\"\u003elab supplies needed\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 0: Finalizing the Lab Collaboration Contract\u003c/h2\u003e\n\u003cp\u003eUsing the class-generated values from last week, we have created a \u003ca title=\"Lab Collaboration Contract\" href=\"https://canvas.oregonstate.edu/courses/2053526/quizzes/3160479\" data-course-type=\"quizzes\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/quizzes/3160479\" data-api-returntype=\"Quiz\"\u003eLab Collaboration Contract\u003c/a\u003e. This document outlines shared expectations for how to be a respectful and reliable lab partner. It includes norms around communication, teamwork, accountability, and what to do if challenges arise — such as a group member not responding or being unable to participate during a given week. This agreement is meant to help you and your team build trust and work effectively together, even in an online setting.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ1\u003c/span\u003e: Read and sign the \u003ca title=\"Lab Collaboration Contract\" href=\"https://canvas.oregonstate.edu/courses/2053526/quizzes/3160479\" data-course-type=\"quizzes\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/quizzes/3160479\" data-api-returntype=\"Quiz\"\u003eLab Collaboration Contract\u003c/a\u003e. Verify you have read the contract by responding to this question with either statement (include each person’s statement in the lab report.):\u003c/span\u003e\u003c/strong\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan style=\"background-color: #fc9fb7;\"\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem; background-color: #fc9fb7;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■\u003c/span\u003e\u0026nbsp; I, [Insert Name], understand and agree to the terms of the contract.\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan style=\"background-color: #fc9fb7;\"\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem; background-color: #fc9fb7;\"\u003e\u003cspan style=\"background-color: #fc9fb7;\"\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem; background-color: #fc9fb7;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■\u003c/span\u003e\u0026nbsp; I have questions about the contract that I would like to discuss with the TA.\u003c/strong\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 1: Introduction\u003c/h2\u003e\n\u003cp\u003e\u003cimg data-ally-user-updated-alt=\"A wide view of Tourmaline Beach in San Diego County on a clear day, with sandy shoreline and scattered seaweed in the foreground, gentle waves breaking across the shallow water, and a line of surfers sitting on their boards farther out in the ocean under a bright blue sky with light clouds.\" src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706008/preview?\" alt=\"A wide view of Tourmaline Beach in San Diego County on a clear day, with sandy shoreline and scattered seaweed in the foreground, gentle waves breaking across the shallow water, and a line of surfers sitting on their boards farther out in the ocean under a bright blue sky with light clouds.\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706008\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 99.9807%; border-color: #FFFFFF; border-style: solid;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 48.1348%;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118706057/preview?\" alt=\"Diagram showing a beach safety-line scenario. At the top, a person stands near the shoreline at normal water level next to a beach ball, with a vertical red line labeled ‘Safety Line.’ Below, the surge water level is higher and waves extend farther up the beach. The same person has moved inland to the right, saying ‘I’m safe!’ The horizontal distance from the safety line to the person is labeled \nd_max, with the equation d_max=v_walk​ T_wave, indicating the maximum distance a person can walk before the surge arrives.\" width=\"593\" height=\"465\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118706057\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 51.892%;\"\u003e\n\u003cp\u003eYou’re on a beach when lifeguards notice an unusually strong surge of water (a “bore”–like wave) moving toward shore. To help protect beachgoers, they mark a \u003cstrong data-start=\"340\" data-end=\"355\"\u003esafety line\u003c/strong\u003e along the beach. In this lab, the safety line represents the \u003cstrong data-start=\"417\" data-end=\"464\"\u003emaximum distance seaward (toward the water)\u003c/strong\u003e that a person can safely be and still have enough time to walk inland before the surge crest arrives. Anyone starting landward of this line has a reasonable time buffer to reach higher ground, while anyone farther seaward may not. Under the simplifying assumption that the waves are approximately periodic and move at a consistent speed, the safety line acts as a “play zone boundary” — a limit on how close to the water a typical beachgoer can be while still being able to reach safety in time.\u003c/p\u003e\n\u003cp\u003eAs a consultant, your job is to decide whether an average beachgoer like you can consistently reach the safety line before the surge arrives. Because real measurements aren’t perfect, you must include uncertainty in your calculations and in your conclusion — just like scientists and emergency planners do when designing tsunami evacuation zones.\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eIn this activity, you will estimate how far seaward a typical beachgoer can safely be and still have enough time to walk inland before a surge crest arrives. You will work with measured quantities that include uncertainty to determine a conservative location for the safety line — the maximum distance toward the water from which a person can reliably reach safety in time. First, you will measure your own walking (or light-jogging) speed using repeated distance-and-time measurements and use those results to determine an average “evacuation speed” and its uncertainty. Next, you will estimate the wave period from video, model reaction time as a fraction of that period, and propagate uncertainty to determine how much time a person actually has to move before the surge arrives. You will then combine available walking time with evacuation speed to estimate the maximum safe starting distance, including uncertainty ranges rather than a single value. Finally, you will use these uncertainty intervals to recommend a conservative safety-line position, similar to how tsunami evacuation planners choose boundaries that account for variation in both physical conditions and human behavior.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 2: Gathering Data\u003c/h2\u003e\n\u003cp\u003eTo evaluate whether a beachgoer can reach the safety line in time, you first need an estimate of a realistic evacuation walking (or light-jogging) speed. In this part, you will measure your own speed over a measured distance using multiple trials, so that you can calculate both an average speed and the uncertainty in that value.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ2\u003c/span\u003e: Estimate your individual evacuation walking speed (with uncertainty). Choose one straight path that you can walk at a steady pace. Measure or estimate the distance of this path (using a measuring tape, GPS/pedometer app, or map tool). You will walk this same distance for all trials. Include each group member’s response and table in your report.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eClearly describe the distance you used and how you measured or estimated it. Record the distance and its uncertainty on your table.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eWalk the distance at a pace that you think a typical beachgoer could maintain during an evacuation. Use a stopwatch or timing app to record the time for at least 5 trials of the same motion.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eCompute your average distance, \u003cimg class=\"equation_image\" title=\"\\bar{d}\" src=\"https://canvas.oregonstate.edu/equation_images/%255Cbar%257Bd%257D?scale=1\" alt=\"LaTeX: \\bar{d}\" data-equation-content=\"\\bar{d}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmover\u003e\n      \u003cmi\u003ed\u003c/mi\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n    \u003c/mover\u003e\n  \u003c/mrow\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e, and its uncertainty, \u003cimg class=\"equation_image\" title=\"\\Delta d\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520d?scale=1\" alt=\"LaTeX: \\Delta d\" data-equation-content=\"\\Delta d\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e. Compute your average time, \u003cimg class=\"equation_image\" title=\"\\bar{t}\" src=\"https://canvas.oregonstate.edu/equation_images/%255Cbar%257Bt%257D?scale=1\" alt=\"LaTeX: \\bar{t}\" data-equation-content=\"\\bar{t}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmover\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n    \u003c/mover\u003e\n  \u003c/mrow\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e, and its uncertainty, \u003cimg class=\"equation_image\" title=\"\\Delta t\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520t?scale=1\" alt=\"LaTeX: \\Delta t\" data-equation-content=\"\\Delta t\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003et\u003c/mi\u003e\n\u003c/math\u003e\"\u003e.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;In this lab, your walking speed is calculated using v = d/t, but both the \u003cstrong\u003edistance\u003c/strong\u003e \u0026nbsp;and the \u003cstrong\u003etime\u003c/strong\u003e \u0026nbsp;have uncertainty. That means your final value for \u0026nbsp;is not exact and it depends on how much each of those measurements could have been off. Instead of using absolute uncertainties, we look at the \u003cem\u003efractional\u003c/em\u003e (or percentage) ones: \u003cimg class=\"equation_image\" title=\"\\Delta d/d\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520d%252Fd?scale=1\" alt=\"LaTeX: \\Delta d/d\" data-equation-content=\"\\Delta d/d\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmo\u003e/\u003c/mo\u003e\n  \u003c/mrow\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n\u003c/math\u003e\"\u003e and \u003cimg class=\"equation_image\" title=\"\\Delta t/t\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520t%252Ft?scale=1\" alt=\"LaTeX: \\Delta t/t\" data-equation-content=\"\\Delta t/t\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003et\u003c/mi\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmo\u003e/\u003c/mo\u003e\n  \u003c/mrow\u003e\n  \u003cmi\u003et\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDistance uncertainty and time uncertainty affect the speed \u003cstrong\u003eindependently\u003c/strong\u003e. We can combine them like perpendicular components or add them in quadrature.\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg class=\"equation_image\" title=\"(\\frac{\\Delta v}{v_{avg}})^2 = (\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2\" src=\"https://canvas.oregonstate.edu/equation_images/(%255Cfrac%257B%255CDelta%2520v%257D%257Bv_%257Bavg%257D%257D)%255E2%2520%253D%2520(%255Cfrac%257B%255CDelta%2520d%257D%257B%255Cbar%257Bd%257D%257D)%255E2%2520%252B%2520(%255Cfrac%257B%255CDelta%2520t%257D%257B%255Cbar%257Bt%257D%257D)%255E2?scale=1.5\" alt=\"LaTeX: (\\frac{\\Delta v}{v_{avg}})^2 = (\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2\" data-equation-content=\"(\\frac{\\Delta v}{v_{avg}})^2 = (\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmrow\u003e\n      \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n        \u003cmi\u003ea\u003c/mi\u003e\n        \u003cmi\u003ev\u003c/mi\u003e\n        \u003cmi\u003eg\u003c/mi\u003e\n      \u003c/mrow\u003e\n    \u003c/msub\u003e\n  \u003c/mfrac\u003e\n  \u003cmsup\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msup\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmrow\u003e\n      \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n      \u003cmi\u003ed\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmover\u003e\n        \u003cmi\u003ed\u003c/mi\u003e\n        \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n      \u003c/mover\u003e\n    \u003c/mrow\u003e\n  \u003c/mfrac\u003e\n  \u003cmsup\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msup\u003e\n  \u003cmo\u003e+\u003c/mo\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmrow\u003e\n      \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmover\u003e\n        \u003cmi\u003et\u003c/mi\u003e\n        \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n      \u003c/mover\u003e\n    \u003c/mrow\u003e\n  \u003c/mfrac\u003e\n  \u003cmsup\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msup\u003e\n\u003c/math\u003e\"\u003e\u003c/p\u003e\n\u003cp\u003eThen we multiply by v to get the absolute uncertainty:\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cimg class=\"equation_image\" title=\"\\Delta v = v_{avg} \\sqrt{(\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520v%2520%253D%2520v_%257Bavg%257D%2520%255Csqrt%257B(%255Cfrac%257B%255CDelta%2520d%257D%257B%255Cbar%257Bd%257D%257D)%255E2%2520%252B%2520(%255Cfrac%257B%255CDelta%2520t%257D%257B%255Cbar%257Bt%257D%257D)%255E2%257D?scale=1.5\" alt=\"LaTeX: \\Delta v = v_{avg} \\sqrt{(\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2}\" data-equation-content=\"\\Delta v = v_{avg} \\sqrt{(\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ev\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmsqrt\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmfrac\u003e\n      \u003cmrow\u003e\n        \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n        \u003cmi\u003ed\u003c/mi\u003e\n      \u003c/mrow\u003e\n      \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n        \u003cmover\u003e\n          \u003cmi\u003ed\u003c/mi\u003e\n          \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n        \u003c/mover\u003e\n      \u003c/mrow\u003e\n    \u003c/mfrac\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n    \u003cmo\u003e+\u003c/mo\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmfrac\u003e\n      \u003cmrow\u003e\n        \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n        \u003cmi\u003et\u003c/mi\u003e\n      \u003c/mrow\u003e\n      \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n        \u003cmover\u003e\n          \u003cmi\u003et\u003c/mi\u003e\n          \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n        \u003c/mover\u003e\n      \u003c/mrow\u003e\n    \u003c/mfrac\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eThis tells us how much the distance-uncertainty contribution and the time-uncertainty contribution combine to affect the final speed.\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ3\u003c/span\u003e: Calculate your walking speed \u003cimg class=\"equation_image\" title=\"v=\\bar{d} / \\bar{t}\" src=\"https://canvas.oregonstate.edu/equation_images/v%253D%255Cbar%257Bd%257D%2520%252F%2520%255Cbar%257Bt%257D?scale=1\" alt=\"LaTeX: v=\\bar{d} / \\bar{t}\" data-equation-content=\"v=\\bar{d} / \\bar{t}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ev\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmover\u003e\n      \u003cmi\u003ed\u003c/mi\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n    \u003c/mover\u003e\n  \u003c/mrow\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmo\u003e/\u003c/mo\u003e\n  \u003c/mrow\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmover\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n    \u003c/mover\u003e\n  \u003c/mrow\u003e\n\u003c/math\u003e\"\u003e and propagate uncertainty to find the uncertainty in your speed: \u003cimg class=\"equation_image\" title=\"\\Delta v = v_{avg} \\sqrt{(\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520v%2520%253D%2520v_%257Bavg%257D%2520%255Csqrt%257B(%255Cfrac%257B%255CDelta%2520d%257D%257B%255Cbar%257Bd%257D%257D)%255E2%2520%252B%2520(%255Cfrac%257B%255CDelta%2520t%257D%257B%255Cbar%257Bt%257D%257D)%255E2%257D?scale=1\" alt=\"LaTeX: \\Delta v = v_{avg} \\sqrt{(\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2}\" data-equation-content=\"\\Delta v = v_{avg} \\sqrt{(\\frac{\\Delta d}{\\bar{d}})^2 + (\\frac{\\Delta t}{\\bar{t}})^2}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ev\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmsqrt\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmfrac\u003e\n      \u003cmrow\u003e\n        \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n        \u003cmi\u003ed\u003c/mi\u003e\n      \u003c/mrow\u003e\n      \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n        \u003cmover\u003e\n          \u003cmi\u003ed\u003c/mi\u003e\n          \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n        \u003c/mover\u003e\n      \u003c/mrow\u003e\n    \u003c/mfrac\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n    \u003cmo\u003e+\u003c/mo\u003e\n    \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmfrac\u003e\n      \u003cmrow\u003e\n        \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n        \u003cmi\u003et\u003c/mi\u003e\n      \u003c/mrow\u003e\n      \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n        \u003cmover\u003e\n          \u003cmi\u003et\u003c/mi\u003e\n          \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n        \u003c/mover\u003e\n      \u003c/mrow\u003e\n    \u003c/mfrac\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e. Report each group members values in the report in the form \u003cimg class=\"equation_image\" title=\"v = v_{avg} \\pm \\Delta v\" src=\"https://canvas.oregonstate.edu/equation_images/v%2520%253D%2520v_%257Bavg%257D%2520%255Cpm%2520%255CDelta%2520v?scale=1\" alt=\"LaTeX: v = v_{avg} \\pm \\Delta v\" data-equation-content=\"v = v_{avg} \\pm \\Delta v\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ev\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e\u0026amp;#x00B1;\u003c!-- ± --\u003e\u003c/mo\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ev\u003c/mi\u003e\n\u003c/math\u003e\"\u003e.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ4\u003c/span\u003e: Briefly explain which contributed more to your speed uncertainty — distance or time — and how can you tell?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEstimating Wave Period from Video\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTo help predict when a larger surge or wave might arrive at the shore, we first need to estimate the wave period — the average time between repeating waves. In this activity, you will use a beach video to measure the time between successive wave crests as they pass the same fixed point on the screen. If there is no obvious object to use as a marker, you can create one by holding your mouse cursor, your finger, or a small sticky note at a specific point on the wave line and keeping it there throughout the measurement.\u003c/p\u003e\n\u003cp\u003eYou will start your timer when a wave crest reaches your chosen marker point, then record the time each time the next crest reaches that same point again. After timing several waves, you will divide the total elapsed time by the number of wave intervals to find the average wave period and use the variation in your timings to estimate the uncertainty.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ5\u003c/span\u003e: Using the \u003ca href=\"https://youtu.be/9UnmxIbYMTA?si=lRSzlxNjQNDeSyk3\"\u003ebeach video\u003c/a\u003e, choose a fixed reference point on the screen (such as your mouse cursor, your finger, or the edge of a sticky note) and keep it in the same place for the entire measurement. Start your timer when a wave crest reaches that point, and record the time each time the next crest reaches the same point again. Each timing between two consecutive crests counts as one wave interval.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003eRecord wave-interval times at four different points in the video (representing different times of day / camera views). Organize your measurements in a data table and include each group member’s table in your report. Compute the average wave period \u003cimg class=\"equation_image\" title=\"\\bar{T}\" src=\"https://canvas.oregonstate.edu/equation_images/%255Cbar%257BT%257D?scale=1\" alt=\"LaTeX: \\bar{T}\" data-equation-content=\"\\bar{T}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmover\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n    \u003c/mover\u003e\n  \u003c/mrow\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e\u0026nbsp;by dividing the total elapsed time by the number of intervals: \u003cimg class=\"equation_image\" title=\"\\bar{T}\" src=\"https://canvas.oregonstate.edu/equation_images/%255Cbar%257BT%257D?scale=1\" alt=\"LaTeX: \\bar{T}\" data-equation-content=\"\\bar{T}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmover\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n    \u003c/mover\u003e\n  \u003c/mrow\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e\u0026nbsp;= (total time) / (# wave intervals). You have enough time per camera view to record at least 2 wave intervals.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eEstimate the uncertainty in the wave period using the spread in your measured intervals (use half-range or standard deviation, depending on course convention), and report your result in the form: \u003cimg class=\"equation_image\" title=\"T = \\bar{T} \\pm \\Delta T\" src=\"https://canvas.oregonstate.edu/equation_images/T%2520%253D%2520%255Cbar%257BT%257D%2520%255Cpm%2520%255CDelta%2520T?scale=1\" alt=\"LaTeX: T = \\bar{T} \\pm \\Delta T\" data-equation-content=\"T = \\bar{T} \\pm \\Delta T\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003eT\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n    \u003cmover\u003e\n      \u003cmi\u003eT\u003c/mi\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e\u0026amp;#x00AF;\u003c!-- ¯ --\u003e\u003c/mo\u003e\n    \u003c/mover\u003e\n  \u003c/mrow\u003e\n  \u003cmo\u003e\u0026amp;#x00B1;\u003c!-- ± --\u003e\u003c/mo\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003eT\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e. Report each group member’s wave period and uncertainty in the report.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eExplain whether your uncertainty mainly comes from timing reaction error or from variability in the waves themselves. How can you tell?\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤\u0026nbsp; \u003c/span\u003e\u003c/strong\u003eWhen comparing sources of uncertainty, look at the \u003cem data-start=\"271\" data-end=\"279\"\u003espread\u003c/em\u003e of the individual wave-interval measurements. If the intervals are fairly consistent but your timing varies when you start/stop the stopwatch, the uncertainty is likely due to \u003cstrong data-start=\"456\" data-end=\"475\"\u003ereaction timing\u003c/strong\u003e. If the intervals themselves differ noticeably from wave to wave (even with careful timing), the uncertainty is more likely due to \u003cstrong data-start=\"607\" data-end=\"640\"\u003ereal variability in the waves\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 3: Combining Data\u003c/h3\u003e\n\u003cp\u003eIn this part of the activity, your group will combine your individual results to estimate the walking speed of a “typical beachgoer” and the average wave period at this beach. You will then use these values — along with a realistic reaction-time assumption — to decide where a safety line should be placed so that people have enough time to react and move before the surge arrives. Your goal is not just to produce a number, but to design a safety line that remains reasonable \u003cstrong\u003eeven when uncertainties and delays are taken into account\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ6\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eEstimate your group evacuation walking speed, \u003cimg class=\"equation_image\" title=\"v_{group}\" src=\"https://canvas.oregonstate.edu/equation_images/v_%257Bgroup%257D?scale=1\" alt=\"LaTeX: v_{group}\" data-equation-content=\"v_{group}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eUsing your response in Q3, compute the group average walking speed: \u003cimg class=\"equation_image\" title=\"v_{group} = mean(v_1,v_2,...)\" src=\"https://canvas.oregonstate.edu/equation_images/v_%257Bgroup%257D%2520%253D%2520mean(v_1%252Cv_2%252C...)?scale=1\" alt=\"LaTeX: v_{group} = mean(v_1,v_2,...)\" data-equation-content=\"v_{group} = mean(v_1,v_2,...)\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmi\u003ee\u003c/mi\u003e\n  \u003cmi\u003ea\u003c/mi\u003e\n  \u003cmi\u003en\u003c/mi\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e,\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e,\u003c/mo\u003e\n  \u003cmo\u003e.\u003c/mo\u003e\n  \u003cmo\u003e.\u003c/mo\u003e\n  \u003cmo\u003e.\u003c/mo\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n\u003c/math\u003e\"\u003e.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eCompute the spread of speeds across the group (use half-range or standard deviation of the velocities) and treat this as the group uncertainty.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReport your result as \u003cimg class=\"equation_image\" title=\"v_{group}=v_{avg} \\pm \\Delta v_{group}\" src=\"https://canvas.oregonstate.edu/equation_images/v_%257Bgroup%257D%253Dv_%257Bavg%257D%2520%255Cpm%2520%255CDelta%2520v_%257Bgroup%257D?scale=1\" alt=\"LaTeX: v_{group}=v_{avg} \\pm \\Delta v_{group}\" data-equation-content=\"v_{group}=v_{avg} \\pm \\Delta v_{group}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e\u0026amp;#x00B1;\u003c!-- ± --\u003e\u003c/mo\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e. Briefly explain what your group uncertainty represents. Does it mostly reflect real differences in how fast people in your group walk, or measurement uncertainty within each person’s data collection? Use evidence to support your answer.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp class=\"p2\" style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤\u0026nbsp; \u003c/span\u003e\u003c/strong\u003eCompare how large the spread between group members’ speeds is vs. how large each person’s individual uncertainty was (\u003cimg class=\"equation_image\" title=\"\\Delta v_i\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520v_i?scale=1\" alt=\"LaTeX: \\Delta v_i\" data-equation-content=\"\\Delta v_i\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmi\u003ei\u003c/mi\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e) and describe which contribution appears larger and why.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ7\u003c/span\u003e: Combine your group’s wave period measurements in the same way as the evacuation walking speed.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eUsing your response in Q5, compute the group average walking speed: \u003cimg class=\"equation_image\" title=\"T_{group} = mean(T_1,T_2,...)\" src=\"https://canvas.oregonstate.edu/equation_images/T_%257Bgroup%257D%2520%253D%2520mean(T_1%252CT_2%252C...)?scale=1\" alt=\"LaTeX: T_{group} = mean(T_1,T_2,...)\" data-equation-content=\"T_{group} = mean(T_1,T_2,...)\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmi\u003em\u003c/mi\u003e\n  \u003cmi\u003ee\u003c/mi\u003e\n  \u003cmi\u003ea\u003c/mi\u003e\n  \u003cmi\u003en\u003c/mi\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmn\u003e1\u003c/mn\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e,\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e,\u003c/mo\u003e\n  \u003cmo\u003e.\u003c/mo\u003e\n  \u003cmo\u003e.\u003c/mo\u003e\n  \u003cmo\u003e.\u003c/mo\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n\u003c/math\u003e\"\u003e.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eEstimate the spread of wave periods across the group to determine the group uncertainty (use half-range or standard deviation of the velocities.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReport your result as \u003cimg class=\"equation_image\" title=\"T_{group}=T_{avg} \\pm \\Delta T_{group}\" src=\"https://canvas.oregonstate.edu/equation_images/T_%257Bgroup%257D%253DT_%257Bavg%257D%2520%255Cpm%2520%255CDelta%2520T_%257Bgroup%257D?scale=1\" alt=\"LaTeX: T_{group}=T_{avg} \\pm \\Delta T_{group}\" data-equation-content=\"T_{group}=T_{avg} \\pm \\Delta T_{group}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e\u0026amp;#x00B1;\u003c!-- ± --\u003e\u003c/mo\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e. Briefly explain what your group uncertainty represents. Does it mostly reflect differences in timing reaction and viewing choices or real variability in the waves? Use evidence to support your answer.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIn real emergency situations, people do not begin moving the instant they notice a surge or unusual wave behavior. They need time to recognize what is happening, decide to react, and start walking. For this lab, your group will decide what fraction of a wave period is a reasonable estimate for this reaction delay.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ8\u003c/span\u003e: Decide as a group what fraction of the wave period to represent reaction time (for example, one-third of a period, one-half of a period, etc.). Think about how a wave develops from a small disturbance into a clear crest or highest visible region. At what point in the wave cycle do you think a typical beachgoer would realistically recognize that the incoming wave is unusual or dangerous? \u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eChoose a fraction of the wave period, \u003cimg class=\"equation_image\" title=\"f\" src=\"https://canvas.oregonstate.edu/equation_images/f?scale=1\" alt=\"LaTeX: f\" data-equation-content=\"f\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003ef\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e, a person would have to react: \u003cimg class=\"equation_image\" title=\"t_{react}=fT_{group}\" src=\"https://canvas.oregonstate.edu/equation_images/t_%257Breact%257D%253DfT_%257Bgroup%257D?scale=1\" alt=\"LaTeX: t_{react}=fT_{group}\" data-equation-content=\"t_{react}=fT_{group}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003et\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003ee\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ec\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmi\u003ef\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003cstrong\u003e. Briefly explain your reasoning.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eUsing your chosen fraction, write an expression for the time available for walking after the reaction delay but before the wave arrives: \u0 i\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e, the propagated uncertainty is \u003cimg class=\"equation_image\" title=\"\\Delta t_{walk} = (1-f)\\Delta T_{group}\" src=\"https://canvas.oregonstate.edu/equation_images/%255CDelta%2520t_%257Bwalk%257D%2520%253D%2520(1-f)%255CDelta%2520T_%257Bgroup%257D?scale=1\" alt=\"LaTeX: \\Delta t_{walk} = (1-f)\\Delta T_{group}\" data-equation-content=\"\\Delta t_{walk} = (1-f)\\Delta T_{group}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003et\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ew\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003el\u003c/mi\u003e\n      \u003cmi\u003ek\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n  \u003cmn\u003e1\u003c/mn\u003e\n  \u003cmo\u003e\u0026amp;#x2212;\u003c!-- − --\u003e\u003c/mo\u003e\n  \u003cmi\u003ef\u003c/mi\u003e\n  \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003eT\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e. If a quantity is defined as a constant fraction of a measured value, its uncertainty scales by the same fraction.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 4: Using Your Group Data to Place a Beach Safety Line\u003c/h3\u003e\n\u003cp\u003eIn this part, you will use your \u003cstrong\u003egroup walking speed\u003c/strong\u003e and \u003cstrong\u003ereaction-time model\u003c/strong\u003e to decide how far inland a safety line should be placed so that a typical beachgoer can realistically reach it before the surge (wave crest) arrives.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ9\u003c/span\u003e: Estimate the maximum distance a person could walk to safety.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eUsing your group walking speed, \u003cimg class=\"equation_image\" title=\"v_{group}\" src=\"https://canvas.oregonstate.edu/equation_images/v_%257Bgroup%257D?scale=1\" alt=\"LaTeX: v_{group}\" data-equation-content=\"v_{group}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmi\u003er\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003eu\u003c/mi\u003e\n      \u003cmi\u003ep\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c i\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003em\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ex\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n  \u003cmo\u003e\u0026amp;#x00B1;\u003c!-- ± --\u003e\u003c/mo\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmi\u003ed\u003c/mi\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBased on your result in part b and the uncertainty interval, choose a conservative safety-line distance from the waterline that you think is realistic for planners to use. State your recommended safety-line distance and explain how your choice relates to your uncertainty interval.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ10\u003c/span\u003e: Reflect on the activity using uncertainty propagation to inform safety and decision making. Each lab member should write an individual, concise paragraph reflecting on this lab. Identify each reflection by name. Your response should specifically address the following:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003e\u003cstrong\u003eOne new thing you learned about propagation of uncertainty\u003c/strong\u003e\u003cstrong\u003e and how it affected your results — either in your own measurements or in your group’s combined values (for example, how uncertainty changed your confidence in the walking speed, wave timing, or safety distance).\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHow your individual measurements compared to the group’s\u003c/strong\u003e\u003cstrong\u003e, such as differences in walking speed, wave period, or uncertainty spread. Briefly discuss how these differences influenced your confidence in the final safety-line decision.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHow this lab changed your thinking about real-world safety decisions\u003c/strong\u003e\u003cstrong\u003e that rely on measurements and uncertainty (such as evacuation planning, engineering limits, or public safety guidelines).\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 5: Capstone Component - Results\u003c/h3\u003e\n\u003cp\u003eIn scientific writing, the Results section presents the core findings of your experiment without interpretation or explanation. This section is critical because it forms the foundation for any analysis or conclusion that follows. Clear, accurate reporting of results allows others to understand your data and judge the validity of your experiment. In this lab, your group collected and analyzed data to estimate a realistic walking speed for a typical beachgoer, measured the wave period from video observations, modeled reaction delay, and used these results (with propagated uncertainty) to propose a safety-line distance.\u003c/p\u003e\n\u003cp\u003eIn this activity, you will practice writing a Results section that clearly reports these quantities and their uncertainties, along with any calculated values (such as reaction time, available walking time, and maximum safe distance). The goal is to communicate your findings accurately and concisely so that a reader could understand your results and evaluate your group’s safety-line recommendation based on the reported data alone. This exercise will help you build skills in scientific reporting and prepare you for writing full lab reports later in the term.\u003c/p\u003e\n\u003cp\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ11\u003c/span\u003e: Write a Results section for this lab experiment. Refer below as guidance how to structure the Results.\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003ch3\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cspan style=\"font-family: 'times new roman', times;\"\u003eI. \u003c/span\u003e\u003c/span\u003e\u003cu\u003eResults Structure:\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\n\u003col style=\"background: whitesmoke; border-left: 6px solid #d73f09; padding: 15px; margin: 20px 0 25px 0;\"\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003e\u003cspan\u003eOverview of the Experiment (1–2 sentences)\u003cem\u003e:\u003c/em\u003e\u003c/span\u003e\u003cspan\u003e\u003cem\u003e\u0026nbsp;What was the system you studied? \u003c/em\u003e\u003c/span\u003e\u003cspan\u003e\u003cem\u003eWhat type of data did you collect? \u003c/em\u003e\u003c/span\u003e\u003cspan\u003e\u003cem\u003eWhat was the goal of the experiment?\u003c/em\u003e\u003c/span\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u0026nbsp;\u003c/span\u003eWhat physical situation were you modeling and what measurements did you collect/estimate?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤ \u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003eWhat was the purpose of those measurements in relation to determining a safety line?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003eKey Quantitative Results (2–4 sentences) \u003c/span\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e \u003c/em\u003e\u003c/span\u003eWhat was the group walking speed, wave period, chosen available walking time?\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤ \u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003eWhere did your group place the beach safety line?\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003eVisual Representation of Results (1–2 sentences) \u003cem\u003eWhat plots or tables best communicate your findings? Reference them in the text or include it again here.\u003c/em\u003e\u003c/span\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e Indicate which tables best communicate your group’s results and their associated uncertainty intervals or include them again here.\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003eTrends and Patterns Observed (1–2 sentences) \u003cem\u003eWhat general behaviors did the data show? Did it support the expected model? How did you know the data supported/refuted the model?\u003c/em\u003e\u003c/span\u003e\n\u003cul style=\"list-style-type: none;\"\u003e\n\u003cli\u003e\u003cspan\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #e62429; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cspan class=\"symbol\" style=\"font-size: 12pt; color: #000000;\"\u003e➤\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u0026nbsp;\u003c/span\u003eYou may address how results varied between group members or time samples, which quantities showed the most spread or uncertainty, and whether group variation was larger than individual measurement uncertainty.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 6: Submit Your Group’s Lab Report\u003c/h3\u003e\n\u003cp\u003eMake sure everyone’s name is on your group’s lab report. If you submit through Gradescope, remember to add everyone in your group to the assignment. This is done at the end of the submission process.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca class=\"inline_disabled external\" href=\"https://help.gradescope.com/article/m5qz2xsnjy-student-add-group-members\" target=\"_blank\"\u003e\u003cspan\u003eHow to add group members to your submission in Gradescope is outlined here\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e"},"WIKI_PAGE_REVISION":"3","WIKI_PAGE_SHOW_PATH":"/courses/2053526/pages/lab-2-uncertainty-propagation","WIKI_PAGE_EDIT_PATH":"/courses/2053526/pages/lab-2-uncertainty-propagation/edit","WIKI_PAGE_HISTORY_PATH":"/courses/2053526/pages/lab-2-uncertainty-propagation/revisions","COURSE_ID":"2053526","MODULES_PATH":"/courses/2053526/modules","wiki_page_menu_tools":[],"wiki_index_menu_tools":[],"DISPLAY_SHOW_ALL_LINK":false,"CAN_SET_TODO_DATE":false,"ALLOW_ASSIGN_TO_DIFFERENTIATION_TAGS":true,"CAN_MANAGE_DIFFERENTIATION_TAGS":false,"EDITOR_FEATURE":null,"VALID_DATE_RANGE":{"start_at":{"date":"2026-06-21T07:00:00Z","date_context":"course"},"end_at":{"date":"2026-09-21T07:00:00Z","date_context":"course"}},"SECTION_LIST":[{"id":"2337362","name":"GENERAL PHYSICS WITH CALCULUS (PH_212_400_U2026)","start_at":null,"end_at":null,"override_course_and_term_dates":false}],"TITLE_AVAILABILITY_PATH":"/api/v1/courses/2053526/page_title_availability","ai_alt_text_generation_url":null,"badge_counts":{"submissions":7},"notices":[],"active_context_tab":"pages"};
