se,"body":"\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003ePH212 – General Physics with Calculus\u003c/span\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eActivity goal: Build community, learn how this course will work, and determine whether experimental results support a scientific claim based on uncertainty ranges.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWorking with a team is one of the most crucial skills in physics and other technical disciplines. You will likely collaborate with many people throughout your academic and non-academic careers, and employers frequently cite teamwork as one of the most valuable skills in job candidates. In this lab course, all of your work will be done in groups, so practicing these skills from the start is essential. If you run into issues with group communication or collaboration at any point in the course, don’t hesitate to reach out to your instructor or TA for support —learning how to work together is part of the process.\u003c/p\u003e\n\u003cp\u003eScientific measurements never produce a single exact value. Every result includes some amount of uncertainty. In this lab, you will also revisit the ideas of measurement uncertainty and statistical uncertainty, then apply them to real experimental data. Your goal is to determine whether small differences in measured acceleration reflect a true physical effect or whether they fall within the range of normal experimental variation. By the end of the activity, you will use total uncertainty to make, and justify, a scientific conclusion.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 191px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 191px;\"\u003e\n\u003ctd style=\"width: 99.92%; height: 191px;\"\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003e\u003cstrong\u003e\u003cu\u003eAs you work through the lab:\u003c/u\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde'; font-size: 14pt;\"\u003eQ#\u003c/span\u003e: Bold, numbered items reference things that need to be included in your lab report questions to answer, data, plots, or drawings\u003cbr\u003e\u003c/strong\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■ \u003c/span\u003eItems with a square bullet are action items you’ll need to do to progress through the lab.\u003cbr\u003e\u003cspan class=\"symbol\"\u003e➤ \u003c/span\u003eItems with an arrow are hints, tips, or things to keep in mind when completing tasks.\u003c/p\u003e\n\u003cp style=\"padding-left: 80px; text-align: center;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e\u003cem\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00;\"\u003eBoxed information is about either the expectations for your lab reports or key concepts for the course.\u003c/span\u003e\u003c/strong\u003e\u003c/em\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003e\u003cbr\u003eLearning Objectives\u003cbr\u003e\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003eLearning goal:\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003eBuild and practice skills for successful group work. \u003c/strong\u003e\u003cstrong\u003eRefresh their understanding of measurement and statistical uncertainty.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis lab activity is designed to help students practice the following skills:\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli\u003e\u003cspan\u003eIdentify behaviors that create a collaborative work environment.\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003eDevelop collaboration and communication within your lab group.\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eRefreshing and applying the concepts of measurement uncertainty and statistical uncertainty to experimental data.\u003c/li\u003e\n\u003cli\u003e\u003cspan\u003eC\u003c/span\u003eombining measurement and statistical uncertainty into a single total uncertainty using quadrature.\u003c/li\u003e\n\u003cli\u003eUsing uncertainty-based reasoning to justify scientific claims and draw conclusions from experimental results.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eRelated Documents\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e- Group Scheduling document\u003cbr\u003e- Lab TA availability document\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eEquipment\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: disc;\"\u003e\n\u003cli\u003eNone for lab 1\u003c/li\u003e\n\u003cli\u003eRefer to Lab materials page on canvas for future \u003ca title=\"Lab Supplies\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/lab-supplies\" data-course-type=\"wikiPages\" data-published=\"false\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/lab-supplies\" data-api-returntype=\"Page\"\u003elab supplies needed\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 0: Creating an Inclusive and Collaborative Lab Environment\u003c/h2\u003e\n\u003cp\u003eIn this course, we want to create an inclusive and collaborative learning environment in lab, where everyone can contribute their ideas, feel respected by their peers, and grow together as a learning community. To support this kind of environment, we would like to create a Lab Collaboration Contract that outlines shared expectations for how to be a respectful and reliable lab partner. Before we establish any formal agreements, we want \u003cem\u003eyou\u003c/em\u003e to help define what that environment should look like. You’re not just participants of the learning environment in lab — you’re co-authors of our lab community norms.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ1\u003c/span\u003e:\u003c/span\u003e\u003c/strong\u003e\u003cstrong\u003e\u0026nbsp;Reflect individually and identify the qualities you believe make someone a good lab partner and share them in the \u003ca title=\"Lab Partner Values Survey\" href=\"https://canvas.oregonstate.edu/courses/2053526/quizzes/3160536\" data-course-type=\"quizzes\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/quizzes/3160536\" data-api-returntype=\"Quiz\"\u003e“Lab Partner Values Survey”\u003c/a\u003e Canvas assignment. These submissions will be collected from the entire class and used to create the Lab Collaboration Contract for next week. Verify that you have fi\u003cspan\u003elled out the survey by responding to this question with a statement (include each person’s statement in the lab report.):\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■\u003c/span\u003e\u0026nbsp; I, [Insert Name], have filled out \u003cstrong\u003ethe Lab Partner Values Survey\u003c/strong\u003e\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBecause this is an online lab, communication, scheduling, and collaboration become especially important. Your group will work together outside of class time to complete lab activities and will also meet regularly with your lab TA to ask questions and receive feedback. These meetings are where your group discusses ideas, analyzes results, and builds your lab reports together — they are an essential part of your learning experience in this course.\u003c/p\u003e\n\u003cp\u003eIn this activity, you will first introduce yourself to your peers and find lab partners with similar schedules or preferred work days. After you have formed your group, you will work together to record your shared availability and select regular meeting times for the term.\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: square;\"\u003e\n\u003cli\u003e\u003cstrong\u003eNavigate to the \u003ca title=\"Course Introductions\" href=\"https://canvas.oregonstate.edu/courses/2053526/discussion_topics/11563802\" data-course-type=\"discussions\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/discussion_topics/11563802\" data-api-returntype=\"Discussion\"\u003eCourse Introductions Discussion Board\u003c/a\u003e\u003c/strong\u003e \u003cstrong\u003eand read through your classmates’ introductions. Use the prompt to introduce yourself to the class\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReply to four peers whose posts currently have fewer than four replies. These replies should help you begin identifying classmates with similar schedules, work preferences, or time zones.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThen, identify classmates whose schedules and work habits align well with yours. You may reply to peers or message them directly to coordinate.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOnce you have found a suitable set of collaborators:\u003c/strong\u003e\n\u003cul style=\"list-style-type: circle;\"\u003e\n\u003cli\u003e\u003cstrong\u003ejoin the same Canvas group under People → Groups\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003econfirm that all group members have joined successfully\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eensure you have at least one shared communication channel\u003cbr\u003e(Teams chat, group email thread, etc.)\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ2\u003c/span\u003e\u003c/span\u003e: Indicate that you have introduced yourself, interacted with peers, and identified a lab group using the statement below:\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■\u003c/span\u003e\u0026nbsp; \u003cstrong\u003eI, [Insert Name], have introduced myself in the Course Introductions Discussion Board, replied to at least four peers, and joined my lab group.\u003c/strong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003cul style=\"list-style-type: square;\"\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNavigate to your Group Scheduling Document linked in your \u003ca title=\"Lab 0 Discussion\" href=\"https://canvas.oregonstate.edu/courses/2053526/discussion_topics/11563804\" data-course-type=\"discussions\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/discussion_topics/11563804\" data-api-returntype=\"Discussion\"\u003eLab 1 Discussion Board\u003c/a\u003e\u003c/strong\u003e\u003ca title=\"Lab 0 Discussion\" href=\"https://canvas.oregonstate.edu/courses/2053526/discussion_topics/11563804\" data-course-type=\"discussions\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/discussion_topics/11563804\" data-api-returntype=\"Discussion\"\u003e\u003cstrong\u003e.\u003c/strong\u003e\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIdentify your group members and their contact information by clicking on “People” in the discussion. You can also message them using the Canvas Inbox tool and by making an announcement within the discussion board.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIdentify your lab TA and their availability on the TA Information page in the Course Information module\u003c/strong\u003e\u003cstrong\u003e. This page also includes their email address for questions throughout the course.\u003c/strong\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003c/strong\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ3\u003c/span\u003e\u003c/span\u003e: \u003c/strong\u003e\u003cstrong\u003eFill out your weekly availability and coordinate with your group. Verify that you have filled out your availability by responding to this question with a statement:\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■\u003c/span\u003e \u0026nbsp;\u003cstrong\u003eI, [Insert Name], have filled out my availability to the best of my ability.\u003c/strong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 152px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 152px;\"\u003e\n\u003ctd style=\"width: 99.92%; height: 152px;\"\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e\u003cstrong\u003e\u003cspan style=\"color: #cf4a00;\"\u003eMake sure to fill out your schedule as accurately and completely as possible. Your availability helps your group set consistent meeting times and coordinate with your TA, and it allows the instructional team to reorganize groups if schedules change or a member drops the course. Providing your best-accuracy availability ensures your group can function smoothly and share responsibilities fairly.\u0026nbsp;\u003c/span\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e\u003cstrong\u003espacer\u003c/strong\u003e\u003c/span\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\"list-style-type: square;\"\u003e\n\u003cli\u003e\u003cstrong\u003ePrepare for your experiments by ensuring you have all the necessary supplies for the term. Go to the Lab Materials page\u003c/strong\u003e\u003cstrong\u003e, review the list of required items, and determine which supplies you already have and which ones you still need to order. Pay attention to when each item is needed based on the week the experiment is scheduled.\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul style=\"list-style-type: circle;\"\u003e\n\u003cli style=\"width: 98%; max-width: 1000px;\"\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ4\u003c/span\u003e: Indicate that you have reviewed the \u003ca title=\"Lab Supplies\" href=\"https://canvas.oregonstate.edu/courses/2053526/pages/lab-supplies\" data-course-type=\"wikiPages\" data-published=\"false\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/pages/lab-supplies\" data-api-returntype=\"Page\"\u003eLab Materials\u003c/a\u003e page and identified which supplies you currently have and which you will still need to obtain with a brief confirmation statement:\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■\u003c/span\u003e \u0026nbsp;\u003cstrong\u003eI, [Insert Name], have reviewed the Lab Materials page and identified the supplies I have on hand and the items I still need to acquire for upcoming labs.\u003c/strong\u003e\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cstrong\u003e\u003cspan style=\"font-family: inherit; font-size: 1rem;\"\u003e\u003cspan class=\"symbol\"\u003e➤\u0026nbsp;\u0026nbsp;\u003c/span\u003e\u003c/span\u003e\u003c/strong\u003eStudents may optionally include any questions about supplies they plan to ask their TA during the first group meeting.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 1: Experimental and Measurement Uncertainty\u003c/h2\u003e\n\u003cp\u003eIn real experiments, every measurement represents a range of plausible values rather than a single exact number. Uncertainty contributes to this range and describes how confident we are in a reported value.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; background-color: whitesmoke; border-color: #d73f09; border-style: outset; float: left; height: 245.6px;\" border=\"2.5\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 245.6px;\"\u003e\n\u003ctd style=\"width: 99.92%; padding-left: 40px; padding-right: 40px; height: 245.6px;\"\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cu\u003eWhat is Uncertainty?\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eUncertainty\u003c/em\u003e is the acknowledgement that we cannot measure things exactly, and so any conclusion based on measurements will always include a range of possible answers. When making a measurement, there is no single “true value” of the measurand (measured quantity) that we can determine. Instead, we can define an interval that defines the range of values that we think are \u003cem\u003eprobable\u003c/em\u003e for the measurand. The narrower the interval, the more precisely we can approximate the measurand.\u003c/p\u003e\n\u003cp\u003eWhen including uncertainty in a value, we report it as \u003cstrong\u003eA ± Δ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. We believe the value is \u003cstrong\u003eA\u003c/strong\u003e, but we’re unable to rule out the possibility that it’s higher or lower by an amount \u003cstrong\u003eΔ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e. (Sometimes it’s written +Δ\u003csub\u003e1\u003c/sub\u003e / -Δ\u003csub\u003e2\u003c/sub\u003e if the higher and lower ranges are different.) For example, if we’re confident a time is between 2.42 and 2.48 s, it would be reported as 2.45 s ± 0.03 s.\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003espacer\u003c/span\u003e\u003c/p\u003e\n\u003ch2\u003eMeasurement Uncertainty\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eMeasurement uncertainty\u003c/strong\u003e comes from the limits of the measuring instrument. It is based on the smallest readable increment (for visual scales) or the least-significant digit (for digital displays), and is typically reported as \u003cstrong\u003eA ± Δ\u003csub\u003eA\u003c/sub\u003e\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eFor a single measurement, if you are using an instrument with a visual scale (like a ruler), the minimum uncertainty is just one half of the smallest increment you can read on the instrument.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; border-color: #000000; border-style: solid;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 33.3767%; text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705444/preview\" alt=\"A pressure gauge showing values from 0 to 4000 psi in 100 psi increments. The needle points slightly below the 800 psi mark.\" width=\"237\" height=\"259\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705444\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3767%; text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705443/preview\" alt=\"100 mL beaker filled with clear liquid, water level slightly above the 50 mL marking. The beaker has labeled graduations every 20 mL, with an indicated tolerance of ±5%.\" width=\"172\" height=\"250\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705443\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3767%; text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705445/preview\" alt=\"A close-up image of a marker tip  placed next to a green ruler with millimeter markings. The ruler starts around the 10 cm mark and extends beyond 15 cm. The tip of the marker aligns near the 15 cm mark. The ruler has tick marks at every 0.1 cm.\" width=\"100%\" height=\"100%\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705445\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 33.3767%; text-align: center;\"\u003e800 psi ± 50 psi\u003c/td\u003e\n\u003ctd style=\"width: 33.3767%; text-align: center;\"\u003e50 ml ± 5 ml\u003c/td\u003e\n\u003ctd style=\"width: 33.3767%; text-align: center;\"\u003e15.10 mm ± 0.05 mm\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003cbr\u003eFor devices with a digital read-out, the uncertainty is assumed to be in the least significant digit.\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; border-color: #000000; border-style: solid;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 33.3267%; text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705446/preview\" alt=\"A digital stopwatch display showing a time of 00:12.45 (12.45 seconds).\" width=\"263\" height=\"78\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705446\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3267%; text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705447/preview\" alt=\"A digital vernier caliper display showing a measurement of 9.95 millimeters. Buttons labeled ON/OFF, ZERO/ABS, and unit selection (in/mm) are visible.\" width=\"219\" height=\"166\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705447\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3267%; text-align: center;\"\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705448/preview\" alt=\"Digital scale display reading 20.428 grams. The measurement shows four decimal places.\" width=\"291\" height=\"59\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705448\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 33.3267%;\" width=\"208\"\u003e\n\u003cp style=\"text-align: center;\"\u003e12.45 sec ± 0.01 sec\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 33.3267%;\" width=\"208\"\u003e\n\u003cp style=\"text-align: center;\"\u003e9.95 mm ± 0.01 mm\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 33.3267%;\" width=\"208\"\u003e\n\u003cp style=\"text-align: center;\"\u003e2.0428 g ± 0.0001 g\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cspan style=\"color: #ffffff;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan class=\"symbol\"\u003e➤\u003c/span\u003e In general, you should round your nominal value so that it does not have more decimal places than your uncertainty (e.g. 25.456 kg \u003cstrong\u003e± \u003c/strong\u003e1 kg should be 25.5 kg \u003cstrong\u003e± \u003c/strong\u003e0.1 kg\u003cstrong\u003e)\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ5\u003c/span\u003e:\u003c/span\u003e \u0026nbsp;\u003c/strong\u003e\u003cstrong\u003eCorrect the following reported measurements\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 99.9628%; border-color: #000000; border-style: solid;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 33.3202%; text-align: center;\"\u003e\u003cstrong\u003e12.347\u0026nbsp;m ± 0.1\u0026nbsp;m\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3202%; text-align: center;\"\u003e\u003cstrong\u003e0.4567\u0026nbsp;s ± 0.02\u0026nbsp;s\u003c/strong\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3225%; text-align: center;\"\u003e\u003cstrong\u003e5.982\u0026nbsp;kg ± 0.5\u0026nbsp;kg\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 33.3202%; text-align: center;\"\u003e\u003cspan style=\"color: #cf4a00;\"\u003e\u003cstrong\u003e5.1) ?\u003c/strong\u003e\u003c/span\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3202%; text-align: center;\"\u003e\u003cspan style=\"color: #cf4a00;\"\u003e\u003cstrong\u003e5.2) ?\u003c/strong\u003e\u003c/span\u003e\u003c/td\u003e\n\u003ctd style=\"width: 33.3225%; text-align: center;\"\u003e\u003cspan style=\"color: #cf4a00;\"\u003e\u003cstrong\u003e5.3) ?\u003c/strong\u003e\u003c/span\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ6\u003c/span\u003e:\u003c/span\u003e \u0026nbsp;Determine the measurement uncertainty of the three examples below.\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; height: 395.6px; border-color: #000000; border-style: solid;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 372.8px;\"\u003e\n\u003ctd style=\"width: 33.2714%; text-align: center; height: 372.8px;\"\u003e\n\u003cp\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705434/preview\" alt=\"A digital angle gauge displaying a reading of 11.6 degrees on a bright green backlit screen. The device has two buttons labeled “ON/OFF” and “ZERO,” and the brand name “Wixey” appears at the top of the display.\" width=\"215\" height=\"182\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705434\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003eThis gauge measures in degrees.\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 33.2714%; text-align: center; height: 372.8px;\"\u003e\n\u003cp\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705433/preview\" alt=\"A 25-milliliter Kimax glass Erlenmeyer flask partially filled with blue liquid. The volume markings on the side show graduations up to 25 mL, with the liquid level just below the 20 mL mark. The flask is sitting on a wooden surface.\" width=\"142\" height=\"269\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705433\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003eConical flask measures in ml. Maximum measurement of the flask is 25 ml.\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 33.4004%; text-align: center; height: 372.8px;\"\u003e\n\u003cp\u003e\u003cimg src=\"https://canvas.oregonstate.edu/courses/2053526/files/118705435/preview\" alt=\"A circular analog thermometer with a white face and black markings, labeled in degrees Celsius from –50°C to 60°C. The needle is pointing to approximately 30°C. The center of the dial displays the brand name “Thermosense” and the standard marking “EN13190.”\" width=\"231\" height=\"223\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/files/118705435\" data-api-returntype=\"File\" loading=\"lazy\"\u003e\u003c/p\u003e\n\u003cp\u003eTemperature gauge measures in Celsius.\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 22.8px;\"\u003e\n\u003ctd style=\"width: 33.2714%; text-align: center; height: 22.8px;\"\u003e\n\u003cp\u003e\u003cspan style=\"color: #cf4a00;\"\u003e\u003cstrong\u003e6.1) ?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 33.2714%; text-align: center; height: 22.8px;\"\u003e\n\u003cp\u003e\u003cspan style=\"color: #cf4a00;\"\u003e\u003cstrong\u003e6.2) ?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 33.4004%; text-align: center; height: 22.8px;\"\u003e\n\u003cp\u003e\u003cspan style=\"color: #cf4a00;\"\u003e\u003cstrong\u003e6.3) ?\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2\u003eStatistical Uncertainty\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eStatistical uncertainty\u003c/strong\u003e comes from variation across repeated trials. When we measure the same quantity multiple times, the values will not be identical. The spread of those measurements tells us how consistent the result is.\u003c/p\u003e\n\u003cp class=\"p2\" style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤\u003c/span\u003e A common way to express this uncertainty is using the standard deviation:\u003c/strong\u003e\u003c/p\u003e\n\u003cp class=\"p2\" style=\"text-align: center;\"\u003e\u003cstrong\u003e\u003cimg class=\"equation_image\" title=\"\\sigma = \\sqrt{\\frac{\\sum(x_i-\\mu)^2}{N}}\" src=\"https://canvas.oregonstate.edu/equation_images/%255Csigma%2520%253D%2520%255Csqrt%257B%255Cfrac%257B%255Csum(x_i-%255Cmu)%255E2%257D%257BN%257D%257D?scale=1\" alt=\"LaTeX: \\sigma = \\sqrt{\\frac{\\sum(x_i-\\mu)^2}{N}}\" data-equation-content=\"\\sigma = \\sqrt{\\frac{\\sum(x_i-\\mu)^2}{N}}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03C3;\u003c!-- σ --\u003e\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmsqrt\u003e\n    \u003cmfrac\u003e\n      \u003cmrow\u003e\n        \u003cmo\u003e\u0026amp;#x2211;\u003c!-- ∑ --\u003e\u003c/mo\u003e\n        \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e(\u003c/mo\u003e\n        \u003cmsub\u003e\n          \u003cmi\u003ex\u003c/mi\u003e\n          \u003cmi\u003ei\u003c/mi\u003e\n        \u003c/msub\u003e\n        \u003cmo\u003e\u0026amp;#x2212;\u003c!-- − --\u003e\u003c/mo\u003e\n        \u003cmi\u003e\u0026amp;#x03BC;\u003c!-- μ --\u003e\u003c/mi\u003e\n        \u003cmsup\u003e\n          \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n          \u003cmn\u003e2\u003c/mn\u003e\n        \u003c/msup\u003e\n      \u003c/mrow\u003e\n      \u003cmi\u003eN\u003c/mi\u003e\n    \u003c/mfrac\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003ewhere N is the number of trials, x\u003csub\u003ei\u003c/sub\u003e is each value from the trials, and μ is the average value of the trials.\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cspan class=\"symbol\"\u003e➤\u003c/span\u003e \u003cstrong\u003eAnother method for calculating this uncertainty is to take half of the difference between the largest and smallest measurement you made.\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 100%; border-color: #000000; border-style: solid;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eTrial 1\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eTrial 2\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eTrial 3\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eTrial 4\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eTrial 5\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.1316%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eAverage\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003eMass of object (g)\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e0.56\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e0.58\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e0.50\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e0.52\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.3176%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e0.56\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 14.1316%;\" width=\"89\"\u003e\n\u003cp\u003e\u003cspan style=\"font-size: 12pt;\"\u003e0.54\u003c/span\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u0026nbsp;In the example, measuring the mass of an object, the uncertainty, \u003cimg class=\"equation_image\" title=\"\\sigma\" src=\"https://canvas.oregonstate.edu/equation_images/%255Csigma?scale=1\" alt=\"LaTeX: \\sigma\" data-equation-content=\"\\sigma\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03C3;\u003c!-- σ --\u003e\u003c/mi\u003e\n\u003c/math\u003e\"\u003e, would be \u003cimg class=\"equation_image\" title=\"\\sigma=\\frac{Max - Min}{2}=\\frac{0.58 g - 0.50 g}{2}=0.04g.\" src=\"https://canvas.oregonstate.edu/equation_images/%255Csigma%253D%255Cfrac%257BMax%2520-%2520Min%257D%257B2%257D%253D%255Cfrac%257B0.58%2520g%2520-%25200.50%2520g%257D%257B2%257D%253D0.04g.?scale=1\" alt=\"LaTeX: \\sigma=\\frac{Max - Min}{2}=\\frac{0.58 g - 0.50 g}{2}=0.04g.\" data-equation-content=\"\\sigma=\\frac{Max - Min}{2}=\\frac{0.58 g - 0.50 g}{2}=0.04g.\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmi\u003e\u0026amp;#x03C3;\u003c!-- σ --\u003e\u003c/mi\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmrow\u003e\n      \u003cmi\u003eM\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ex\u003c/mi\u003e\n      \u003cmo\u003e\u0026amp;#x2212;\u003c!-- − --\u003e\u003c/mo\u003e\n      \u003cmi\u003eM\u003c/mi\u003e\n      \u003cmi\u003ei\u003c/mi\u003e\n      \u003cmi\u003en\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmfrac\u003e\n    \u003cmrow\u003e\n      \u003cmn\u003e0.58\u003c/mn\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n      \u003cmo\u003e\u0026amp;#x2212;\u003c!-- − --\u003e\u003c/mo\u003e\n      \u003cmn\u003e0.50\u003c/mn\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mrow\u003e\n    \u003cmn\u003e2\u003c/mn\u003e\n  \u003c/mfrac\u003e\n  \u003cmo\u003e=\u003c/mo\u003e\n  \u003cmn\u003e0.04\u003c/mn\u003e\n  \u003cmi\u003eg\u003c/mi\u003e\n  \u003cmo\u003e.\u003c/mo\u003e\n\u003c/math\u003e\"\u003e The mass of the object is 0.54 g ± 0.04 g.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ7\u003c/span\u003e:\u003c/span\u003e \u0026nbsp;Determine the statistical uncertainty of the table below.\u003c/strong\u003e\u003c/p\u003e\n\u003ctable style=\"border-collapse: collapse; width: 99.9628%; height: 264px; border-color: #000000; border-style: solid;\" border=\"1\"\u003e\n\u003ctbody\u003e\n\u003ctr style=\"height: 28.8px;\"\u003e\n\u003ctd style=\"height: 105.6px; width: 12.4628%; text-align: center;\" rowspan=\"2\"\u003e\n\u003cp\u003eObject #\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"height: 28.8px; width: 87.2396%; text-align: center;\" colspan=\"7\"\u003eMass of Object (g)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 76.8px;\"\u003e\n\u003ctd style=\"width: 12.4628%; height: 76.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003eTrial 1\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 76.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003eTrial 2\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 76.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003eTrial 3\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 76.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003eTrial 4\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 76.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003eTrial 5\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 76.8px; text-align: center;\" width=\"82\"\u003e\n\u003cp\u003eAverage\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 76.8px; text-align: center;\" width=\"90\"\u003e\n\u003cp\u003eStatistical Uncertainty\u003c/p\u003e\n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 52.8px;\"\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"78\"\u003e\n\u003cp\u003e\u003cstrong\u003e1\u003c/strong\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e0.53\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e0.55\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e0.54\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e0.56\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e0.52\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"82\"\u003e\n\u003cp\u003e0.54\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"90\"\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde';\"\u003e\u003cstrong\u003e?\u003c/strong\u003e\u003c/span\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 52.8px;\"\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"78\"\u003e\n\u003cp\u003e\u003cstrong\u003e2\u003c/strong\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e1.12\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e1.10\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e1.14\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e1.09\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e1.15\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"82\"\u003e\n\u003cp\u003e1.12\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"90\"\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde';\"\u003e\u003cstrong\u003e?\u003c/strong\u003e\u003c/span\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr style=\"height: 52.8px;\"\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"78\"\u003e\n\u003cp\u003e\u003cstrong\u003e3\u003c/strong\u003e\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e2.03\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e2.01\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e2.06\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e1.98\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"75\"\u003e\n\u003cp\u003e2.02\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"82\"\u003e\n\u003cp\u003e2.02\u003c/p\u003e\n\u003c/td\u003e\n\u003ctd style=\"width: 12.4628%; height: 52.8px; text-align: center;\" width=\"90\"\u003e\u003cspan style=\"color: #cf4a00; font-family: 'arial black', 'avant garde';\"\u003e\u003cstrong\u003e?\u003c/strong\u003e\u003c/span\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch2 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 2: Applying Uncertainty to Experimental Data\u003c/h2\u003e\n\u003cp\u003eMeasurement uncertainty and statistical uncertainty are the recognition that every measured quantity represents a range of plausible values rather than a single exact number. In real experiments, different trials of the same measurement will never produce identical results, and small variations in the data do not automatically imply that a real physical difference exists. To make meaningful scientific conclusions, we must not only calculate measurement values but also quantify their associated uncertainties and compare whether those uncertainty ranges overlap.\u003c/p\u003e\n\u003cp\u003eIn this activity, you will apply these ideas to a physical system involving motion on a track. A cart moves along a straight track under an approximately constant net force. The group tests whether the measured acceleration depends on the cart’s initial velocity, \u003cimg class=\"equation_image\" title=\"v_0\" src=\"https://canvas.oregonstate.edu/equation_images/v_0?scale=1\" alt=\"LaTeX: v_0\" data-equation-content=\"v_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e. For each value of \u003cimg class=\"equation_image\" title=\"v_0\" src=\"https://canvas.oregonstate.edu/equation_images/v_0?scale=1\" alt=\"LaTeX: v_0\" data-equation-content=\"v_0\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ev\u003c/mi\u003e\n    \u003cmn\u003e0\u003c/mn\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e, they measure the acceleration three times (for example, from three velocity–time fits) and use the resulting values to compute both statistical and total uncertainty before drawing conclusions.\u003c/p\u003e ot;false\u0026quot;\u003e(\u003c/mo\u003e\n    \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n    \u003cmsub\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n        \u003cmi\u003em\u003c/mi\u003e\n        \u003cmi\u003ee\u003c/mi\u003e\n        \u003cmi\u003ea\u003c/mi\u003e\n        \u003cmi\u003es\u003c/mi\u003e\n      \u003c/mrow\u003e\n    \u003c/msub\u003e\n    \u003cmsup\u003e\n      \u003cmo stretchy=\u0026quot;false\u0026quot;\u003e)\u003c/mo\u003e\n      \u003cmn\u003e2\u003c/mn\u003e\n    \u003c/msup\u003e\n  \u003c/msqrt\u003e\n\u003c/math\u003e\"\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003eThis is called adding in quadrature. This same formula can be extended and used for any number of sources by changing how many terms are under the square root. If a source is negligible, you can omit it from the formula.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cspan\u003e\u003cstrong\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ9\u003c/span\u003e: Using your results for each trial, report two example values of the average acceleration and their corresponding total uncertainties in the form: \u003cimg class=\"equation_image\" title=\"a_{avg} \\pm \\Delta a_{total}\" src=\"https://canvas.oregonstate.edu/equation_images/a_%257Bavg%257D%2520%255Cpm%2520%255CDelta%2520a_%257Btotal%257D?scale=1\" alt=\"LaTeX: a_{avg} \\pm \\Delta a_{total}\" data-equation-content=\"a_{avg} \\pm \\Delta a_{total}\" data-ignore-a11y-check=\"\" loading=\"lazy\" x-canvaslms-safe-mathml=\"\u003cmath xmlns=\u0026quot;http://www.w3.org/1998/Math/MathML\u0026quot;\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ea\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003ev\u003c/mi\u003e\n      \u003cmi\u003eg\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n  \u003cmo\u003e\u0026amp;#x00B1;\u003c!-- ± --\u003e\u003c/mo\u003e\n  \u003cmi mathvariant=\u0026quot;normal\u0026quot;\u003e\u0026amp;#x0394;\u003c!-- Δ --\u003e\u003c/mi\u003e\n  \u003cmsub\u003e\n    \u003cmi\u003ea\u003c/mi\u003e\n    \u003cmrow class=\u0026quot;MJX-TeXAtom-ORD\u0026quot;\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003eo\u003c/mi\u003e\n      \u003cmi\u003et\u003c/mi\u003e\n      \u003cmi\u003ea\u003c/mi\u003e\n      \u003cmi\u003el\u003c/mi\u003e\n    \u003c/mrow\u003e\n  \u003c/msub\u003e\n\u003c/math\u003e\"\u003e. \u0026nbsp;Choose one trial at a low initial velocity and one at a high initial velocity (e.g., 0.85\u0026nbsp;0.12 m/s\u003csup\u003e2\u003c/sup\u003e).\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col\u003e\n\u003cli style=\"list-style-type: none;\"\u003e\n\u003col style=\"list-style-type: upper-alpha;\"\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eReport the two acceleration values and their corresponding total uncertainties for your chosen low-\u003cem\u003ev\u003csub\u003e0\u003c/sub\u003e\u003c/em\u003e \u003c/strong\u003e\u003cstrong\u003eand high-\u003cem\u003ev\u003csub\u003e0 \u003c/sub\u003e\u003c/em\u003etrials.\u003c/strong\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDo the uncertainty intervals for these trials overlap?\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003eBased on your results, does the measured acceleration depend on the cart’s initial velocity \u003cem\u003ev\u003csub\u003e0\u003c/sub\u003e\u003c/em\u003e\u003c/strong\u003e\u003cstrong\u003e? State your conclusion and justify it using the uncertainty analysis from part b.\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp class=\"p2\" style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤\u0026nbsp; \u003c/span\u003e\u003c/strong\u003eIf two values have \u003cstrong\u003eoverlapping uncertainty ranges\u003c/strong\u003e, the measurements are \u003cstrong\u003estatistically consistent\u003c/strong\u003e with having the same value and the experiment cannot distinguish between them.\u003c/p\u003e\n\u003cp class=\"p2\" style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan class=\"symbol\"\u003e➤ \u0026nbsp;\u003c/span\u003e\u003c/strong\u003eIf the ranges \u003cstrong\u003edo not overlap\u003c/strong\u003e, the difference is meaningful.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 3: Decide on Meeting Times as a Group\u003c/h3\u003e\n\u003cp\u003eNow that you’ve explored what makes an effective team and practiced thinking like scientists, it’s time to start building your group’s routine. Regular meetings are essential for staying on track, collaborating on labs, and getting support from your TA. Coordinate with your group to finalize your weekly meeting time and schedule check-ins with your lab TA. These group meetings with your TA will start next week to discuss Lab 2.\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ10\u003c/span\u003e\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003e\u0026nbsp;Discuss your availability with your group members to find times that you can meet weekly as a group. Indicate your chosen time. \u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"padding-left: 40px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cspan style=\"font-family: 'arial black', 'avant garde'; color: #cf4a00; font-size: 18pt;\"\u003eQ11\u003c/span\u003e\u003c/span\u003e:\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003e Settle on a time you can meet weekly with your Lab TA and secure that time in their Availability Google Document (a link to their availability is found on the TA Information page in the Course Information). You will be choosing a TA that fits with your group availability to meet weekly. Once you choose a time in their Google Document, \u003cspan style=\"color: #cf4a00;\"\u003eemail them your chosen group time so that they can confirm schedule zoom meetings for the whole term. These meetings will start next week to discuss Lab 2.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\"padding-left: 80px;\"\u003e\u003cstrong\u003e\u003cspan\u003e\u003cstrong style=\"font-family: inherit; font-size: 1rem;\"\u003e\u003cspan style=\"font-size: 14pt;\"\u003e■\u003c/span\u003e\u003c/strong\u003e\u0026nbsp; If you have time conf\u003c/span\u003elicts within your group or your group has time conflicts with your lab TA, please email them as soon as possible so that accommodations can be made.\u003c/strong\u003e\u003cstrong\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003ch3 style=\"border-bottom: 2px solid #dc4405; font-size: 18pt;\"\u003ePart 4: Submit Your Lab Report (Individual Submission)\u003c/h3\u003e\n\u003cp\u003eFor this first lab, each student will submit their own lab report individually. Group lab reports will begin starting next week once groups have been finalized. Submit your completed lab report responses to \u003ca title=\"Lab 0 Group Report\" href=\"https://canvas.oregonstate.edu/courses/2053526/assignments/10557057\" data-course-type=\"assignments\" data-published=\"true\" data-api-endpoint=\"https://canvas.oregonstate.edu/api/v1/courses/2053526/assignments/10557057\" data-api-returntype=\"Assignment\"\u003eGradescope\u003c/a\u003e.\u003c/p\u003e"},"WIKI_PAGE_REVISION":"6","WIKI_PAGE_SHOW_PATH":"/courses/2053526/pages/lab-1-team-building-and-uncertainty-refresher","WIKI_PAGE_EDIT_PATH":"/courses/2053526/pages/lab-1-team-building-and-uncertainty-refresher/edit","WIKI_PAGE_HISTORY_PATH":"/courses/2053526/pages/lab-1-team-building-and-uncertainty-refresher/revisions","COURSE_ID":"2053526","MODULES_PATH":"/courses/2053526/modules","wiki_page_menu_tools":[],"wiki_index_menu_tools":[],"DISPLAY_SHOW_ALL_LINK":false,"CAN_SET_TODO_DATE":false,"ALLOW_ASSIGN_TO_DIFFERENTIATION_TAGS":true,"CAN_MANAGE_DIFFERENTIATION_TAGS":false,"EDITOR_FEATURE":null,"VALID_DATE_RANGE":{"start_at":{"date":"2026-06-21T07:00:00Z","date_context":"course"},"end_at":{"date":"2026-09-21T07:00:00Z","date_context":"course"}},"SECTION_LIST":[{"id":"2337362","name":"GENERAL PHYSICS WITH CALCULUS (PH_212_400_U2026)","start_at":null,"end_at":null,"override_course_and_term_dates":false}],"TITLE_AVAILABILITY_PATH":"/api/v1/courses/2053526/page_title_availability","ai_alt_text_generation_url":null,"badge_counts":{"submissions":21},"notices":[],"active_context_tab":"pages"};
